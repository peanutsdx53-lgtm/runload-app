name: Correct RunLoad Mobile Home Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runload-mobile-home-fix-20261005.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correct import ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/interactions/mobileHomeInteractions.js')
          s = p.read_text()
          s = s.replace('  HOME_COLUMNS,\n  MAX_HOME_PAGES,\n  findNearestFreePlacement,', '  HOME_COLUMNS,\n  findNearestFreePlacement,', 1)
          anchor = '  ALL_ITEM_ID_SET,\n  DEFAULT_LAYOUT,\n'
          block = s[s.rfind('import {', 0, s.find('from "./mobileHomeLayoutState.js";')):s.find('from "./mobileHomeLayoutState.js";')]
          if 'MAX_HOME_PAGES' not in block:
              if anchor not in s:
                  raise SystemExit('layout import anchor missing')
              s = s.replace(anchor, anchor + '  MAX_HOME_PAGES,\n', 1)
          p.write_text(s)
          PY
      - name: Verify module linkage
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/interactions/mobileHomeInteractions.js
          node --input-type=module -e "import('./ui/interactions/mobileHomeInteractions.js')"
          node tests/mobileHomeDefaultLayout.test.mjs
      - name: Full non-browser regression
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do
            [[ "$test_file" == *mobileWalkJogBrowserFlow.test.mjs ]] && continue
            node "$test_file" >/dev/null
          done
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/interactions/mobileHomeInteractions.js
          git diff --cached --quiet && exit 0
          git commit -m "Correct mobile Home page-limit import"
          git push origin HEAD:main
