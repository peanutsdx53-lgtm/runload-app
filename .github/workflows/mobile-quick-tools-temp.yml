name: Mobile quick tools temporary integration

on:
  push:
    branches:
      - feature/mobile-quick-tools-20260927
    paths:
      - .github/workflows/mobile-quick-tools-temp.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact integration edits
        run: |
          set -euo pipefail
          cat > /tmp/integrate.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Home launcher: add three optional smartphone-only app icons and hidden catalog.
          replace_once('screens/homeScreen.js',
          '''    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2m0 13v2M3.5 12h2m13 0h2M6 6l1.4 1.4m9.2 9.2L18 18M18 6l-1.4 1.4m-9.2 9.2L6 18"/>',
          ''',
          '''    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2m0 13v2M3.5 12h2m13 0h2M6 6l1.4 1.4m9.2 9.2L18 18M18 6l-1.4 1.4m-9.2 9.2L6 18"/>',
              "location-note": '<path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/>',
              "quick-note": '<path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12h6M8 15h5"/>',
              "gear-note": '<path d="M5 8.5h14v10H5z"/><path d="M9 8.5V6.8c0-1 .8-1.8 1.8-1.8h2.4c1 0 1.8.8 1.8 1.8v1.7M5 12h14M10 12v1.5h4V12"/>',
          ''')

          replace_once('screens/homeScreen.js',
          '''function renderMobileLauncherItem({ href, label, icon, tone = "blue", dock = false }) {
            const className = dock ? "mobile-home-dock__item" : "mobile-home-app";
            const iconClass = dock ? "mobile-home-dock__icon" : "mobile-home-app__icon";
            return `<a class="${className}" href="${escapeHtml(href)}"><span class="${iconClass} mobile-home-tone--${escapeHtml(tone)}">${mobileHomeIcon(icon)}</span><span class="${dock ? "mobile-home-dock__label" : "mobile-home-app__label"}">${escapeHtml(label)}</span></a>`;
          }
          ''',
          '''function renderMobileLauncherItem({ href, label, icon, tone = "blue", dock = false, optional = false }) {
            const className = dock ? "mobile-home-dock__item" : "mobile-home-app";
            const iconClass = dock ? "mobile-home-dock__icon" : "mobile-home-app__icon";
            const labelClass = dock ? "mobile-home-dock__label" : "mobile-home-app__label";
            const content = `<span class="${iconClass} mobile-home-tone--${escapeHtml(tone)}">${mobileHomeIcon(icon)}</span><span class="${labelClass}">${escapeHtml(label)}</span>`;
            if (!optional) return `<a class="${className}" href="${escapeHtml(href)}">${content}</a>`;
            return `<div class="${className} mobile-home-app--optional" data-home-optional-app><a class="mobile-home-app__launch" href="${escapeHtml(href)}" aria-label="${escapeHtml(label)}">${content}</a><button type="button" class="mobile-home-app-remove" data-home-app-remove aria-label="${escapeHtml(label)}をホームから外す">−</button></div>`;
          }
          ''')

          replace_once('screens/homeScreen.js',
          '''  const dock = [
          ''',
          '''  const optionalApps = [
              { href: "#/location-note", label: "地点メモ", icon: "location-note", tone: "cyan", optional: true },
              { href: "#/quick-note", label: "1分メモ", icon: "quick-note", tone: "violet", optional: true },
              { href: "#/gear-note", label: "装備メモ", icon: "gear-note", tone: "orange", optional: true },
            ];
            const dock = [
          ''')

          replace_once('screens/homeScreen.js',
          '''    <section class="mobile-home-apps" aria-label="機能">
                ${apps.map((item) => renderMobileLauncherItem(item)).join("")}
              </section>
              <nav class="mobile-home-dock" aria-label="よく使う機能">
          ''',
          '''    <section class="mobile-home-apps" aria-label="機能">
                ${apps.map((item) => renderMobileLauncherItem(item)).join("")}
              </section>
              <div class="mobile-home-app-catalog" data-home-app-catalog hidden aria-hidden="true">
                ${optionalApps.map((item) => renderMobileLauncherItem(item)).join("")}
              </div>
              <nav class="mobile-home-dock" aria-label="よく使う機能">
          ''')

          # Home editor: optional app catalog and compatibility-safe validation.
          replace_once('ui/interactions/homeInteractions.js',
          '''const ITEM_ID_BY_HREF = Object.freeze([
          ''',
          '''const OPTIONAL_APP_CATALOG = Object.freeze([
            Object.freeze({ id: "location-note", label: "地点メモ", description: "現在地と短いメモを保存" }),
            Object.freeze({ id: "quick-note", label: "1分メモ", description: "気づきを短く残す" }),
            Object.freeze({ id: "gear-note", label: "装備メモ", description: "その日の装備を保存" }),
          ]);
          const OPTIONAL_ITEM_IDS = Object.freeze(OPTIONAL_APP_CATALOG.map((item) => item.id));

          const ITEM_ID_BY_HREF = Object.freeze([
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''  ["#/settings", "settings"],
          ''',
          '''  ["#/settings", "settings"],
            ["#/location-note", "location-note"],
            ["#/quick-note", "quick-note"],
            ["#/gear-note", "gear-note"],
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''const ALL_ITEM_IDS = Object.freeze([...DEFAULT_LAYOUT.pages.flat(), ...DEFAULT_LAYOUT.dock]);
          const ALL_ITEM_ID_SET = new Set(ALL_ITEM_IDS);
          ''',
          '''const REQUIRED_ITEM_IDS = Object.freeze([...DEFAULT_LAYOUT.pages.flat(), ...DEFAULT_LAYOUT.dock]);
          const ALL_ITEM_IDS = Object.freeze([...REQUIRED_ITEM_IDS, ...OPTIONAL_ITEM_IDS]);
          const ALL_ITEM_ID_SET = new Set(ALL_ITEM_IDS);
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''      if (!validTokens
                  || allApps.length !== ALL_ITEM_IDS.length
                  || new Set(allApps).size !== ALL_ITEM_IDS.length
                  || !allApps.every((id) => ALL_ITEM_ID_SET.has(id))
                  || widgetIds.length !== DEFAULT_WIDGET_ORDER.length
          ''',
          '''      if (!validTokens
                  || new Set(allApps).size !== allApps.length
                  || !allApps.every((id) => ALL_ITEM_ID_SET.has(id))
                  || !REQUIRED_ITEM_IDS.every((id) => allApps.includes(id))
                  || widgetIds.length !== DEFAULT_WIDGET_ORDER.length
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''      if (allApps.length !== ALL_ITEM_IDS.length
                  || new Set(allApps).size !== ALL_ITEM_IDS.length
                  || !allApps.every((id) => ALL_ITEM_ID_SET.has(id))) {
          ''',
          '''      if (new Set(allApps).size !== allApps.length
                  || !allApps.every((id) => ALL_ITEM_ID_SET.has(id))
                  || !REQUIRED_ITEM_IDS.every((id) => allApps.includes(id))) {
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''function prepareItems(root) {
            root.querySelectorAll(".mobile-home-apps .mobile-home-app, .mobile-home-dock .mobile-home-dock__item").forEach((item) => {
              const id = itemIdFromHref(item.getAttribute("href"));
              if (!id) return;
              item.dataset.homeItemId = id;
              item.dataset.homeZone = item.closest(".mobile-home-dock") ? "dock" : "apps";
              item.setAttribute("draggable", "false");
            });
          }
          ''',
          '''function prepareItems(root) {
            root.querySelectorAll(".mobile-home-apps .mobile-home-app, .mobile-home-dock .mobile-home-dock__item, [data-home-app-catalog] .mobile-home-app").forEach((item) => {
              const href = item.getAttribute("href") || item.querySelector("a[href]")?.getAttribute("href") || "";
              const id = itemIdFromHref(href);
              if (!id) return;
              item.dataset.homeItemId = id;
              item.dataset.homeZone = item.closest(".mobile-home-dock") ? "dock" : "apps";
              item.setAttribute("draggable", "false");
            });
          }
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''    addButton.setAttribute("aria-label", "ウィジェットを追加");
          ''',
          '''    addButton.setAttribute("aria-label", "ホームに追加");
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''    <button type="button" class="mobile-home-widget-picker__backdrop" data-home-widget-picker-close aria-label="ウィジェット追加を閉じる"></button>
              <section class="mobile-home-widget-picker__sheet" role="dialog" aria-modal="true" aria-labelledby="home-widget-picker-title">
                <header class="mobile-home-widget-picker__header">
                  <h2 id="home-widget-picker-title">ウィジェットを追加</h2>
          ''',
          '''    <button type="button" class="mobile-home-widget-picker__backdrop" data-home-widget-picker-close aria-label="ホームへの追加を閉じる"></button>
              <section class="mobile-home-widget-picker__sheet" role="dialog" aria-modal="true" aria-labelledby="home-widget-picker-title">
                <header class="mobile-home-widget-picker__header">
                  <h2 id="home-widget-picker-title">ホームに追加</h2>
          ''')

          old_picker = '''function refreshWidgetPicker(root) {
            const overlay = ensureWidgetPicker(root);
            const list = overlay.querySelector("[data-home-widget-picker-list]");
            if (!list) return;
            const visible = new Set([...root.querySelectorAll("[data-home-widget-id]:not([hidden])")].map((item) => item.dataset.homeWidgetId));
            const available = WIDGET_CATALOG.filter((item) => !visible.has(item.id));
            if (!available.length) {
              list.innerHTML = '<p class="mobile-home-widget-picker__empty">追加できるウィジェットはありません。</p>';
              return;
            }
            list.innerHTML = available.map((item) => `<button type="button" class="mobile-home-widget-picker__option" data-home-widget-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("");
          }
          '''
          new_picker = '''function refreshWidgetPicker(root) {
            const overlay = ensureWidgetPicker(root);
            const list = overlay.querySelector("[data-home-widget-picker-list]");
            if (!list) return;
            const visibleWidgets = new Set([...root.querySelectorAll("[data-home-widget-id]:not([hidden])")].map((item) => item.dataset.homeWidgetId));
            const availableWidgets = WIDGET_CATALOG.filter((item) => !visibleWidgets.has(item.id));
            const installedApps = new Set([...root.querySelectorAll(".mobile-home-page [data-home-item-id], .mobile-home-dock [data-home-item-id]")].map((item) => item.dataset.homeItemId));
            const availableApps = OPTIONAL_APP_CATALOG.filter((item) => !installedApps.has(item.id));
            const groups = [];
            if (availableApps.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">アプリアイコン</p>${availableApps.map((item) => `<button type="button" class="mobile-home-widget-picker__option" data-home-app-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
            if (availableWidgets.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">ウィジェット</p>${availableWidgets.map((item) => `<button type="button" class="mobile-home-widget-picker__option" data-home-widget-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
            list.innerHTML = groups.join("") || '<p class="mobile-home-widget-picker__empty">追加できる項目はありません。</p>';
          }
          '''
          replace_once('ui/interactions/homeInteractions.js', old_picker, new_picker)

          replace_once('ui/interactions/homeInteractions.js',
          '''  function handleWidgetPickerPointerUp(event) {
              const option = event.target.closest("[data-home-widget-add-id]");
              if (!option) return;
              event.preventDefault();
              event.stopPropagation();
              addWidget(option.dataset.homeWidgetAddId);
            }
          ''',
          '''  function addOptionalApp(id) {
              const item = root.querySelector(`[data-home-app-catalog] [data-home-item-id="${id}"]`);
              if (!item || !OPTIONAL_ITEM_IDS.includes(id)) return;
              const page = currentPageElement();
              const grid = pageContainers(page).grid;
              if (!grid) return;
              grid.append(item);
              setItemZone(item, "apps");
              const token = appToken(id);
              const placements = placementsForPage(page).filter((entry) => entry.token !== token);
              const free = findNearestFreePlacement(placements, token, { row: 1, col: 1 }, {
                widgetSizes: currentWidgetSizes(root),
                occupiedTokens: visibleTokensForPage(page),
              });
              if (free) applyPlacementStyle(item, free, currentWidgetSizes(root));
              refreshPageSlots(root, editing);
              persistHomeLayout();
              closeWidgetPicker();
              updatePageIndicator();
              updateViewportHeight();
            }

            function removeOptionalApp(id) {
              if (!OPTIONAL_ITEM_IDS.includes(id)) return;
              const item = root.querySelector(`[data-home-item-id="${id}"]`);
              const catalog = root.querySelector("[data-home-app-catalog]");
              if (!item || !catalog || item.closest(".mobile-home-dock")) return;
              catalog.append(item);
              item.style.removeProperty("grid-row");
              item.style.removeProperty("grid-column");
              delete item.dataset.homeRow;
              delete item.dataset.homeCol;
              refreshPageSlots(root, editing);
              persistHomeLayout();
              refreshWidgetPicker(root);
              updatePageIndicator();
              updateViewportHeight();
            }

            function handleWidgetPickerPointerUp(event) {
              const appOption = event.target.closest("[data-home-app-add-id]");
              if (appOption) {
                event.preventDefault();
                event.stopPropagation();
                addOptionalApp(appOption.dataset.homeAppAddId);
                return;
              }
              const option = event.target.closest("[data-home-widget-add-id]");
              if (!option) return;
              event.preventDefault();
              event.stopPropagation();
              addWidget(option.dataset.homeWidgetAddId);
            }
          ''')

          replace_once('ui/interactions/homeInteractions.js',
          '''    const add = event.target.closest("[data-home-widget-add-id]");
              if (add) {
                event.preventDefault();
                addWidget(add.dataset.homeWidgetAddId);
                return;
              }
          ''',
          '''    const appRemove = event.target.closest("[data-home-app-remove]");
              if (appRemove) {
                event.preventDefault();
                event.stopPropagation();
                if (editing) removeOptionalApp(appRemove.closest("[data-home-item-id]")?.dataset.homeItemId || "");
                return;
              }
              const appAdd = event.target.closest("[data-home-app-add-id]");
              if (appAdd) {
                event.preventDefault();
                addOptionalApp(appAdd.dataset.homeAppAddId);
                return;
              }
              const add = event.target.closest("[data-home-widget-add-id]");
              if (add) {
                event.preventDefault();
                addWidget(add.dataset.homeWidgetAddId);
                return;
              }
          ''')

          # App routing and screen binders.
          replace_once('app.js',
          '''import { renderGpxAnalysisScreen } from "./screens/gpxAnalysisScreen.js";
          ''',
          '''import { renderGpxAnalysisScreen } from "./screens/gpxAnalysisScreen.js";
          import { renderLocationNoteScreen, renderQuickNoteScreen, renderGearNoteScreen } from "./screens/mobileQuickToolsScreen.js";
          ''')

          replace_once('app.js',
          '''  settings: renderSettingsScreen,
          };
          ''',
          '''  settings: renderSettingsScreen,
            "location-note": renderLocationNoteScreen,
            "quick-note": renderQuickNoteScreen,
            "gear-note": renderGearNoteScreen,
          };
          ''')

          replace_once('app.js',
          '''  document.body.classList.toggle("secondary-derived-open", ["plan", "consultation", "support-guidance", "reading", "privacy", "settings"].includes(screenName));
          ''',
          '''  document.body.classList.toggle("secondary-derived-open", ["plan", "consultation", "support-guidance", "reading", "privacy", "settings", "location-note", "quick-note", "gear-note"].includes(screenName));
          ''')

          replace_once('ui/screenInteractions.js',
          '''import { bindRunRoute } from "./interactions/runRouteInteractions.js";
          ''',
          '''import { bindRunRoute } from "./interactions/runRouteInteractions.js";
          import { bindMobileQuickTool } from "./interactions/mobileQuickToolsInteractions.js";
          ''')

          replace_once('ui/screenInteractions.js',
          '''  "run-route": bindRunRoute,
          });
          ''',
          '''  "run-route": bindRunRoute,
            "location-note": bindMobileQuickTool,
            "quick-note": bindMobileQuickTool,
            "gear-note": bindMobileQuickTool,
          });
          ''')

          replace_once('ui/appShell.js',
          '''  settings: "more",
          });
          ''',
          '''  settings: "more",
            "location-note": "home",
            "quick-note": "home",
            "gear-note": "home",
          });
          ''')

          replace_once('ui/screenArchitecture.js',
          '''  if (screen === "plan") {
          ''',
          '''  if (screen === "location-note") return { title: "地点メモ", backHref: "#/home", backLabel: "ホーム" };
            if (screen === "quick-note") return { title: "1分メモ", backHref: "#/home", backLabel: "ホーム" };
            if (screen === "gear-note") return { title: "装備メモ", backHref: "#/home", backLabel: "ホーム" };

            if (screen === "plan") {
          ''')

          # Stylesheet and PWA precache.
          replace_once('index.html',
          '''  <link rel="stylesheet" href="./styles/mobile-app-screens.css">
          ''',
          '''  <link rel="stylesheet" href="./styles/mobile-app-screens.css">
            <link rel="stylesheet" href="./styles/mobile-quick-tools.css">
          ''')

          replace_once('service-worker.js',
          '''  "./screens/moreScreen.js",
          ''',
          '''  "./screens/moreScreen.js",
            "./screens/mobileQuickToolsScreen.js",
          ''')
          replace_once('service-worker.js',
          '''  "./styles/mobile-app-screens.css",
          ''',
          '''  "./styles/mobile-app-screens.css",
            "./styles/mobile-quick-tools.css",
          ''')
          replace_once('service-worker.js',
          '''  "./ui/interactions/homeGridModel.js",
          ''',
          '''  "./ui/interactions/homeGridModel.js",
            "./ui/interactions/mobileQuickToolsInteractions.js",
          ''')
          replace_once('service-worker.js',
          '''  "./ui/personalContextPresentation.js",
          ''',
          '''  "./ui/mobileQuickToolsStore.js",
            "./ui/personalContextPresentation.js",
          ''')
          PY
          python3 /tmp/integrate.py
          git rm .github/workflows/mobile-quick-tools-temp.yml

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Validate integration contract
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'href="#/location-note"' screens/homeScreen.js
          grep -q 'href="#/quick-note"' screens/homeScreen.js
          grep -q 'href="#/gear-note"' screens/homeScreen.js
          grep -q 'data-home-app-add-id' ui/interactions/homeInteractions.js
          grep -q 'REQUIRED_ITEM_IDS.every' ui/interactions/homeInteractions.js
          grep -q 'renderLocationNoteScreen' app.js
          grep -q 'bindMobileQuickTool' ui/screenInteractions.js
          grep -q './screens/mobileQuickToolsScreen.js' service-worker.js
          grep -q './ui/mobileQuickToolsStore.js' service-worker.js
          grep -q './styles/mobile-quick-tools.css' service-worker.js
          test ! -e .github/workflows/mobile-quick-tools-temp.yml
      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional smartphone quick tools"
          git push origin HEAD:feature/mobile-quick-tools-20260927
