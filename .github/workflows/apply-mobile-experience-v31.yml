name: Verify RunLoad Mobile Experience v2026.10.01.31

on:
  push:
    branches:
      - deploy/mobile-experience-v31
    paths:
      - ".runload-deploy-v31/READY"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            count=$((count+1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
          echo "syntax checked: $count"
      - name: Verify v31 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '2026.10.01.31' ui/appVersionStatus.js
          grep -q '2026.10.01.31' service-worker.js
          grep -q 'mobile-experience-v31.css' index.html
          grep -q 'mobile-experience-v31.css' service-worker.js
          grep -q 'mobileHomeExperience.js' service-worker.js
          grep -q 'buildDynamicHomeCards' screens/homeScreen.js
          grep -q 'buildPersonalChallenge' screens/homeScreen.js
          grep -q 'resolveAmbientProfile' screens/homeScreen.js
          grep -q 'prefers-reduced-motion' styles/mobile-experience-v31.css
      - name: Verify focused mobile regressions
        shell: bash
        run: |
          set -euo pipefail
          node tests/mobileInsightsV30.test.mjs
          node tests/mobileRunExperimentsV29.test.mjs
          node tests/mobileAchievementsV26.test.mjs
          node tests/mobileMeasurementPrepRebaseline.test.mjs
          node tests/mobileDataBoundaryV26.test.mjs
          node tests/mobileFinalV26.test.mjs
          node tests/mobileOnboardingV25.test.mjs
          node tests/mobileUpgradeFoundationRebaseline.test.mjs
          node tests/mobileHomeFixedUi.test.mjs
          node tests/mobileHomeReturnTransition.test.mjs
          node tests/mobileQuickTools.test.mjs
          node tests/appVersionStatus.test.mjs
      - name: Verify all non-browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for test_file in tests/*.test.mjs; do
            if [[ "$test_file" == *mobileWalkJogBrowserFlow.test.mjs ]]; then
              continue
            fi
            node "$test_file" >/tmp/runload-one-test.log 2>&1 || { cat /tmp/runload-one-test.log; exit 1; }
            pass=$((pass+1))
          done
          echo "non-browser tests passed: $pass"
