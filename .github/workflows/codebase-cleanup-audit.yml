# final-cleanup-audit-rerun
name: Codebase cleanup final stage-one audit

on:
  push:
    branches:
      - codebase-cleanup-20260922
    paths:
      - ".github/workflows/codebase-cleanup-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate current runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\0' .nojekyll README.md app.js index.html manifest.webmanifest service-worker.js
            find core icons screens styles ui -type f -print0
          } | sort -z | xargs -0 sha256sum > /tmp/RUNTIME_SHA256SUMS.txt
          echo "RUNTIME_MANIFEST_BEGIN"
          cat /tmp/RUNTIME_SHA256SUMS.txt
          echo "RUNTIME_MANIFEST_END"
          cp /tmp/RUNTIME_SHA256SUMS.txt RUNTIME_SHA256SUMS.txt
          echo "RUNTIME_MANIFEST_ENTRIES=$(wc -l < /tmp/RUNTIME_SHA256SUMS.txt)"

      - name: JavaScript and MJS syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file" >/dev/null
            count=$((count+1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          echo "SYNTAX_FILES_PASS=$count"

      - name: Runtime reachability
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.cwd();
          const walk=(dir)=>{
            const out=[];
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(ent.name==='.git') continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) out.push(...walk(p)); else out.push(p);
            }
            return out;
          };
          const rel=p=>path.relative(root,p).replaceAll(path.sep,'/');
          const files=walk(root);
          const js=files.filter(p=>/\.(?:js|mjs)$/.test(p));
          const runtimeJs=js.map(rel).filter(p=>p.endsWith('.js')&&!p.startsWith('tests/'));
          const read=p=>fs.readFileSync(p,'utf8');
          const importRe=/\bimport\s+(?:[^'"]*?\s+from\s+)?["']([^"']+)["']/g;
          const graph=new Map();
          for(const file of js){
            const deps=[];
            const src=read(file);
            for(const m of src.matchAll(importRe)){
              if(!m[1].startsWith('.')) continue;
              let target=path.resolve(path.dirname(file),m[1]);
              if(!path.extname(target)) target+='.js';
              deps.push(rel(target));
            }
            graph.set(rel(file),deps);
          }
          const entries=['app.js','ui/pwaUpdateBootstrap.js'];
          const reachable=new Set();
          const stack=[...entries];
          while(stack.length){
            const cur=stack.pop();
            if(reachable.has(cur)) continue;
            reachable.add(cur);
            for(const dep of graph.get(cur)||[]) stack.push(dep);
          }
          const unreachable=runtimeJs.filter(p=>!reachable.has(p)&&p!=='service-worker.js').sort();
          const html=read(path.join(root,'index.html'));
          const linkedCss=[...html.matchAll(/<link[^>]+href=["']\.\/([^"']+\.css)["']/g)].map(m=>m[1]);
          const css=files.map(rel).filter(p=>p.endsWith('.css'));
          const unlinkedCss=css.filter(p=>!linkedCss.includes(p)).sort();
          const sw=read(path.join(root,'service-worker.js'));
          const precache=[...sw.matchAll(/"\.\/([^"]+)"/g)].map(m=>m[1]);
          const missingPrecache=precache.filter(p=>!fs.existsSync(path.join(root,p)));
          console.log('RUNTIME_JS='+runtimeJs.length);
          console.log('UNREACHABLE_JS='+JSON.stringify(unreachable));
          console.log('UNLINKED_CSS='+JSON.stringify(unlinkedCss));
          console.log('MISSING_PRECACHE='+JSON.stringify(missingPrecache));
          if(unreachable.length||unlinkedCss.length||missingPrecache.length) process.exitCode=1;
          NODE

      - name: Run all test suites against regenerated manifest
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          failed=0
          for file in tests/*.test.mjs; do
            echo "::group::$file"
            if node "$file"; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "TEST_SUITES_PASSED=$passed"
          echo "TEST_SUITES_FAILED=$failed"
          test "$failed" -eq 0
