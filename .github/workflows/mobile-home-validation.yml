name: Mobile home validation

on:
  push:
    branches:
      - mobile/home-os-shell-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-home-validation.yml|index.html|service-worker.js|screens/homeScreen.js|styles/mobile-home.css|tests/deviceEntry.test.mjs|ui/deviceLayout.js|ui/screenArchitecture.js)$' || true)"
          test -z "$unexpected"
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify mobile home contract
        run: |
          set -euo pipefail
          grep -q 'return matchesMobile ? "home" : "home"' ui/deviceLayout.js
          grep -q 'class="mobile-home-os"' screens/homeScreen.js
          grep -q 'class="mobile-home-dock"' screens/homeScreen.js
          grep -q '条件比較' screens/homeScreen.js
          grep -q '記録' screens/homeScreen.js
          grep -q '測定' screens/homeScreen.js
          grep -q '履歴' screens/homeScreen.js
          grep -q 'コース' screens/homeScreen.js
          grep -q './styles/mobile-home.css' index.html
          grep -q './styles/mobile-home.css' service-worker.js
          grep -q '@media (max-width: 54.99rem)' styles/mobile-home.css
          grep -q '@media (min-width: 55rem)' styles/mobile-home.css
      - name: Verify PWA precache paths
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
