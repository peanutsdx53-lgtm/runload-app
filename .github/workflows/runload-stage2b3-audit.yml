name: RunLoad Stage 2B3 dependency audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2b3-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "104366f1211ed87ba93fc9ffa7495d4690eeb044"

      - name: Map current module dependencies
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            core/internal/primaryModelEngine.js \
            core/internal/courseRepository.js \
            core/internal/recordWorkflow.js \
            core/internal/applicationDomain.js \
            core/internal/publicHelpGuidance.js; do
            echo "=== $file imports ==="
            grep -n '^import ' "$file" || true
            echo "=== $file internalModules refs ==="
            grep -n -o -E 'internalModules\.[A-Za-z0-9_]+' "$file" | sort -u || true
          done
          echo '=== providers of needed modules ==='
          grep -R -n -E 'internalModules\.(modelConstants|inputSafety|collectionRepository|storageKeys|bodyProfileAdjustment|primaryRegionalSnapshot|inputValidation|subjectiveFeedback|supportDecision|primaryRegionalResultService) =' core/internal \
            --exclude-dir=.git || true
