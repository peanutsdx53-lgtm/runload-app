name: Materialize RunLoad pre-release

on:
  push:
    branches:
      - pre-release
    paths:
      - ".github/prerelease-payload/**"
      - ".github/workflows/materialize-prerelease.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pre-release
        uses: actions/checkout@v4
        with:
          ref: pre-release
          fetch-depth: 0

      - name: Rebuild and verify runtime payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/prerelease-payload/part-*.b64 > /tmp/runload-runtime.tar.xz.b64
          base64 --decode /tmp/runload-runtime.tar.xz.b64 > /tmp/runload-runtime.tar.xz
          echo "bb7710add77f911e72a28519d30d25dacc0c4d0dde770944667cef35fe3e9f96  /tmp/runload-runtime.tar.xz" | sha256sum -c -
          count="$(tar -tJf /tmp/runload-runtime.tar.xz | grep -vc '/$')"
          test "$count" -eq 71
          tar -xJf /tmp/runload-runtime.tar.xz -C .

      - name: Prepare regular pre-release tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf prototype .github/runload-payload .github/v14-payload >/dev/null 2>&1 || true

          cat > README.md <<'EOF'
          # RunLoad

          RunLoad is a pre-release regular web application for beginner runners to review their own running records, body-region Reference-100 values, subjective fatigue (ROF-J), history, plans, courses and local GPX information.

          ## Status
          - Pre-release regular app for smartphone verification and iterative polish.
          - This repository root is the deployable app, not the former UI/UX prototype.
          - The frozen prototype is preserved in Git history and branch `archive/prototype-freeze-20260918`.

          ## Fixed interpretation boundaries
          - Reference-100 is for within-region self-understanding; it is not a cross-region ranking.
          - Distance is a separate running fact, not an automatic multiplier of the regional display.
          - Missing or unsupported data is not converted to zero.
          - ROF-J records subjective fatigue at the time of answering; it is not a readiness, recovery, safety or injury-risk score.
          - session-RPE is not implemented.
          - The app does not diagnose, prescribe, score injury risk/readiness/safety, or make automatic run/no-run decisions.
          - Notebook is not part of this version.
          - This version does not migrate or reinterpret old-app records.

          ## Data
          App records are stored locally in the browser. GPX analysis is local-only in this version.

          ## Verification baseline
          Pre-release source: RunLoad Formal UI Integrated RC 20260919 V1.1.
          Accepted Formal App Source V1.5R2 remains a separate protected authority.
          EOF

          cat > PRE_RELEASE_STATUS.md <<'EOF'
          # RunLoad Pre-release Status

          Date: 2026-09-19
          Status: PRE-RELEASE REGULAR APP / SMARTPHONE VERIFICATION BASE

          - Source runtime: RunLoad Formal UI Integrated RC 20260919 V1.1
          - Local RC ZIP SHA-256: 013366b17e3e1131028cdc8571a17fb23dd905db043f2384e7b9999acffc5b4e
          - Runtime transport payload SHA-256: bb7710add77f911e72a28519d30d25dacc0c4d0dde770944667cef35fe3e9f96
          - Integration verification before publication: 240 / 240 PASS
          - JS/MJS syntax before publication: 77 / 77 PASS
          - Accepted Formal App Source V1.5R2 SHA-256: 8358ff957b9d6734e6a2ef9e6c0ac3abd370ddaa14c888ad38d9e759412cf336
          - Accepted Formal baseline is not modified by this publication.
          EOF

          {
            find core icons screens styles ui -type f -print
            printf '%s\n' .nojekyll app.js index.html manifest.webmanifest service-worker.js
          } | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > RUNTIME_SHA256SUMS.txt

          test "$(wc -l < RUNTIME_SHA256SUMS.txt)" -eq 71

          git rm -rf .github/prerelease-payload .github/workflows/materialize-prerelease.yml >/dev/null 2>&1 || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit verified pre-release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Pre-release: materialize RunLoad V1.1 regular app"
          git push origin HEAD:pre-release
