name: Mobile home page gesture temporary validation
on:
  push:
    branches:
      - fix/mobile-home-page-gesture-20260927
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch mobile home page gestures
        run: |
          set -euo pipefail
          cat > /tmp/patch_mobile_home.py <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve the page indicator's centering transform during home-return animation.
          replace_one('ui/mobileHomeReturnTransition.js', '''  const dock = document.querySelector(".mobile-home-dock");
          const indicator = document.querySelector(".mobile-home-page-indicator");
          [dock, indicator].forEach((element) => {
            animateOnce(element, [
              { transform: "translateY(9px)", opacity: .35 },
              { transform: "translateY(0)", opacity: 1 },
            ], {
              duration: 250,
              delay: 35,
              easing: RETURN_EASING,
            });
          });
          ''', '''  const dock = document.querySelector(".mobile-home-dock");
          animateOnce(dock, [
            { transform: "translateY(9px)", opacity: .35 },
            { transform: "translateY(0)", opacity: 1 },
          ], {
            duration: 250,
            delay: 35,
            easing: RETURN_EASING,
          });

          const indicator = document.querySelector(".mobile-home-page-indicator");
          animateOnce(indicator, [
            { transform: "translateX(-50%) translateY(7px)", opacity: .35 },
            { transform: "translateX(-50%) translateY(0)", opacity: 1 },
          ], {
            duration: 250,
            delay: 35,
            easing: RETURN_EASING,
          });
          ''')

          # Reserve horizontal gestures for the in-app home pager instead of browser history/navigation.
          replace_one('styles/mobile-home-editing.css', '''  .mobile-home-page-viewport {
            width: 100%;
            margin-bottom: 40px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            transition: height 160ms ease;
          }
          ''', '''  .mobile-home-page-viewport {
            width: 100%;
            margin-bottom: 40px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: none;
            overscroll-behavior-x: none;
            touch-action: pan-y;
            scrollbar-width: none;
            -webkit-overflow-scrolling: auto;
            transition: height 160ms ease;
          }
          ''')
          replace_one('styles/mobile-home-editing.css', '''  .mobile-home-os.is-home-editing .mobile-home-page-viewport,
          .mobile-home-os.is-home-drag-active .mobile-home-page-viewport {
            overflow-x: hidden;
            scroll-snap-type: none;
          }
          ''', '''  .mobile-home-os.is-home-drag-active .mobile-home-page-viewport {
            overflow-x: hidden;
          }
          ''')

          # Add controlled page swipe state.
          replace_one('ui/interactions/homeInteractions.js', '''  let scrollFrame = null;
          ''', '''  let scrollFrame = null;
          let pageAnimationFrame = null;
          let pageSwipePointerId = null;
          let pageSwipeStartX = 0;
          let pageSwipeStartY = 0;
          let pageSwipeStartLeft = 0;
          let pageSwipeStartTime = 0;
          let pageSwipeHorizontal = false;
          ''')

          old_set_active = '''  function setActivePage(index, { smooth = true, persist = false } = {}) {
            const pages = pageElements(root);
            if (!pages.length) return;
            activePage = Math.max(0, Math.min(pages.length - 1, Number(index) || 0));
            const left = activePage * viewport.clientWidth;
            viewport.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
            if (dragging) clearDropPreview();
            updatePageIndicator();
            updateViewportHeight();
            if (persist) writeLayout(root, dockContainer, activePage);
          }
          '''
          new_set_active = '''  function cancelPageAnimation() {
            if (pageAnimationFrame) cancelAnimationFrame(pageAnimationFrame);
            pageAnimationFrame = null;
            root.classList.remove("is-home-page-transitioning");
          }

          function animatePageViewport(left) {
            cancelPageAnimation();
            const from = viewport.scrollLeft;
            const distance = left - from;
            const reduceMotion = globalThis.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
            if (reduceMotion || Math.abs(distance) < 1) {
              viewport.scrollLeft = left;
              return;
            }
            const startedAt = globalThis.performance?.now?.() ?? Date.now();
            const duration = 280;
            root.classList.add("is-home-page-transitioning");
            const step = (now) => {
              const elapsed = Math.max(0, now - startedAt);
              const progress = Math.min(1, elapsed / duration);
              const eased = 1 - Math.pow(1 - progress, 3);
              viewport.scrollLeft = from + distance * eased;
              if (progress < 1) {
                pageAnimationFrame = requestAnimationFrame(step);
                return;
              }
              viewport.scrollLeft = left;
              pageAnimationFrame = null;
              root.classList.remove("is-home-page-transitioning");
            };
            pageAnimationFrame = requestAnimationFrame(step);
          }

          function setActivePage(index, { smooth = true, persist = false } = {}) {
            const pages = pageElements(root);
            if (!pages.length) return;
            activePage = Math.max(0, Math.min(pages.length - 1, Number(index) || 0));
            const left = activePage * viewport.clientWidth;
            if (smooth) animatePageViewport(left);
            else {
              cancelPageAnimation();
              viewport.scrollLeft = left;
            }
            if (dragging) clearDropPreview();
            updatePageIndicator();
            updateViewportHeight();
            if (persist) writeLayout(root, dockContainer, activePage);
          }
          '''
          replace_one('ui/interactions/homeInteractions.js', old_set_active, new_set_active)

          # Never allow a home app to launch while edit mode is active, even through an indirect caller.
          replace_one('ui/interactions/homeInteractions.js', '''  function openHomeLauncher(launcher) {
            const href = String(launcher?.dataset?.homeHref || "");
          ''', '''  function openHomeLauncher(launcher) {
            if (editing) return;
            const href = String(launcher?.dataset?.homeHref || "");
          ''')

          page_handlers = '''  function isPageSwipeBlockedTarget(target) {
            return Boolean(target?.closest?.("button, a, input, textarea, select, [contenteditable=\"true\"], [data-home-item-id], [data-home-widget-id], [data-home-widget-picker]"));
          }

          function resetPageSwipe() {
            if (pageSwipePointerId != null) {
              try { viewport.releasePointerCapture(pageSwipePointerId); } catch {}
            }
            pageSwipePointerId = null;
            pageSwipeHorizontal = false;
            root.classList.remove("is-home-page-swiping");
          }

          function handlePagePointerDown(event) {
            if (pageSwipePointerId != null || dragging || dragArmed) return;
            if (event.pointerType === "mouse" && event.button !== 0) return;
            if (isPageSwipeBlockedTarget(event.target)) return;
            if (pageElements(root).length < 2) return;
            cancelPageAnimation();
            pageSwipePointerId = event.pointerId;
            pageSwipeStartX = event.clientX;
            pageSwipeStartY = event.clientY;
            pageSwipeStartLeft = viewport.scrollLeft;
            pageSwipeStartTime = globalThis.performance?.now?.() ?? Date.now();
            pageSwipeHorizontal = false;
            try { viewport.setPointerCapture(event.pointerId); } catch {}
          }

          function handlePagePointerMove(event) {
            if (event.pointerId !== pageSwipePointerId) return;
            const dx = event.clientX - pageSwipeStartX;
            const dy = event.clientY - pageSwipeStartY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            if (!pageSwipeHorizontal) {
              if (absX < 8 && absY < 8) return;
              if (absY > absX) {
                resetPageSwipe();
                return;
              }
              pageSwipeHorizontal = true;
              root.classList.add("is-home-page-swiping");
              suppressClickUntil = Date.now() + 500;
            }
            event.preventDefault();
            const width = Math.max(1, viewport.clientWidth);
            const maxLeft = Math.max(0, (pageElements(root).length - 1) * width);
            viewport.scrollLeft = Math.max(0, Math.min(maxLeft, pageSwipeStartLeft - dx));
          }

          function finishPageSwipe(event, cancelled = false) {
            if (event.pointerId !== pageSwipePointerId) return;
            const dx = event.clientX - pageSwipeStartX;
            const elapsed = Math.max(1, (globalThis.performance?.now?.() ?? Date.now()) - pageSwipeStartTime);
            const velocity = Math.abs(dx) / elapsed;
            const width = Math.max(1, viewport.clientWidth);
            const crossed = Math.abs(dx) >= width * 0.16 || velocity >= 0.45;
            let target = activePage;
            if (!cancelled && pageSwipeHorizontal && crossed) target += dx < 0 ? 1 : -1;
            else if (pageSwipeHorizontal) target = Math.round(viewport.scrollLeft / width);
            target = Math.max(0, Math.min(pageElements(root).length - 1, target));
            if (pageSwipeHorizontal) {
              event.preventDefault();
              suppressClickUntil = Date.now() + 450;
            }
            resetPageSwipe();
            setActivePage(target, { smooth: true, persist: true });
          }

          function handlePagePointerUp(event) {
            finishPageSwipe(event, false);
          }

          function handlePagePointerCancel(event) {
            finishPageSwipe(event, true);
          }

          '''
          replace_one('ui/interactions/homeInteractions.js', '''  function handlePageScroll() {
          ''', page_handlers + '''  function handlePageScroll() {
          ''')

          replace_one('ui/interactions/homeInteractions.js', '''      if (!viewport.clientWidth || dragging || dragArmed) return;
          ''', '''      if (!viewport.clientWidth || dragging || dragArmed || pageSwipePointerId != null || pageAnimationFrame) return;
          ''')

          replace_one('ui/interactions/homeInteractions.js', '''  viewport.addEventListener("scroll", handlePageScroll, { passive: true });
          ''', '''  viewport.addEventListener("pointerdown", handlePagePointerDown);
          viewport.addEventListener("pointermove", handlePagePointerMove, { passive: false });
          viewport.addEventListener("pointerup", handlePagePointerUp);
          viewport.addEventListener("pointercancel", handlePagePointerCancel);
          viewport.addEventListener("scroll", handlePageScroll, { passive: true });
          ''')

          replace_one('ui/interactions/homeInteractions.js', '''    if (scrollFrame) cancelAnimationFrame(scrollFrame);
            if (launchTimer) clearTimeout(launchTimer);
            viewport.removeEventListener("scroll", handlePageScroll);
          ''', '''    if (scrollFrame) cancelAnimationFrame(scrollFrame);
            cancelPageAnimation();
            resetPageSwipe();
            if (launchTimer) clearTimeout(launchTimer);
            viewport.removeEventListener("pointerdown", handlePagePointerDown);
            viewport.removeEventListener("pointermove", handlePagePointerMove);
            viewport.removeEventListener("pointerup", handlePagePointerUp);
            viewport.removeEventListener("pointercancel", handlePagePointerCancel);
            viewport.removeEventListener("scroll", handlePageScroll);
          ''')

          # Extend fixed UI test with the centering contract.
          replace_one('tests/mobileHomeFixedUi.test.mjs', '''test('HOME-RETURN-PAINTS-SNAPSHOT-BEFORE-NAVIGATION', () => {
          ''', '''test('HOME-RETURN-KEEPS-PAGE-INDICATOR-CENTERED-DURING-ANIMATION', () => {
            const source = read('ui/mobileHomeReturnTransition.js');
            assert.ok(source.includes('translateX(-50%) translateY(7px)'));
            assert.ok(source.includes('translateX(-50%) translateY(0)'));
          });

          test('HOME-RETURN-PAINTS-SNAPSHOT-BEFORE-NAVIGATION', () => {
          ''')

          Path('tests/mobileHomePageGesture.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = path.dirname(fileURLToPath(import.meta.url));
          const root = path.resolve(here, '..');
          const read = (rel) => fs.readFileSync(path.join(root, rel), 'utf8');
          const results = [];

          function test(id, fn) {
            try { fn(); results.push({ id, status: 'PASS' }); }
            catch (error) { results.push({ id, status: 'FAIL', message: error?.stack || String(error) }); }
          }

          test('HOME-PAGER-RESERVES-HORIZONTAL-GESTURE-FROM-BROWSER-HISTORY', () => {
            const css = read('styles/mobile-home-editing.css');
            assert.ok(css.includes('touch-action: pan-y;'));
            assert.ok(css.includes('overscroll-behavior-x: none;'));
            assert.ok(css.includes('scroll-snap-type: none;'));
          });

          test('HOME-PAGER-USES-POINTER-CAPTURED-IN-APP-SWIPE', () => {
            const source = read('ui/interactions/homeInteractions.js');
            for (const name of ['handlePagePointerDown', 'handlePagePointerMove', 'handlePagePointerUp', 'handlePagePointerCancel']) {
              assert.ok(source.includes(name));
            }
            assert.ok(source.includes('viewport.setPointerCapture(event.pointerId)'));
            assert.ok(source.includes('viewport.scrollLeft = Math.max(0, Math.min(maxLeft, pageSwipeStartLeft - dx))'));
          });

          test('HOME-PAGER-FOLLOWS-FINGER-THEN-EASES-TO-PAGE', () => {
            const source = read('ui/interactions/homeInteractions.js');
            assert.ok(source.includes('function animatePageViewport(left)'));
            assert.ok(source.includes('const duration = 280;'));
            assert.ok(source.includes('1 - Math.pow(1 - progress, 3)'));
            assert.ok(source.includes('setActivePage(target, { smooth: true, persist: true })'));
          });

          test('HOME-EDIT-MODE-CANNOT-LAUNCH-APP', () => {
            const source = read('ui/interactions/homeInteractions.js');
            const start = source.indexOf('function openHomeLauncher(launcher)');
            assert.ok(start >= 0);
            const segment = source.slice(start, start + 240);
            assert.ok(segment.includes('if (editing) return;'));
            assert.ok(source.includes('if (editing || Date.now() < suppressClickUntil) return;'));
          });

          test('HOME-PAGER-DOES-NOT-CHANGE-ACTIVE-PAGE-MID-SWIPE-OR-ANIMATION', () => {
            const source = read('ui/interactions/homeInteractions.js');
            assert.ok(source.includes('pageSwipePointerId != null || pageAnimationFrame'));
          });

          const failed = results.filter((item) => item.status === 'FAIL');
          console.log(JSON.stringify({ suite: 'Mobile Home Page Gesture', total: results.length, passed: results.length - failed.length, failed: failed.length, status: failed.length ? 'FAIL' : 'PASS', results }, null, 2));
          if (failed.length) process.exitCode = 1;
          ''', encoding='utf-8')
          PY
          python3 /tmp/patch_mobile_home.py
          git rm .github/workflows/mobile-home-page-gesture-temp.yml
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          node tests/mobileHomePageGesture.test.mjs
          node tests/mobileHomeFixedUi.test.mjs
          grep -q 'touch-action: pan-y' styles/mobile-home-editing.css
          grep -q 'translateX(-50%) translateY(7px)' ui/mobileHomeReturnTransition.js
          grep -q 'if (editing) return;' ui/interactions/homeInteractions.js
          git diff --check origin/main...HEAD
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ui/mobileHomeReturnTransition.js ui/interactions/homeInteractions.js styles/mobile-home-editing.css tests/mobileHomeFixedUi.test.mjs tests/mobileHomePageGesture.test.mjs
          git commit -m "Stabilize mobile home page gestures"
          git push origin HEAD
