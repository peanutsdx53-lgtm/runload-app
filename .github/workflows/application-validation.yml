name: Application validation

on:
  push:
    branches:
      - refactor/codebase-cleanup-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and tests
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r file; do
            if ! node --check "$file"; then failures=$((failures + 1)); fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          for file in tests/*.test.mjs; do
            echo "==> $file"
            if ! node "$file"; then failures=$((failures + 1)); fi
          done
          test ! -e RUNTIME_SHA256SUMS.txt
          test ! -e ui/hierarchicalExplanation.js
          ! grep -R -n -E 'RunLoad Journal|Runload Journal' --include='*.js' --include='*.html' --include='*.css' --include='*.webmanifest' .
          ! grep -R -n -E 'RUNLOAD|RunLoad|Runload|runload' index.html manifest.webmanifest screens ui styles
          ! grep -R -n -E '\\b(ChatGPT|GPT|LLM)\\b' index.html manifest.webmanifest screens ui styles
          echo "Validation failures: $failures"
          test "$failures" -eq 0
      - name: Validate runtime technology boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find core screens ui -type f ! -name '*.js' -print)"
          test -z "$(find styles -type f ! -name '*.css' -print)"
          test -f index.html
          test ! -e package.json
          test -z "$(find . -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' -o -name '*.vue' -o -name '*.py' \) -not -path './.git/*' -print)"
      - name: Generate terminology report
        shell: bash
        run: |
          {
            echo "=== BRAND TERMS ==="
            grep -R -n -E 'RUNLOAD|RunLoad|Runload|runload' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== JOURNAL TERMS ==="
            grep -R -n -E 'JOURNAL|Journal|journal' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== DEVELOPMENT TERMS ==="
            grep -R -n -E 'SECOND_PILLAR|secondPillar|prototype|candidate|audit|handoff|temporary|tmp' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== HASH TERMS ==="
            grep -R -ni -E 'sha-?256' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== AI TERMS ==="
            grep -R -ni -E '\b(ChatGPT|GPT|LLM|AI)\b' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== GENERATION TOKENS ==="
            grep -R -n -E '(--v[0-9]+|[-_]v[0-9]+|\bV[0-9]+\b)' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
          } > terminology-report.txt
      - name: Generate module reachability report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const roots=['core','screens','ui'];
          const all=['app.js'];
          for(const root of roots){
            const walk=(dir)=>{
              for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
                const full=path.join(dir,entry.name);
                if(entry.isDirectory()) walk(full);
                else if(entry.isFile()&&full.endsWith('.js')) all.push(full.replaceAll('\\','/'));
              }
            };
            walk(root);
          }
          const files=new Set(all);
          const imports=new Map();
          const importPatterns=[
            /\bfrom\s+["']([^"']+)["']/g,
            /\bimport\s*["']([^"']+)["']/g,
            /\bimport\s*\(\s*["']([^"']+)["']\s*\)/g,
          ];
          for(const file of files){
            const source=fs.readFileSync(file,'utf8');
            const specs=new Set();
            for(const pattern of importPatterns){
              for(const match of source.matchAll(pattern)) specs.add(match[1]);
            }
            const deps=[];
            for(const spec of specs){
              if(!spec?.startsWith('.')) continue;
              let resolved=path.normalize(path.join(path.dirname(file),spec)).replaceAll('\\','/');
              if(!path.extname(resolved)) resolved+='.js';
              deps.push(resolved);
            }
            imports.set(file,deps);
          }
          const entrypoints=new Set(['app.js']);
          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/<script\b[^>]*\bsrc=["']\.\/([^"']+\.js)["'][^>]*>/g)){
            entrypoints.add(match[1]);
          }
          const seen=new Set();
          const visit=(file)=>{
            if(seen.has(file)||!files.has(file)) return;
            seen.add(file);
            for(const dep of imports.get(file)||[]) visit(dep);
          };
          for(const entry of entrypoints) visit(entry);
          const unreachable=[...files].filter(file=>file!=='app.js'&&!seen.has(file)).sort();
          const report=[
            '=== MODULE REACHABILITY FROM app.js ===',
            `runtime modules: ${files.size-1}`,
            `entrypoints: ${[...entrypoints].sort().join(', ')}`,
            `reachable modules: ${seen.size-1}`,
            `unreachable modules: ${unreachable.length}`,
            '',
            ...unreachable,
            ''
          ].join('\n');
          fs.writeFileSync('module-reachability.txt',report);
          NODE
      - name: Generate public API usage report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const appCore=fs.readFileSync('core/appCore.js','utf8');
          const exported=[...appCore.matchAll(/^export const ([A-Za-z_$][\w$]*)/gm)].map((m)=>m[1]);
          const files=[];
          const walk=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&/\.(?:js|mjs)$/.test(full)&&full!=='core/appCore.js') files.push(full);
            }
          };
          for(const root of ['.', 'core', 'screens', 'ui', 'tests']){
            if(root==='.') continue;
            if(fs.existsSync(root)) walk(root);
          }
          if(fs.existsSync('app.js')) files.push('app.js');
          const imported=new Set();
          for(const file of new Set(files)){
            const source=fs.readFileSync(file,'utf8');
            const pattern=/import\s*\{([^;]+?)\}\s*from\s*["']([^"']*core\/appCore\.js)["']\s*;/g;
            for(const match of source.matchAll(pattern)){
              for(const part of match[1].split(',')){
                const raw=part.trim();
                if(!raw) continue;
                imported.add(raw.split(/\s+as\s+/)[0].trim());
              }
            }
          }
          const unused=exported.filter((name)=>!imported.has(name)).sort();
          const unsupportedImports=[];
          for(const file of new Set(files)){
            const source=fs.readFileSync(file,'utf8');
            for(const line of source.split(/\r?\n/)){
              if(line.includes('appCore.js') && !line.includes('import {') && !line.trim().startsWith('} from ')){
                unsupportedImports.push(`${file}: ${line.trim()}`);
              }
            }
          }
          const report=[
            '=== APP CORE PUBLIC API USAGE ===',
            `exports: ${exported.length}`,
            `imported exports: ${imported.size}`,
            `unused public exports: ${unused.length}`,
            '',
            '=== IMPORTED EXPORTS ===',
            ...[...imported].sort(),
            '',
            '=== NON-NAMED / REVIEW IMPORT LINES ===',
            ...(unsupportedImports.length?unsupportedImports:['none']),
            '',
            '=== UNUSED PUBLIC EXPORTS ===',
            ...unused,
            ''
          ].join('\n');
          fs.writeFileSync('public-api-usage.txt',report);
          NODE
      - name: Generate exported symbol usage report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const runtime=[];
          const walk=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&full.endsWith('.js')) runtime.push(full.replaceAll('\\','/'));
            }
          };
          for(const root of ['core','screens','ui']) walk(root);
          runtime.push('app.js');

          const consumers=[...runtime];
          const walkTests=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walkTests(full);
              else if(entry.isFile()&&/\.(?:js|mjs)$/.test(full)) consumers.push(full.replaceAll('\\','/'));
            }
          };
          if(fs.existsSync('tests')) walkTests('tests');

          const importedBySource=new Map();
          for(const file of consumers){
            const source=fs.readFileSync(file,'utf8');
            const pattern=/import\s*\{([^;]+?)\}\s*from\s*["']([^"']+)["']\s*;/g;
            for(const match of source.matchAll(pattern)){
              const spec=match[2];
              if(!spec.startsWith('.')) continue;
              let resolved=path.normalize(path.join(path.dirname(file),spec)).replaceAll('\\','/');
              if(!path.extname(resolved)) resolved+='.js';
              if(!importedBySource.has(resolved)) importedBySource.set(resolved,new Set());
              for(const part of match[1].split(',')){
                const raw=part.trim();
                if(!raw) continue;
                importedBySource.get(resolved).add(raw.split(/\s+as\s+/)[0].trim());
              }
            }
          }

          const dead=[];
          const internalOnly=[];
          for(const file of runtime){
            const source=fs.readFileSync(file,'utf8');
            const exports=[];
            for(const m of source.matchAll(/^export\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)/gm)) exports.push(m[1]);
            for(const m of source.matchAll(/^export\s+const\s+([A-Za-z_$][\w$]*)/gm)) exports.push(m[1]);
            for(const m of source.matchAll(/^export\s*\{([^}]+)\}\s*;?/gm)){
              for(const part of m[1].split(',')){
                const raw=part.trim();
                if(raw) exports.push(raw.split(/\s+as\s+/)[0].trim());
              }
            }
            const imported=importedBySource.get(file)||new Set();
            for(const name of new Set(exports)){
              if(imported.has(name)) continue;
              const count=source.split(name).length-1;
              const item=file+': '+name+' (local occurrences: '+count+')';
              if(count<=1) dead.push(item);
              else internalOnly.push(item);
            }
          }

          fs.writeFileSync('exported-symbol-usage.txt',[
            '=== DEAD EXPORTED SYMBOL CANDIDATES ===',
            'count: '+dead.length,
            ...dead.sort(),
            '',
            '=== INTERNAL-ONLY EXPORT CANDIDATES ===',
            'count: '+internalOnly.length,
            ...internalOnly.sort(),
            ''
          ].join('\n'));
          NODE
      - name: Generate CSS usage report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const runtimeFiles=['index.html','app.js'];
          const walk=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&full.endsWith('.js')) runtimeFiles.push(full.replaceAll('\\','/'));
            }
          };
          for(const root of ['core','screens','ui']) walk(root);
          const haystack=runtimeFiles.map(file=>fs.readFileSync(file,'utf8')).join('\n');

          const cssFiles=[];
          const walkCss=(dir)=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walkCss(full);
              else if(entry.isFile()&&full.endsWith('.css')) cssFiles.push(full.replaceAll('\\','/'));
            }
          };
          walkCss('styles');

          const usage=new Map();
          for(const file of cssFiles){
            const source=fs.readFileSync(file,'utf8');
            for(const match of source.matchAll(/\.([A-Za-z_][A-Za-z0-9_-]*)/g)){
              const name=match[1];
              if(!usage.has(name)) usage.set(name,new Set());
              usage.get(name).add(file);
            }
          }
          const candidates=[];
          for(const [name,files] of usage){
            if(!haystack.includes(name)){
              candidates.push({name,files:[...files].sort()});
            }
          }
          candidates.sort((a,b)=>a.name.localeCompare(b.name));
          const report=[
            '=== CSS CLASS CANDIDATES ABSENT FROM RUNTIME SOURCE ===',
            'count: '+candidates.length,
            ...candidates.map(item=>item.name+' | '+item.files.join(', ')),
            ''
          ].join('\n');
          fs.writeFileSync('css-usage.txt',report);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: application-validation-report
          path: |
            terminology-report.txt
            module-reachability.txt
            public-api-usage.txt
            exported-symbol-usage.txt
            css-usage.txt
