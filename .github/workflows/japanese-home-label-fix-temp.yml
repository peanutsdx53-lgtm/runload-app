name: Japanese Home label fix

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("ui/appShell.js"); s=p.read_text(); n=s.count("backLabel: \\\"Home\\\""); assert n==2, n; p.write_text(s.replace("backLabel: \\\"Home\\\"", "backLabel: \\\"ホーム\\\""))'
          python3 -c 'from pathlib import Path; p=Path("ui/screenArchitecture.js"); s=p.read_text(); old="screen: \\\"home\\\", label: \\\"Home\\\""; new="screen: \\\"home\\\", label: \\\"ホーム\\\""; n=s.count(old); assert n==1, n; p.write_text(s.replace(old,new))'
          git rm .github/workflows/japanese-home-label-fix-temp.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          for test in tests/*.test.mjs; do node "$test"; done
          git diff --check
          ! grep -n 'backLabel: "Home"' ui/appShell.js ui/screenArchitecture.js
          ! grep -n 'screen: "home", label: "Home"' ui/screenArchitecture.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/appShell.js ui/screenArchitecture.js .github/workflows/japanese-home-label-fix-temp.yml
          git commit -m "Use Japanese home label consistently"
          git push origin HEAD:main
