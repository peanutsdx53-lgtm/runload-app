name: Current audit verification

on:
  push:
    branches:
      - maintenance/current-audit-finalize-20260921
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check prohibited management wording
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'Stage[[:space:]]*[0-9]|STAGE[0-9]|ChatGPT|generative[- ]?AI|生成AI|自由回答型AI|interpretation-stage' . \
            --exclude-dir=.git \
            --exclude='current-audit-verification.yml'; then
            echo "Prohibited management wording remains."
            exit 1
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "==> $file"
            node "$file"
          done

      - name: Verify runtime SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c RUNTIME_SHA256SUMS.txt

      - name: Build repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          zip -qr runload-audit-snapshot.zip . -x '.git/*'

      - uses: actions/upload-artifact@v4
        with:
          name: runload-audit-snapshot
          path: runload-audit-snapshot.zip
          if-no-files-found: error
