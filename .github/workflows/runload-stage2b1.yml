name: RunLoad Stage 2B1 gated V27 runtime detachment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2b1.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d2267b6df0b4ea41d28860e19dad50d6912f5fb1"

      - name: Detach obsolete V27 runtime storage and results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:80]!r}")
              p.write_text(s.replace(old,new,1))

          replace_once('core/internal/platformInfrastructure.js','  modelResultsV27: `${STORAGE_NAMESPACE}-model-results-v2.7`,\n','')
          replace_once('core/internal/platformInfrastructure.js','  STORAGE_KEYS.modelResultsV27,\n','')

          replace_once('core/internal/applicationServices.js','const { createModelResultV27Repository } = internalModules.legacyLoadResultRepository;\n','')
          replace_once('core/internal/applicationServices.js','const { adaptRecordToV27Session } = internalModules.legacyLoadInputAdapter;\n','')
          replace_once('core/internal/applicationServices.js','const { assertV27ResultSemantics, calculateV27Session } = internalModules.legacyLoadModel;\n','')
          replace_once('core/internal/applicationServices.js','const { createV27ResultRecord } = internalModules.legacyLoadResultService;\n','')
          replace_once('core/internal/applicationServices.js','  const modelResultsV27 = createModelResultV27Repository(gateway);\n','')
          replace_once('core/internal/applicationServices.js','    modelResultV27Repository: modelResultsV27,\n','')
          replace_once('core/internal/applicationServices.js','    modelResultV27Repository: modelResultsV27,\n','')
          replace_once('core/internal/applicationServices.js','      v27: Object.freeze({\n        adaptRecordToV27Session,\n        calculateV27Session,\n        assertV27ResultSemantics,\n        createV27ResultRecord,\n      }),\n','')
          replace_once('core/internal/applicationServices.js','      modelResultsV27,\n','')

          replace_once('app.js','  modelResultV27Repository: baseApplicationServices.storage.modelResultsV27,\n','')

          replace_once('core/internal/historyWorkflow.js','  modelResultV27Repository,\n','')
          replace_once('core/internal/historyWorkflow.js','    const v27Read = readCollectionForMutation(modelResultV27Repository, "modelResultsV27");\n    if (!v27Read.ok) return v27Read;\n    const modelResultItems = v27Read.items;\n    const removedModelResults = modelResultItems.filter((item) => item.record_id === recordId);\n','')
          replace_once('core/internal/historyWorkflow.js','      modelResultsV27: removedModelResults,\n','')
          replace_once('core/internal/historyWorkflow.js','      { key: STORAGE_KEYS.modelResultsV27, value: modelResultItems.filter((item) => item.record_id !== recordId) },\n','')
          replace_once('core/internal/historyWorkflow.js','    const removedResultIds = new Set(\n      (entry.modelResultsV27 || []).map((item) => item.id),\n    );\n    const v27Read = readCollectionForMutation(modelResultV27Repository, "modelResultsV27");\n    if (!v27Read.ok) return v27Read;\n    const modelResultItems = v27Read.items\n      .filter((item) => !removedResultIds.has(item.id));\n    modelResultItems.push(...(entry.modelResultsV27 || []));\n','')
          replace_once('core/internal/historyWorkflow.js','      { key: STORAGE_KEYS.modelResultsV27, value: modelResultItems },\n','')
          replace_once('core/internal/historyWorkflow.js','      version: 7,\n','      version: 8,\n')

          replace_once('core/internal/restoreInspection.js','const { V27_MODEL_VERSION } = internalModules.legacyLoadModelConstants;\n','')
          replace_once('core/internal/restoreInspection.js','const { assertV27ResultSemantics } = internalModules.legacyLoadModel;\n','')
          p=Path('core/internal/restoreInspection.js'); s=p.read_text()
          start=s.index('function inspectV27Results(')
          end=s.index('\nfunction inspectRegionalResults(', start)
          s=s[:start]+s[end+1:]
          p.write_text(s)
          replace_once('core/internal/restoreInspection.js','  const v27Results = collection(snapshot, STORAGE_KEYS.modelResultsV27, []);\n','')
          replace_once('core/internal/restoreInspection.js','    [v27Results, "v27Results", "走行全体の保存済み結果"],\n','')
          replace_once('core/internal/restoreInspection.js','  const v27WithinLimit = withinCollectionLimit(v27Results, INPUT_LIMITS.portableModelResults, "v27Results", "走行全体の保存済み結果", issues);\n','')
          replace_once('core/internal/restoreInspection.js','  if (v27WithinLimit) inspectV27Results(v27Results, recordIds, issues);\n','')
          replace_once('core/internal/restoreInspection.js','    v27Results: Array.isArray(v27Results) ? v27Results.length : 0,\n','')
          replace_once('core/internal/restoreInspection.js','部位別比較値の12部位・入力追跡情報を確認できません。','部位別比較値の12部位・計算結果を確認できません。')

          p=Path('core/internal/consultationReport.js'); s=p.read_text()
          start=s.index('function totalReference(')
          end=s.index('\nfunction modelReference(', start)
          s=s[:start]+s[end+1:]
          p.write_text(s)
          replace_once('core/internal/consultationReport.js','  const total = totalReference(experience);\n','')
          replace_once('core/internal/consultationReport.js','    modelVersion: String(experience?.regionalV2ResultRecord?.model_version || experience?.v27ResultRecord?.model_version || ""),\n','    modelVersion: String(experience?.regionalV2ResultRecord?.model_version || ""),\n')
          replace_once('core/internal/consultationReport.js','    state: isRest ? "REST" : total || regional.state === "SUPPORTED_NUMERIC" ? "RUN" : "NO_NUMERIC_RESULT",\n    total,\n','    state: isRest ? "REST" : regional.state === "SUPPORTED_NUMERIC" ? "RUN" : "NO_NUMERIC_RESULT",\n')
          replace_once('core/internal/consultationReport.js','        total: totalReference(item)?.central ?? null,\n','')
          replace_once('core/internal/consultationReport.js','    const total = report.modelReference.total?.central;\n    if (hasFiniteValue(total)) lines.push(`走り全体の目安：${Math.round(total * 10) / 10}ポイント`);\n','')
          replace_once('core/internal/consultationReport.js','    const total = report.modelReference.total?.central;\n    lines.push(hasFiniteValue(total) ? `走り全体の目安：${Math.round(total * 10) / 10}ポイント` : "走り全体の目安：数値なし");\n','')
          replace_once('core/internal/consultationReport.js','    const total = item.total == null ? "走行全体 数値なし" : `走行全体 ${Math.round(item.total * 10) / 10}`;\n','')
          replace_once('core/internal/consultationReport.js','    return `- ${item.date}：${item.activity}／${total}／${regional}`;\n','    return `- ${item.date}：${item.activity}／${regional}`;\n')

          p=Path('tests/currentOnlyRecordSchema.test.mjs'); s=p.read_text()
          anchor="const primaryResults = fs.readFileSync('core/internal/primaryModelResults.js', 'utf8');"
          if anchor not in s: raise SystemExit('test anchor missing')
          s=s.replace(anchor, anchor+"\nconst appServices = fs.readFileSync('core/internal/applicationServices.js', 'utf8');\nconst platformInfrastructure = fs.readFileSync('core/internal/platformInfrastructure.js', 'utf8');\nconst historyWorkflow = fs.readFileSync('core/internal/historyWorkflow.js', 'utf8');\nconst restoreInspection = fs.readFileSync('core/internal/restoreInspection.js', 'utf8');\nconst consultationReport = fs.readFileSync('core/internal/consultationReport.js', 'utf8');\nconst appEntry = fs.readFileSync('app.js', 'utf8');",1)
          marker="\nconst failed = results.filter((item) => item.status !== 'PASS');"
          block="""\n\ntest('CURRENT-RUNTIME-NO-LONGER-STORES-OR-EXPOSES-V27-RESULTS', () => {\n  assert.ok(!platformInfrastructure.includes('modelResultsV27'));\n  assert.ok(!platformInfrastructure.includes('model-results-v2.7'));\n  assert.ok(!appServices.includes('modelResultsV27'));\n  assert.ok(!appServices.includes('createModelResultV27Repository'));\n  assert.ok(!appServices.includes('v27: Object.freeze'));\n  assert.ok(!appEntry.includes('modelResultV27Repository'));\n  assert.ok(!historyWorkflow.includes('modelResultsV27'));\n  assert.ok(!historyWorkflow.includes('modelResultV27Repository'));\n  assert.ok(!restoreInspection.includes('inspectV27Results'));\n  assert.ok(!restoreInspection.includes('v27Results'));\n  assert.ok(!consultationReport.includes('v27ResultRecord'));\n  assert.ok(!consultationReport.includes('走り全体の目安'));\n});\n"""
          if marker not in s: raise SystemExit('test insertion anchor missing')
          p.write_text(s.replace(marker,block+marker,1))
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do node "$test_file"; done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 164
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'app.js' \
            'core/internal/applicationServices.js' \
            'core/internal/consultationReport.js' \
            'core/internal/historyWorkflow.js' \
            'core/internal/platformInfrastructure.js' \
            'core/internal/restoreInspection.js' \
            'tests/currentOnlyRecordSchema.test.mjs' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 2B1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 2B1: detach obsolete V27 runtime results'
          git push origin HEAD:main
