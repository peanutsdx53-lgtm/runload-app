name: Temporary RunLoad validation

on:
  push:
    branches:
      - fix/interpretation-selected-layout-20260924
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Test suites
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "==> $file"
            node "$file"
          done
