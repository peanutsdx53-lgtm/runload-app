name: RunLoad Current prep energy persistence boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-current-energy-boundary-fix.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b79a2374f41c53bb079fe0c553ce72bb45ba6f82"

      - name: Apply candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/runload-current-energy-boundary-fix.py

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          service-worker.js
          tests/currentOnlyRecordSchema.test.mjs
          tests/mobileHomeAtomicDropCoordinator.test.mjs
          tests/mobileHomeInitialLayout.test.mjs
          tests/mobileHomeIosScrollCapacity.test.mjs
          tests/mobileMeasurementAutoRecord.test.mjs
          tests/runMeasurementNotifications.test.mjs
          tests/runMeasurementRofJBridge.test.mjs
          ui/appVersionStatus.js
          ui/interactions/recordInputInteractions.js
          ui/interactions/runMeasurementInteractions.js
          ui/runMeasurementState.js
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          test "${#files[@]}" -eq 161
          echo "JS/MJS syntax OK: ${#files[@]} files"

      - name: Verify energy boundary contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'keepContinuousRunEnergy' ui/runMeasurementState.js
          grep -q 'runningFormat === "CONTINUOUS_RUN"' ui/runMeasurementState.js
          grep -q 'energyEstimate: keepContinuousRunEnergy ? normalizeEnergyEstimate' ui/runMeasurementState.js
          grep -q 'commitPendingRunMeasurement(result.record.id, { runningFormat: result.record.runningFormat })' ui/interactions/recordInputInteractions.js
          grep -q '連続して走った場合として仮推定しています。走り＋歩きの記録には保存しません。' ui/interactions/runMeasurementInteractions.js
          grep -q 'ENERGY-ESTIMATE-IS-STORED-ONLY-AFTER-CONTINUOUS-RUN-CONFIRMATION' tests/mobileMeasurementAutoRecord.test.mjs
          grep -q 'LIVE-ENERGY-IS-LABELED-AS-PROVISIONAL-CONTINUOUS-RUN-ESTIMATE' tests/runMeasurementRofJBridge.test.mjs
          grep -q 'APP_VERSION = "2026.09.29.8"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.8' service-worker.js

      - name: Commit verified energy boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js tests/currentOnlyRecordSchema.test.mjs tests/mobileHomeAtomicDropCoordinator.test.mjs tests/mobileHomeInitialLayout.test.mjs tests/mobileHomeIosScrollCapacity.test.mjs tests/mobileMeasurementAutoRecord.test.mjs tests/runMeasurementNotifications.test.mjs tests/runMeasurementRofJBridge.test.mjs ui/appVersionStatus.js ui/interactions/recordInputInteractions.js ui/interactions/runMeasurementInteractions.js ui/runMeasurementState.js
          git commit -m 'Current prep: keep energy estimate only for confirmed continuous runs'
          git push origin HEAD:main
