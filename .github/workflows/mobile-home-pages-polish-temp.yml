name: Mobile home pages polish temporary validation

on:
  push:
    branches:
      - feature/mobile-home-pages-20260926

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish page persistence and height
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/interactions/homeInteractions.js')
          s = p.read_text()

          marker = '''  function persistHomeLayout() {\n    writeLayout(root, dockContainer, activePage);\n    writeWidgetLayout(root);\n  }\n\n'''
          addition = marker + '''  function updateViewportHeight() {\n    requestAnimationFrame(() => {\n      const page = currentPageElement();\n      if (!page) return;\n      viewport.style.height = `${Math.max(1, page.scrollHeight)}px`;\n    });\n  }\n\n'''
          if marker not in s:
              raise SystemExit('persist helper marker not found')
          s = s.replace(marker, addition, 1)

          old = '''    viewport.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });\n    updatePageIndicator();\n    if (persist) writeLayout(root, dockContainer, activePage);'''
          new = '''    viewport.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });\n    updatePageIndicator();\n    updateViewportHeight();\n    if (persist) writeLayout(root, dockContainer, activePage);'''
          if old not in s:
              raise SystemExit('setActivePage target not found')
          s = s.replace(old, new, 1)

          # Persist both page index and widget state for all widget mutations.
          for old in [
              '    writeWidgetLayout(root);\n  }\n\n  function removeWidget(id)',
              '    writeWidgetLayout(root);\n    refreshWidgetPicker(root);\n  }\n\n  function addWidget(id)',
              '    writeWidgetLayout(root);\n    closeWidgetPicker();\n  }\n\n  function handleWidgetPickerPointerUp',
          ]:
              if old not in s:
                  raise SystemExit(f'widget persistence target not found: {old[:48]}')
          s = s.replace('    writeWidgetLayout(root);\n  }\n\n  function removeWidget(id)', '    persistHomeLayout();\n    updatePageIndicator();\n    updateViewportHeight();\n  }\n\n  function removeWidget(id)', 1)
          s = s.replace('    writeWidgetLayout(root);\n    refreshWidgetPicker(root);\n  }\n\n  function addWidget(id)', '    persistHomeLayout();\n    refreshWidgetPicker(root);\n    updatePageIndicator();\n    updateViewportHeight();\n  }\n\n  function addWidget(id)', 1)
          s = s.replace('    writeWidgetLayout(root);\n    closeWidgetPicker();\n  }\n\n  function handleWidgetPickerPointerUp', '    persistHomeLayout();\n    closeWidgetPicker();\n    updatePageIndicator();\n    updateViewportHeight();\n  }\n\n  function handleWidgetPickerPointerUp', 1)

          # finishWidgetDrag has two persistence branches; persist complete home state and refresh page controls.
          old = '''    if (!cancelled && target && target !== source && !target.hidden) {\n      target.before(source);\n      writeWidgetLayout(root);\n    } else if (!cancelled && destination) {\n      destination.append(source);\n      writeWidgetLayout(root);\n    }\n  }'''
          new = '''    if (!cancelled && target && target !== source && !target.hidden) {\n      target.before(source);\n      persistHomeLayout();\n      updatePageIndicator();\n      updateViewportHeight();\n    } else if (!cancelled && destination) {\n      destination.append(source);\n      persistHomeLayout();\n      updatePageIndicator();\n      updateViewportHeight();\n    }\n  }'''
          if old not in s:
              raise SystemExit('finishWidgetDrag persistence target not found')
          s = s.replace(old, new, 1)

          # App moves can make an empty page removable.
          s = s.replace('      writeLayout(root, dockContainer, activePage);\n    } else if (!cancelled && targetZone === "apps" && sourceZone === "apps") {', '      writeLayout(root, dockContainer, activePage);\n      updatePageIndicator();\n      updateViewportHeight();\n    } else if (!cancelled && targetZone === "apps" && sourceZone === "apps") {', 1)
          s = s.replace('      writeLayout(root, dockContainer, activePage);\n    } else if (!cancelled && targetZone === sourceZone && targetZone === "dock") {', '      writeLayout(root, dockContainer, activePage);\n      updatePageIndicator();\n      updateViewportHeight();\n    } else if (!cancelled && targetZone === sourceZone && targetZone === "dock") {', 1)
          s = s.replace('      writeLayout(root, dockContainer, activePage);\n    }\n  }\n\n  function finishWidgetDrag', '      writeLayout(root, dockContainer, activePage);\n      updatePageIndicator();\n      updateViewportHeight();\n    }\n  }\n\n  function finishWidgetDrag', 1)

          # Native swipe updates active page height when the page changes.
          old = '''        activePage = bounded;\n        updatePageIndicator();\n        writeLayout(root, dockContainer, activePage);'''
          new = '''        activePage = bounded;\n        updatePageIndicator();\n        updateViewportHeight();\n        writeLayout(root, dockContainer, activePage);'''
          if old not in s:
              raise SystemExit('scroll update target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          css_path = Path('styles/mobile-home-editing.css')
          css = css_path.read_text()
          css = css.replace('''    overflow-x: auto;\n    overflow-y: visible;\n    scroll-snap-type: x mandatory;\n    scroll-behavior: smooth;''', '''    overflow-x: auto;\n    overflow-y: hidden;\n    scroll-snap-type: x mandatory;''', 1)
          old = '''    -webkit-overflow-scrolling: touch;\n  }'''
          new = '''    -webkit-overflow-scrolling: touch;\n    transition: height 160ms ease;\n  }'''
          if old not in css:
              raise SystemExit('viewport transition target not found')
          css = css.replace(old, new, 1)
          css_path.write_text(css)
          PY
      - name: Validate polish
        run: |
          set -euo pipefail
          node --check ui/interactions/homeInteractions.js
          for file in tests/*.test.mjs; do node "$file" >/dev/null; done
          grep -q 'function updateViewportHeight' ui/interactions/homeInteractions.js
          grep -q 'persistHomeLayout();' ui/interactions/homeInteractions.js
          grep -q 'overflow-y: hidden' styles/mobile-home-editing.css
          grep -q 'transition: height 160ms ease' styles/mobile-home-editing.css
          git diff --check
      - name: Commit polish
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/interactions/homeInteractions.js styles/mobile-home-editing.css
          git commit -m "Polish smartphone home page behavior"
          git push
