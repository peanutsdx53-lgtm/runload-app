name: A03 Source, Science and Browser Verification

on:
  pull_request:
    paths:
      - "core/**"
      - "tests/**"
      - ".github/workflows/a03-science-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
      - name: All non-browser regressions
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.test.mjs; do
            if [[ "$test_file" == *mobileWalkJogBrowserFlow.test.mjs ]]; then continue; fi
            node "$test_file" >/tmp/runload-a03-one-test.log 2>&1 || { echo "FAIL: $test_file"; cat /tmp/runload-a03-one-test.log; exit 1; }
            count=$((count+1))
          done
          echo "Verified test modules: $count"
      - name: Mobile browser end-to-end regression
        run: node tests/mobileWalkJogBrowserFlow.test.mjs
      - name: Archive exact tracked source (public repository only)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null --files-from=- -czf /tmp/runload-a03-tracked-source.tar.gz
          test -s /tmp/runload-a03-tracked-source.tar.gz
          sha256sum /tmp/runload-a03-tracked-source.tar.gz
      - name: Upload exact source verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: a03-exact-source-archive
          path: /tmp/runload-a03-tracked-source.tar.gz
          retention-days: 2
          if-no-files-found: error
