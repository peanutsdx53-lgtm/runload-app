name: Desktop Interpretation Regression

on:
  push:
    branches: [main]
    paths:
      - "styles/desktop-interpretation-details.css"
      - "ui/interpretationRoomPresentation.js"
      - "tests/fixtures/desktop-interpretation-compare.html"
      - ".github/workflows/desktop-interpretation-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/runload-interpretation-regression.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/runload-interpretation-regression.log
          exit 1
      - name: Audit opened interpretation details
        shell: bash
        run: |
          set -euo pipefail
          cat > .desktop-interpretation-regression.cjs <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const BASE = 'http://127.0.0.1:4173';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function auditViewport(browser, width, height, name) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(`${BASE}/tests/fixtures/desktop-interpretation-compare.html`, { waitUntil: 'domcontentloaded' });
            await page.addStyleTag({ url: `${BASE}/styles/desktop-interpretation-details.css` });
            await page.evaluate(() => document.body.classList.add('screen--interpretation-room'));
            const details = page.locator('.interpretation-flow-technical-more.interpretation-loop-more').first();
            await details.evaluate((node) => { node.open = true; });
            await page.waitForTimeout(200);

            const summary = await details.locator(':scope > summary').evaluate((node) => {
              const rect = node.getBoundingClientRect();
              const style = getComputedStyle(node);
              return { height: rect.height, fontSize: parseFloat(style.fontSize || '0') };
            });
            assert(summary.height >= 56, `${name}: technical disclosure is too small: ${JSON.stringify(summary)}`);
            assert(summary.fontSize >= 16, `${name}: technical disclosure text is too small: ${JSON.stringify(summary)}`);

            const labels = await page.locator('.interpretation-room-region-chips .region-chip__copy strong').evaluateAll((nodes) => nodes.map((node) => {
              const rect = node.getBoundingClientRect();
              return {
                text: node.textContent?.trim() || '',
                width: rect.width,
                height: rect.height,
                clientWidth: node.clientWidth,
                scrollWidth: node.scrollWidth,
                clientHeight: node.clientHeight,
                scrollHeight: node.scrollHeight,
              };
            }));
            assert(labels.length >= 1, `${name}: expected at least one populated region card`);
            const clipped = labels.filter((item) => item.width < 90 || item.scrollWidth > item.clientWidth + 1 || item.scrollHeight > item.clientHeight + 1);
            assert(clipped.length === 0, `${name}: clipped region labels: ${JSON.stringify(clipped)}`);

            const regionGrid = await page.locator('.interpretation-room-region-chips').first().evaluate((node) => {
              const style = getComputedStyle(node);
              const tracks = style.gridTemplateColumns.trim().split(/\s+/).filter(Boolean);
              return { display: style.display, gridTemplateColumns: style.gridTemplateColumns, tracks: tracks.length };
            });
            assert(regionGrid.display === 'grid', `${name}: region list is not grid: ${JSON.stringify(regionGrid)}`);
            assert(regionGrid.tracks === 2, `${name}: region list is not two-column: ${JSON.stringify(regionGrid)}`);

            const overflow = await page.evaluate(() => ({
              body: document.body.scrollWidth,
              viewport: window.innerWidth,
              details: document.querySelector('.interpretation-flow-technical-more.interpretation-loop-more')?.scrollWidth || 0,
              detailsClient: document.querySelector('.interpretation-flow-technical-more.interpretation-loop-more')?.clientWidth || 0,
            }));
            assert(overflow.body <= overflow.viewport + 1, `${name}: page horizontal overflow: ${JSON.stringify(overflow)}`);
            assert(overflow.details <= overflow.detailsClient + 1, `${name}: details horizontal overflow: ${JSON.stringify(overflow)}`);

            fs.mkdirSync('desktop-interpretation-regression', { recursive: true });
            await page.screenshot({ path: `desktop-interpretation-regression/${name}.png`, fullPage: true });
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await auditViewport(browser, 1440, 900, 'desktop-1440-open');
              await auditViewport(browser, 1024, 900, 'desktop-1024-open');
            } finally {
              await browser.close();
            }
            console.log('Desktop Interpretation Regression: PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node .desktop-interpretation-regression.cjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-interpretation-regression-${{ github.sha }}
          path: desktop-interpretation-regression/
          if-no-files-found: error
          retention-days: 14
