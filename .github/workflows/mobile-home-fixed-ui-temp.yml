name: Mobile home fixed UI temporary validation
on:
  push:
    branches:
      - fix/mobile-home-fixed-ui-return-20260927
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep page indicator visible
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ui/interactions/homeInteractions.js')
          text = path.read_text(encoding='utf-8')
          old = '    pageIndicator.hidden = pages.length <= 1 && !editing;\n'
          new = '    pageIndicator.hidden = false;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one page indicator visibility anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/mobile-home-fixed-ui-temp.yml
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          node tests/mobileHomeFixedUi.test.mjs
          node tests/mobileHomeReturnTransition.test.mjs
          grep -q 'pageIndicator.hidden = false;' ui/interactions/homeInteractions.js
          ! grep -q 'pageIndicator.hidden = pages.length <= 1 && !editing;' ui/interactions/homeInteractions.js
          ! grep -q 'document.querySelector(".mobile-home-os")' ui/mobileHomeReturnTransition.js
          grep -q 'requestAnimationFrame(startReturn)' ui/mobileHomeReturnTransition.js
          git diff --check origin/main...HEAD
          test ! -e .github/workflows/mobile-home-fixed-ui-temp.yml
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep mobile home fixed UI stable after return"
          git push origin HEAD:fix/mobile-home-fixed-ui-return-20260927
