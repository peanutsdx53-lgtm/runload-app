name: Post-cleanup second-pass audit

on:
  push:
    branches:
      - audit/post-cleanup-second-pass-20260926
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify orphan removal
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ui/planPresentation.js
          ! grep -R -n 'planPresentation' app.js core screens ui tests service-worker.js
          echo "ORPHAN_REMOVAL=PASS"
      - name: Verify retained compatibility and evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -e core/legacyCompatibility.js
          grep -q 'CURRENT_INTERNAL_SPECIFICATION' core/internal/evidenceData.js
          grep -q 'buildArticleEvidenceGovernance' core/internal/readingCatalog.js
          grep -q 'evidenceGovernanceData' core/internal/readingService.js
          echo "COMPATIBILITY_AND_EVIDENCE_BOUNDARIES=PASS"
      - name: Runtime reachability
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          const roots=['app.js','ui/pwaUpdateBootstrap.js','service-worker.js'];
          const runtimeDirs=['core','screens','ui'];
          const all=[];
          async function walk(dir){
            for(const ent of await readdir(dir,{withFileTypes:true})){
              const p=path.posix.join(dir,ent.name);
              if(ent.isDirectory()) await walk(p);
              else if(ent.name.endsWith('.js')) all.push(p);
            }
          }
          for(const d of runtimeDirs) await walk(d);
          all.push('app.js','service-worker.js');
          const visited=new Set();
          const pats=[
            /\bfrom\s+["']([^"']+)["']/g,
            /\bimport\s*["']([^"']+)["']/g,
            /\bimport\s*\(\s*["']([^"']+)["']\s*\)/g,
          ];
          async function visit(file){
            if(visited.has(file)) return;
            visited.add(file);
            const text=await readFile(file,'utf8');
            for(const pat of pats){
              for(const m of text.matchAll(pat)){
                const spec=m[1];
                if(!spec.startsWith('.')) continue;
                let resolved=path.posix.normalize(path.posix.join(path.posix.dirname(file),spec));
                if(!path.posix.extname(resolved)) resolved+='.js';
                await visit(resolved);
              }
            }
          }
          for(const r of roots) await visit(r);
          const runtime=new Set(all);
          const unreachable=[...runtime].filter((file)=>!visited.has(file)).sort();
          console.log(JSON.stringify({runtimeFiles:runtime.size,reachable:visited.size,unreachable},null,2));
          if(unreachable.length) process.exitCode=1;
          NODE
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          echo "SYNTAX=PASS"
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            node "$file" >/dev/null
          done
          echo "REGRESSION=PASS"
      - name: Verify PWA precache paths
        shell: bash
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
          echo "PWA_PRECACHE=PASS"
      - name: Development residue boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -R -l -E '\b(TODO|FIXME|HACK|XXX)\b' --include='*.js' --include='*.html' --include='*.css' core screens ui styles app.js index.html 2>/dev/null || true)"
          test -z "$(grep -R -l -E '\b(console\.(log|debug)|debugger)\b' --include='*.js' core screens ui app.js 2>/dev/null || true)"
          ! grep -R -n -E 'selectedA7|runloadCore' --include='*.js' --include='*.mjs' app.js core screens ui tests service-worker.js
          echo "RESIDUE_BOUNDARIES=PASS"
