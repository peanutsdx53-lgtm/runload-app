name: RunLoad Stage 5 zero-point audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage5-zero-point-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact zero-point state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact Stage 4 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "814fae7c5ad672f9030d0d51e10e4e2682c19f9a"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app.js core screens ui -type f -name '*.js' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          echo "Runtime JS syntax OK: ${#files[@]} files"

      - name: Verify zero-data services and empty screens
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createApplicationServices, createMemoryStorage } from './core/appCore.js';
          import { renderHomeScreen } from './screens/homeScreen.js';
          import { renderHistoryScreen } from './screens/historyScreen.js';
          import { renderResultScreen } from './screens/resultScreen.js';

          const storage = createMemoryStorage();
          const services = createApplicationServices({ storage });
          const context = { parameters: new URLSearchParams() };

          assert.equal(services.workflows.records.loadLatestExperience(), null);
          assert.deepEqual(services.workflows.records.loadAllExperiences(), []);
          assert.deepEqual(services.storage.records.loadAll(), []);
          assert.deepEqual(services.storage.modelResultsRegionalV2.loadAll(), []);
          assert.deepEqual(services.storage.subjectiveFeedback.loadAll(), []);
          assert.deepEqual(services.storage.plans.loadAll(), []);

          const home = renderHomeScreen({ services, context });
          assert.match(home, /data-home-state="first"/);
          assert.match(home, /まだ記録はありません|記録なし/);
          assert.match(home, /#\/record-input/);

          const history = renderHistoryScreen({ services, context });
          assert.match(history, /保存した記録はまだありません/);
          assert.match(history, /#\/record-input/);

          const result = renderResultScreen({ services, context });
          assert.match(result, /保存した記録がまだありません/);
          assert.match(result, /#\/record-input/);

          console.log('zero-data service and empty-screen contract OK');
          NODE

      - name: Verify clean first run can save calculate load and render
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createApplicationServices, createMemoryStorage, PRIMARY_REGIONAL_V2_MODEL_VERSION } from './core/appCore.js';
          import { renderResultScreen } from './screens/resultScreen.js';
          import { renderHistoryScreen } from './screens/historyScreen.js';

          const storage = createMemoryStorage();
          const services = createApplicationServices({ storage });
          const saved = services.workflows.records.saveRecordAndFeedback({
            date: '2026-09-29',
            activityType: 'run',
            distanceKm: 5,
            durationMinutes: 30,
            steps: 5000,
            stepsProvenance: 'UNKNOWN',
            runningFormat: 'CONTINUOUS_RUN',
            course: {
              name: '監査用コース',
              gradeKnowledge: 'KNOWN_FLAT',
              gradeInputMode: 'SUMMARY',
              upPercent: 0,
              downPercent: 0,
              upGradePercent: 0,
              downGradePercent: 0,
              surfaceInputMode: 'UNKNOWN',
              modelSurfaceClass: 'UNKNOWN',
              modelSurfaceProfile: [],
            },
            personalContext: null,
          }, {});

          assert.equal(saved.ok, true, JSON.stringify(saved));
          assert.ok(saved.record?.id);
          assert.equal(saved.primaryRegionalV2ResultRecord?.model_version, PRIMARY_REGIONAL_V2_MODEL_VERSION);
          assert.equal(saved.primaryRegionalV2ResultRecord?.result?.regions?.length, 12);
          assert.equal(saved.primaryRegionalV2ResultRecord?.body_map_payload?.regions?.length, 12);
          assert.ok(saved.primaryRegionalV2ResultRecord?.route_trace_version);
          for (const row of saved.primaryRegionalV2ResultRecord.result.regions) {
            assert.ok(Array.isArray(row.routeTrace));
            assert.ok(row.routeTrace.length > 0);
          }

          const loaded = services.workflows.records.loadExperience(saved.record.id);
          assert.equal(loaded?.record?.id, saved.record.id);
          assert.equal(loaded?.regionalV2ResultRecord?.model_version, PRIMARY_REGIONAL_V2_MODEL_VERSION);
          assert.equal(loaded?.regionalV2Result?.regions?.length, 12);

          const context = { parameters: new URLSearchParams({ recordId: saved.record.id }) };
          const resultHtml = renderResultScreen({ services, context });
          assert.match(resultHtml, /12部位/);
          assert.match(resultHtml, /#\/interpretation-room\?recordId=/);
          const historyHtml = renderHistoryScreen({ services, context: { parameters: new URLSearchParams() } });
          assert.match(historyHtml, /保存記録/);
          assert.match(historyHtml, /結果を見る/);

          console.log('clean first-run save -> calculate -> load -> render contract OK');
          NODE

      - name: Audit current-only runtime and retired paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/legacyCompatibility.js
          active_paths=(app.js core screens ui service-worker.js)
          if grep -R -n -i -E 'v27|v2\.7|modelResultsV27|model-results-v2\.7|createModelResultV27Repository|v27Application|modelV27\.js|Current 93-input trace|93-input|93項目|formalInputCatalog|FORMAL_INPUT_CATALOG|RL-IN-090|RL-IN-091|RL-IN-092' "${active_paths[@]}" --exclude-dir=.git; then
            echo 'Retired pre-zero-point runtime residue found' >&2
            exit 1
          fi
          test ! -e core/internal/primaryInputCatalog.js
          test ! -e core/internal/modelV27.js
          test ! -e core/internal/v27ApplicationModel.js
          test ! -e core/internal/v27ApplicationServices.js
          grep -q 'return "home";' ui/deviceLayout.js
          grep -q 'PRE-RELEASE-BUILD-HAS-NO-STORED-DATA-COMPATIBILITY-SHIM' tests/currentOnlyRecordSchema.test.mjs

      - name: Audit AI independence and remote executable dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app.js'), Path('core'), Path('screens'), Path('ui'), Path('index.html'), Path('service-worker.js')]
          files = []
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.exists(): files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.html'})

          ai = re.compile(r'(?i)\b(openai|chatgpt|anthropic|claude|gemini|cohere|mistral|llama|llm)\b|large language model|generative ai')
          remote_exec = re.compile(r'(?i)(?:fetch|WebSocket|EventSource)\s*\(\s*[\'\"]https?://|XMLHttpRequest\s*\(')
          offenders=[]
          for p in files:
              text=p.read_text(errors='ignore')
              if ai.search(text): offenders.append(f'AI token: {p}')
              if remote_exec.search(text): offenders.append(f'remote executable/network literal: {p}')
          index=Path('index.html').read_text()
          if re.search(r'<script[^>]+src=[\'\"]https?://', index, re.I): offenders.append('remote script in index.html')
          if re.search(r'<link[^>]+rel=[\'\"]stylesheet[\'\"][^>]+href=[\'\"]https?://', index, re.I): offenders.append('remote stylesheet in index.html')
          if offenders:
              raise SystemExit('\n'.join(offenders))
          print('AI-independent runtime / no remote executable dependency OK')
          PY

      - name: Verify runtime module graph has no missing or external modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          files=[Path('app.js')]
          files += list(Path('core').rglob('*.js'))
          files += list(Path('screens').rglob('*.js'))
          files += list(Path('ui').rglob('*.js'))
          missing=[]
          external=[]
          import_re=re.compile(r'import\s+(?:[^;]*?\s+from\s+)?[\'\"]([^\'\"]+)[\'\"]\s*;', re.S)
          export_re=re.compile(r'export\s+[^;]*?\s+from\s+[\'\"]([^\'\"]+)[\'\"]\s*;', re.S)
          dynamic_re=re.compile(r'import\(\s*[\'\"]([^\'\"]+)[\'\"]\s*\)')
          for p in files:
              text=p.read_text(errors='ignore')
              specs=import_re.findall(text)+export_re.findall(text)+dynamic_re.findall(text)
              for spec in specs:
                  if not spec.startswith('.'):
                      external.append(f'{p}: {spec}')
                      continue
                  target=(p.parent/spec).resolve()
                  candidates=[target]
                  if target.suffix == '': candidates += [Path(str(target)+'.js'), target/'index.js']
                  if not any(c.exists() and c.is_file() for c in candidates):
                      missing.append(f'{p}: {spec}')
          if external: raise SystemExit('External/bare runtime module imports:\n'+'\n'.join(external))
          if missing: raise SystemExit('Missing relative runtime modules:\n'+'\n'.join(missing))
          print(f'Runtime module graph OK: {len(files)} JS files')
          PY

      - name: Verify PWA precache covers current runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          worker=Path('service-worker.js').read_text()
          match=re.search(r'const PRECACHE_URLS = \[(.*?)\];', worker, re.S)
          if not match: raise SystemExit('PRECACHE_URLS not found')
          urls=re.findall(r'[\'\"](\./[^\'\"]+)[\'\"]', match.group(1))
          if len(urls) != len(set(urls)):
              duplicates=sorted({u for u in urls if urls.count(u)>1})
              raise SystemExit(f'duplicate precache entries: {duplicates}')
          missing_files=[u for u in urls if not Path(u[2:]).is_file()]
          if missing_files: raise SystemExit(f'precache paths missing on disk: {missing_files}')
          cached=set(urls)

          required={'./app.js','./index.html','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png'}
          required.update('./'+p.as_posix() for p in Path('core').rglob('*.js'))
          required.update('./'+p.as_posix() for p in Path('screens').rglob('*.js'))
          required.update('./'+p.as_posix() for p in Path('ui').rglob('*.js'))

          index=Path('index.html').read_text()
          required.update(re.findall(r'(\./[^\'\"?#]+)', index))
          required={item for item in required if Path(item[2:]).is_file()}
          not_cached=sorted(required-cached)
          if not_cached: raise SystemExit('current runtime files absent from PWA precache:\n'+'\n'.join(not_cached))

          version=re.search(r'APP_VERSION = "([^"]+)"', Path('ui/appVersionStatus.js').read_text()).group(1)
          if f'running-record-app-runtime-{version}' not in worker:
              raise SystemExit('app version / service worker cache mismatch')
          print(f'PWA precache OK: {len(cached)} entries; required current runtime {len(required)} files')
          PY

      - name: Recheck Stage 4 calculation/display contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'route_trace_version:PRIMARY_REGIONAL_V2_ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'PERSISTED_ROUTE_TRACE_REQUIRED' core/interpretationCore.js
          grep -q 'resolutionBasis: "PERSISTED_CALCULATION_TRACE"' core/interpretationCore.js
          grep -q 'MISSING-PERSISTED-ROUTE-TRACE-IS-NOT-RECONSTRUCTED' tests/interpretationOutputContract.test.mjs
          grep -q 'ADVANCED-COPY-TRANSLATES-RESEARCH-INTERNALS-BEFORE-DISPLAY' tests/interpretationPresentation.test.mjs
          ! grep -R -n -E 'P1_SOURCE_MODEL_EXTENSION|P2_CROSS_SOURCE_BRIDGE|P2 bridge' screens ui --exclude-dir=.git

      - name: Confirm zero-point audit is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
