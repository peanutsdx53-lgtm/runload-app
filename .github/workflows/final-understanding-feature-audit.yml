name: final-understanding-feature-audit

on:
  push:
    branches:
      - cleanup/interpretation-finalize-20260921
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Current app
        run: node verify_app_current.mjs
      - name: Run every test suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.test.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count + 1))
          done
          echo "TEST_FILES=$count"
      - name: Check every JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
          echo "SYNTAX_FILES=$count"
      - name: Verify runtime SHA-256 manifest
        run: sha256sum -c RUNTIME_SHA256SUMS.txt
      - name: Verify protected cores
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum core/runloadCore.js | awk '{print $1}')" = "b47d1afdbb714c39c32868ed3aaf950f1aa2b71db0f98d3bca0112babc98adc8"
          test "$(sha256sum core/secondPillarRofJ.js | awk '{print $1}')" = "7ea31dbbbd03d5e74960ff0c7de53bc431536d743be6bc46fbf5ac8906063908"
