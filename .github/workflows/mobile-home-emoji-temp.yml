name: Mobile home emoji icon temporary validation
on:
  push:
    branches: [refine/mobile-home-emoji-icons-20260927]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace authored home SVG icons with Unicode emoji
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('screens/homeScreen.js')
          text = path.read_text(encoding='utf-8')
          pattern = r'function mobileHomeIcon\(name\) \{.*?\n\}\n\nfunction renderMobileLauncherItem\(\{ href, label, icon, emoji = "", tone = "blue", dock = false, optional = false \}\) \{\n'
          replacement = 'function renderMobileLauncherItem({ href, label, emoji, tone = "blue", dock = false, optional = false }) {\n'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'homeScreen.js: expected mobileHomeIcon block once, found {count}')
          text = text.replace('  const iconMarkup = emoji ? `<span class="mobile-home-emoji" aria-hidden="true">${escapeHtml(emoji)}</span>` : mobileHomeIcon(icon);\n', '  const iconMarkup = `<span class="mobile-home-emoji" aria-hidden="true">${escapeHtml(emoji)}</span>`;\n', 1)
          old_apps = '''  const apps = [
            { href: "#/simulation?from=home", label: "条件比較", icon: "simulation", tone: "violet" },
            { href: "#/plan", label: "予定", icon: "plan", tone: "orange" },
            { href: "#/reading?origin=home", label: "読みもの", icon: "reading", tone: "green" },
            { href: "#/consultation?from=home", label: "共有", icon: "share", tone: "cyan" },
            { href: "#/settings?from=home", label: "設定", icon: "settings", tone: "gray" },
          ];'''
          new_apps = '''  const apps = [
            { href: "#/simulation?from=home", label: "条件比較", emoji: "⚖️", tone: "violet" },
            { href: "#/plan", label: "予定", emoji: "📅", tone: "orange" },
            { href: "#/reading?origin=home", label: "読みもの", emoji: "📖", tone: "green" },
            { href: "#/consultation?from=home", label: "共有", emoji: "📤", tone: "cyan" },
            { href: "#/settings?from=home", label: "設定", emoji: "⚙️", tone: "gray" },
          ];'''
          if text.count(old_apps) != 1:
              raise SystemExit('homeScreen.js: apps catalog anchor mismatch')
          text = text.replace(old_apps, new_apps, 1)
          old_dock = '''  const dock = [
            { href: "#/record-input", label: "記録", icon: "record", tone: "blue" },
            { href: "#/run-measurement", label: "測定", icon: "measure", tone: "red" },
            { href: "#/history", label: "履歴", icon: "history", tone: "indigo" },
            { href: "#/course-library?returnTo=%23%2Fhome", label: "コース", icon: "course", tone: "green" },
          ];'''
          new_dock = '''  const dock = [
            { href: "#/record-input", label: "記録", emoji: "📒", tone: "blue" },
            { href: "#/run-measurement", label: "測定", emoji: "⏱️", tone: "red" },
            { href: "#/history", label: "履歴", emoji: "🕘", tone: "indigo" },
            { href: "#/course-library?returnTo=%23%2Fhome", label: "コース", emoji: "🗺️", tone: "green" },
          ];'''
          if text.count(old_dock) != 1:
              raise SystemExit('homeScreen.js: dock catalog anchor mismatch')
          text = text.replace(old_dock, new_dock, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('styles/mobile-home.css')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'\n  \.mobile-home-app__icon svg,\n  \.mobile-home-dock__icon svg \{.*?\n  \}\n', '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('mobile-home.css: shared svg icon style block mismatch')
          text, count = re.subn(r'\n  \.mobile-home-dock__icon svg \{\n    width: 27px;\n    height: 27px;\n  \}\n', '\n', text, count=1)
          if count != 1:
              raise SystemExit('mobile-home.css: dock svg icon style block mismatch')
          path.write_text(text, encoding='utf-8')

          path = Path('styles/mobile-home-editing.css')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'\n  \.mobile-home-widget-picker__app-icon svg \{.*?\n  \}\n', '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('mobile-home-editing.css: picker svg style block mismatch')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/mobileQuickTools.test.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = '''  assert.ok(home.includes('emoji: "💧"'));
'''
          extra = '''  assert.ok(home.includes('emoji: "💧"'));
  for (const emoji of ['⚖️', '📅', '📖', '📤', '⚙️', '📒', '⏱️', '🕘', '🗺️']) assert.ok(home.includes(`emoji: "${emoji}"`));
  assert.ok(!home.includes('function mobileHomeIcon'));
  assert.ok(!home.includes('<svg viewBox="0 0 24 24"'));
'''
          if text.count(anchor) != 1:
              raise SystemExit('mobileQuickTools.test.mjs: emoji assertion anchor mismatch')
          text = text.replace(anchor, extra, 1)
          old = "  assert.ok(css.includes('.mobile-home-widget-picker__app-icon svg'));\n"
          new = "  assert.ok(css.includes('.mobile-home-widget-picker__app-icon .mobile-home-emoji'));\n"
          if text.count(old) != 1:
              raise SystemExit('mobileQuickTools.test.mjs: picker svg assertion mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/mobile-home-emoji-temp.yml
      - name: Validate JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Validate icon contract and diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'emoji: "⚖️"' screens/homeScreen.js
          grep -q 'emoji: "📒"' screens/homeScreen.js
          grep -q 'emoji: "🗺️"' screens/homeScreen.js
          ! grep -q 'function mobileHomeIcon' screens/homeScreen.js
          ! grep -q '<svg viewBox="0 0 24 24"' screens/homeScreen.js
          ! grep -q 'mobile-home-app__icon svg' styles/mobile-home.css
          ! grep -q 'mobile-home-widget-picker__app-icon svg' styles/mobile-home-editing.css
          test ! -e .github/workflows/mobile-home-emoji-temp.yml
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens/homeScreen.js styles/mobile-home.css styles/mobile-home-editing.css tests/mobileQuickTools.test.mjs .github/workflows/mobile-home-emoji-temp.yml
          git commit -m "Use emoji icons across mobile home"
          git push origin HEAD:refine/mobile-home-emoji-icons-20260927
