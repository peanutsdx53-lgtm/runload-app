name: Desktop Regression

on:
  push:
    branches: [main]
    paths:
      - "styles/desktop*.css"
      - "styles/pc-*.css"
      - "ui/desktop*.js"
      - "screens/*.js"
      - "screens/**/*.js"
      - "tests/*.test.mjs"
      - "index.html"
      - "service-worker.js"
      - "ui/appVersionStatus.js"
      - ".github/workflows/desktop-regression.yml"
  pull_request:
    paths:
      - "styles/desktop*.css"
      - "styles/pc-*.css"
      - "ui/desktop*.js"
      - "screens/*.js"
      - "screens/**/*.js"
      - "tests/*.test.mjs"
      - "index.html"
      - "service-worker.js"
      - "ui/appVersionStatus.js"
      - ".github/workflows/desktop-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
      - name: Desktop regressions
        shell: bash
        run: |
          set -uo pipefail
          report=/tmp/desktop-regression-report.txt
          : > "$report"
          count=0
          failed=0
          for test_file in tests/desktop*.test.mjs; do
            echo "=== $test_file ===" >> "$report"
            if node "$test_file" >> "$report" 2>&1; then
              echo "PASS $test_file" >> "$report"
            else
              echo "FAIL $test_file" >> "$report"
              failed=1
            fi
            count=$((count+1))
          done
          echo "desktop tests checked: $count" >> "$report"
          cat "$report"
          exit "$failed"
      - name: Upload desktop regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-regression-report
          path: /tmp/desktop-regression-report.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Shared non-browser regressions
        shell: bash
        run: |
          set -uo pipefail
          report=/tmp/shared-regression-report.txt
          : > "$report"
          count=0
          failed=0
          for test_file in tests/*.test.mjs; do
            if [[ "$test_file" == *mobileWalkJogBrowserFlow.test.mjs ]]; then
              continue
            fi
            echo "=== $test_file ===" >> "$report"
            if node "$test_file" >> "$report" 2>&1; then
              echo "PASS $test_file" >> "$report"
            else
              echo "FAIL $test_file" >> "$report"
              failed=1
            fi
            count=$((count+1))
          done
          echo "non-browser tests checked: $count" >> "$report"
          cat "$report"
          exit "$failed"
      - name: Upload shared regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-regression-report
          path: /tmp/shared-regression-report.txt
          if-no-files-found: ignore
          retention-days: 1
