name: Desktop Regression

on:
  push:
    branches: [main]
    paths:
      - "styles/desktop*.css"
      - "styles/pc-*.css"
      - "ui/desktop*.js"
      - "screens/*.js"
      - "tests/desktop*.test.mjs"
      - "index.html"
      - "service-worker.js"
      - "ui/appVersionStatus.js"
      - ".github/workflows/desktop-regression.yml"
  pull_request:
    paths:
      - "styles/desktop*.css"
      - "styles/pc-*.css"
      - "ui/desktop*.js"
      - "screens/*.js"
      - "tests/desktop*.test.mjs"
      - "index.html"
      - "service-worker.js"
      - "ui/appVersionStatus.js"
      - ".github/workflows/desktop-regression.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
      - name: Desktop regressions
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/desktop*.test.mjs; do
            node "$test_file"
            count=$((count+1))
          done
          echo "desktop tests passed: $count"
      - name: Shared non-browser regressions
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for test_file in tests/*.test.mjs; do
            if [[ "$test_file" == *mobileWalkJogBrowserFlow.test.mjs ]]; then
              continue
            fi
            node "$test_file" >/tmp/runload-one-test.log 2>&1 || { cat /tmp/runload-one-test.log; exit 1; }
            pass=$((pass+1))
          done
          echo "non-browser tests passed: $pass"
