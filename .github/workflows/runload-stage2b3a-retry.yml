name: RunLoad Stage 2B3a gated dependency switch retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2b3a-retry.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a35f10a273fe8ffd18826bf59f0ac1a028838412"

      - name: Apply reviewed Stage 2B3a candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/runload-stage2b3a.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/stage2b3a_apply.py').write_text(block)
          PY
          python /tmp/stage2b3a_apply.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected text not found: {path}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'core/internal/restoreInspection.js',
              'import "./courseRepository.js";',
              'import "./applicationDomain.js";\nimport "./courseRepository.js";',
          )
          replace_once(
              'tests/currentOnlyRecordSchema.test.mjs',
              "  assert.ok(appServices.includes('publicHelpGuidance.js'));",
              "  assert.ok(appServices.includes('publicHelpGuidance.js'));\n  assert.ok(restoreInspection.includes('applicationDomain.js'));",
          )
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 164
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'core/appCore.js' \
            'core/internal/applicationServices.js' \
            'core/internal/courseRepository.js' \
            'core/internal/primaryModelEngine.js' \
            'core/internal/primaryModelResults.js' \
            'core/internal/recordWorkflow.js' \
            'core/internal/restoreInspection.js' \
            'screens/readingScreen.js' \
            'tests/currentOnlyRecordSchema.test.mjs' \
            'ui/interactions/gradeDomainConfirmation.js' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 2B3a
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 2B3a: switch current modules off V27 dependencies'
          git push origin HEAD:main
