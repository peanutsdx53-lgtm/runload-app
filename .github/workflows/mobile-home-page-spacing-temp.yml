name: Mobile home page spacing temporary validation

on:
  push:
    branches:
      - fix/mobile-home-page-spacing-20260926

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply spacing and page control fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/mobile-home-editing.css')
          s = p.read_text()

          old = '''  .mobile-home-page-viewport {\n    width: 100%;\n    overflow-x: auto;\n    overflow-y: hidden;\n    scroll-snap-type: x mandatory;\n    overscroll-behavior-x: contain;\n    scrollbar-width: none;\n    -webkit-overflow-scrolling: touch;\n    transition: height 160ms ease;\n  }'''
          new = '''  .mobile-home-page-viewport {\n    width: 100%;\n    margin-bottom: 40px;\n    overflow-x: auto;\n    overflow-y: hidden;\n    scroll-snap-type: x mandatory;\n    overscroll-behavior-x: contain;\n    scrollbar-width: none;\n    -webkit-overflow-scrolling: touch;\n    transition: height 160ms ease;\n  }'''
          if old not in s:
            raise SystemExit('viewport target not found')
          s = s.replace(old, new, 1)

          old = '''  .mobile-home-page-indicator {\n    min-height: 28px;\n    margin: -8px 0 18px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 7px;\n  }'''
          new = '''  .mobile-home-page-indicator {\n    position: fixed;\n    z-index: 52;\n    left: 50%;\n    bottom: calc(116px + env(safe-area-inset-bottom));\n    transform: translateX(-50%);\n    width: max-content;\n    max-width: calc(100vw - 40px);\n    min-height: 36px;\n    margin: 0;\n    padding: 4px 10px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 7px;\n    border: 1px solid color-mix(in srgb, var(--color-line) 70%, transparent);\n    border-radius: 999px;\n    background: color-mix(in srgb, var(--color-surface) 88%, transparent);\n    box-shadow: 0 6px 18px rgba(20, 37, 52, .12);\n    backdrop-filter: blur(18px);\n    -webkit-backdrop-filter: blur(18px);\n  }'''
          if old not in s:
            raise SystemExit('indicator target not found')
          s = s.replace(old, new, 1)

          old = '''  .mobile-home-widget-shell {\n    position: relative;\n    min-width: 0;\n  }'''
          new = '''  .mobile-home-widget-shell {\n    position: relative;\n    min-width: 0;\n  }\n\n  .mobile-home-os.is-home-editing .mobile-home-widget-shell {\n    padding-top: 30px;\n  }'''
          if old not in s:
            raise SystemExit('widget shell target not found')
          s = s.replace(old, new, 1)

          s = s.replace('''    top: -8px;\n    left: -7px;''', '''    top: 0;\n    left: 4px;''', 1)
          s = s.replace('''    top: -8px;\n    right: -7px;''', '''    top: 0;\n    right: 4px;''', 1)

          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do node "$file" >/dev/null; done
          grep -q 'bottom: calc(116px + env(safe-area-inset-bottom))' styles/mobile-home-editing.css
          grep -q 'padding-top: 30px' styles/mobile-home-editing.css
          grep -q 'left: 4px' styles/mobile-home-editing.css
          grep -q 'right: 4px' styles/mobile-home-editing.css
          if grep -q 'top: -8px' styles/mobile-home-editing.css; then exit 1; fi
          git diff --check
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/mobile-home-editing.css
          git commit -m "Fix smartphone home edit spacing"
          git push
