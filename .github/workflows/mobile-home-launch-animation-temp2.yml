name: Mobile home launch animation temporary validation v2

on:
  push:
    branches:
      - feature/mobile-home-launch-animation-20260927
    paths:
      - .github/workflows/mobile-home-launch-animation-temp2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python3 tools/mobile_home_launch_animation_patch.py
      - name: Remove temporary files
        run: git rm .github/workflows/mobile-home-launch-animation-temp.yml .github/workflows/mobile-home-launch-animation-temp2.yml tools/mobile_home_launch_animation_patch.py
      - name: JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'LAUNCH_ANIMATION_MS = 190' ui/interactions/homeInteractions.js
          grep -q 'is-home-launch-target' styles/mobile-home.css
          grep -q 'prefers-reduced-motion: reduce' ui/interactions/homeInteractions.js
          test ! -e .github/workflows/mobile-home-launch-animation-temp.yml
          test ! -e .github/workflows/mobile-home-launch-animation-temp2.yml
          test ! -e tools/mobile_home_launch_animation_patch.py
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mobile home app launch animation"
          git push origin HEAD:feature/mobile-home-launch-animation-20260927
