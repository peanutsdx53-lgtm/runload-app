name: Mobile quick tools validation retry

on:
  push:
    branches:
      - feature/mobile-quick-tools-20260927
    paths:
      - .github/workflows/mobile-quick-tools-retry-temp.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse exact integration script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/mobile-quick-tools-temp.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/integrate.py <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end]) + "\n"
          Path('/tmp/integrate.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/integrate.py
          git rm .github/workflows/mobile-quick-tools-temp.yml
          git rm .github/workflows/mobile-quick-tools-retry-temp.yml
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests including quick tools
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Validate integration contract
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'href: "#/location-note"' screens/homeScreen.js
          grep -q 'href: "#/quick-note"' screens/homeScreen.js
          grep -q 'href: "#/gear-note"' screens/homeScreen.js
          grep -q 'data-home-app-add-id' ui/interactions/homeInteractions.js
          grep -q 'REQUIRED_ITEM_IDS.every' ui/interactions/homeInteractions.js
          grep -q 'renderLocationNoteScreen' app.js
          grep -q 'bindMobileQuickTool' ui/screenInteractions.js
          grep -q './screens/mobileQuickToolsScreen.js' service-worker.js
          grep -q './ui/mobileQuickToolsStore.js' service-worker.js
          grep -q './styles/mobile-quick-tools.css' service-worker.js
          test ! -e .github/workflows/mobile-quick-tools-temp.yml
          test ! -e .github/workflows/mobile-quick-tools-retry-temp.yml
      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional smartphone quick tools"
          git push origin HEAD:feature/mobile-quick-tools-20260927
