name: Mobile photo preview main temporary fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-photo-preview-main-temp.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch selected photo preview
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ui/interactions/mobilePhotoMemoInteractions.js')
          text = p.read_text(encoding='utf-8')
          old = '''  const revokePreview = () => {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = "";
  };'''
          new = '''  const revokePreview = () => {
    previewUrl = "";
    previewImage.removeAttribute("src");
  };'''
          if text.count(old) != 1:
              raise SystemExit('revokePreview anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''      prepared = await preparePhoto(file);
      previewUrl = URL.createObjectURL(prepared.blob);
      previewImage.src = previewUrl;'''
          new = '''      prepared = await preparePhoto(file);
      previewUrl = await blobToDataUrl(prepared.blob);
      previewImage.src = previewUrl;'''
          if text.count(old) != 1:
              raise SystemExit('preview URL anchor mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/mobilePhotoMemo.test.mjs')
          text = p.read_text(encoding='utf-8')
          anchor = '''await test('PHOTO-MEMO-PWA-ASSETS-ARE-PRECACHED', () => {'''
          addition = '''await test('PHOTO-MEMO-SELECTED-PREVIEW-USES-DATA-URL', () => {
  const interactions = read('ui/interactions/mobilePhotoMemoInteractions.js');
  assert.ok(interactions.includes('previewUrl = await blobToDataUrl(prepared.blob)'));
  assert.ok(interactions.includes('previewImage.src = previewUrl'));
  assert.ok(!interactions.includes('previewUrl = URL.createObjectURL(prepared.blob)'));
});

'''
          if text.count(anchor) != 1:
              raise SystemExit('test anchor mismatch')
          text = text.replace(anchor, addition + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/mobile-photo-preview-main-temp.yml
      - name: JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Diff contract
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'previewUrl = await blobToDataUrl(prepared.blob)' ui/interactions/mobilePhotoMemoInteractions.js
          if grep -q 'previewUrl = URL.createObjectURL(prepared.blob)' ui/interactions/mobilePhotoMemoInteractions.js; then exit 1; fi
          test ! -e .github/workflows/mobile-photo-preview-main-temp.yml
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selected photo preview on iPhone"
          git push origin HEAD:main
