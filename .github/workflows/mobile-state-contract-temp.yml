name: Mobile state contract temporary validation

on:
  push:
    branches:
      - fix/mobile-state-color-contract-20260927

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Validate diff whitespace
        run: git diff --check main...HEAD || git diff --check HEAD~1..HEAD
