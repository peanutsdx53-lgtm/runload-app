name: Interpretation Final Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing Current verifier
        run: node verify_app_current.mjs
      - name: Run every test suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed suites: $count"
      - name: Verify runtime SHA-256 manifest
        run: sha256sum -c RUNTIME_SHA256SUMS.txt
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f"
            count=$((count + 1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          echo "Syntax-checked files: $count"
