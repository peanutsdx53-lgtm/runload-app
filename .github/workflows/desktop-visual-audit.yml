name: Desktop Visual Audit

on:
  push:
    branches: [main]
    paths:
      - "styles/**"
      - "screens/**"
      - "ui/**"
      - "index.html"
      - "service-worker.js"
      - ".github/workflows/desktop-visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start local app server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/runload-visual-server.log 2>&1 &
          echo $! > /tmp/runload-visual-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/runload-visual-server.log
          exit 1
      - name: Prepare audit entry page
        shell: bash
        run: |
          cat > .desktop-visual-audit-entry.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <title>RunLoad desktop visual audit</title>
          <script>
          (() => {
            const params = new URLSearchParams(location.search);
            const appearanceMode = params.get("appearance") || "light";
            const colorTheme = params.get("theme") || "standard";
            const route = params.get("route") || "home";
            const settings = {
              appearanceMode,
              colorTheme,
              textSize: "standard",
              resultDisplayMode: "standard",
              selectedRegionalView: "WITHIN_RUN_REGIONAL_EMPHASIS",
              regionalResultInitialView: "all",
              regionalResultLastView: "all",
              showRegionalPreviousComparison: true,
              measurementSoundEnabled: true,
              measurementVibrationEnabled: true,
              termsAcceptedVersion: "terms-20260930-v1",
              termsAcceptedAt: "2026-10-01T00:00:00.000Z",
              guideVersionSeen: "guide-context-help-20260923-v2"
            };
            localStorage.setItem("runner-load-app-new-v1-settings-v1", JSON.stringify(settings));
            location.replace(`./index.html#/${route}`);
          })();
          </script>
          </html>
          HTML
      - name: Capture desktop theme matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          routes=(
            home
            record-input
            result
            history
            interpretation-room
            body-part-detail
            body-timeline
            simulation
            plan
            consultation
            course-library
            course-editor
            gpx-analysis
            run-measurement
            run-route
            reading
            support-guidance
            settings
            more
            terms
            privacy
            about
          )
          appearances=(light dark)
          themes=(standard natural)
          for appearance in "${appearances[@]}"; do
            for theme in "${themes[@]}"; do
              combo="${appearance}-${theme}"
              mkdir -p "visual-audit/${combo}"
              for route in "${routes[@]}"; do
                url="http://127.0.0.1:4173/.desktop-visual-audit-entry.html?appearance=${appearance}&theme=${theme}&route=${route}"
                npx --yes playwright@1.55.0 screenshot \
                  --browser chromium \
                  --viewport-size "1440,900" \
                  --wait-for-timeout 1200 \
                  --full-page \
                  "$url" \
                  "visual-audit/${combo}/${route}.png"
              done
            done
          done
          find visual-audit -type f -name '*.png' -print | sort > visual-audit/manifest.txt
      - name: Upload desktop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-audit-${{ github.sha }}
          path: visual-audit/
          if-no-files-found: error
          retention-days: 14
