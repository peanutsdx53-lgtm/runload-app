name: Mobile picker icon preview temporary validation

on:
  push:
    branches:
      - refine/mobile-add-picker-icons-20260927
    paths:
      - .github/workflows/mobile-picker-icon-preview-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact picker preview edits
        run: |
          set -euo pipefail
          cat > /tmp/patch_picker.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          interactions = 'ui/interactions/homeInteractions.js'
          old = '''function refreshWidgetPicker(root) {
            const overlay = ensureWidgetPicker(root);
          '''
          new = '''function appPickerIconMarkup(root, id) {
            const icon = root.querySelector(`[data-home-app-catalog] [data-home-item-id="${id}"] .mobile-home-app__icon`);
            if (!icon) return "";
            const toneClass = [...icon.classList].find((name) => name.startsWith("mobile-home-tone--")) || "mobile-home-tone--gray";
            return `<div class="mobile-home-widget-picker__app-icon ${toneClass}" aria-hidden="true">${icon.innerHTML}</div>`;
          }

          function refreshWidgetPicker(root) {
            const overlay = ensureWidgetPicker(root);
          '''
          replace_once(interactions, old, new)

          old = '''  if (availableApps.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">アプリアイコン</p>${availableApps.map((item) => `<button type="button" class="mobile-home-widget-picker__option" data-home-app-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
            if (availableWidgets.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">ウィジェット</p>${availableWidgets.map((item) => `<button type="button" class="mobile-home-widget-picker__option" data-home-widget-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
          '''
          new = '''  if (availableApps.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">アプリアイコン</p>${availableApps.map((item) => `<button type="button" class="mobile-home-widget-picker__option mobile-home-widget-picker__option--app" data-home-app-add-id="${item.id}">${appPickerIconMarkup(root, item.id)}<div class="mobile-home-widget-picker__copy"><strong>${item.label}</strong><span>${item.description}</span></div><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
            if (availableWidgets.length) {
              groups.push(`<p class="mobile-home-widget-picker__group-title">ウィジェット</p>${availableWidgets.map((item) => `<button type="button" class="mobile-home-widget-picker__option mobile-home-widget-picker__option--widget" data-home-widget-add-id="${item.id}"><strong>${item.label}</strong><span>${item.description}</span><b aria-hidden="true">＋</b></button>`).join("")}`);
            }
          '''
          replace_once(interactions, old, new)

          css = 'styles/mobile-home-editing.css'
          old = '''  .mobile-home-widget-picker__option span {
              grid-column: 1;
              color: var(--color-muted);
              font-size: 11px;
            }

            .mobile-home-widget-picker__option b {
          '''
          new = '''  .mobile-home-widget-picker__option span {
              grid-column: 1;
              color: var(--color-muted);
              font-size: 11px;
            }

            .mobile-home-widget-picker__group-title {
              margin: 8px 2px 0;
              color: var(--color-muted);
              font-size: 10px;
              font-weight: 900;
              letter-spacing: .08em;
            }

            .mobile-home-widget-picker__option--app {
              min-height: 82px;
              grid-template-columns: 52px minmax(0, 1fr) auto;
              grid-template-rows: 1fr;
              align-items: center;
              column-gap: 12px;
            }

            .mobile-home-widget-picker__app-icon {
              grid-column: 1;
              grid-row: 1;
              width: 48px;
              height: 48px;
              display: grid;
              place-items: center;
              border: 1px solid color-mix(in srgb, currentColor 15%, var(--color-line));
              border-radius: 15px;
              background: linear-gradient(145deg,
                color-mix(in srgb, currentColor 8%, white) 0%,
                color-mix(in srgb, currentColor 13%, var(--color-surface)) 54%,
                color-mix(in srgb, currentColor 21%, var(--color-surface-muted)) 100%);
              box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .82),
                0 6px 14px color-mix(in srgb, currentColor 10%, transparent);
            }

            .mobile-home-widget-picker__app-icon svg {
              width: 25px;
              height: 25px;
              fill: none;
              stroke: currentColor;
              stroke-width: 1.8;
              stroke-linecap: round;
              stroke-linejoin: round;
            }

            .mobile-home-widget-picker__copy {
              grid-column: 2;
              grid-row: 1;
              min-width: 0;
              display: grid;
              gap: 4px;
            }

            .mobile-home-widget-picker__option--app .mobile-home-widget-picker__copy strong,
            .mobile-home-widget-picker__option--app .mobile-home-widget-picker__copy span {
              grid-column: 1;
            }

            .mobile-home-widget-picker__option--app > b {
              grid-column: 3;
              grid-row: 1;
            }

            .mobile-home-widget-picker__option--widget {
              border-style: solid;
              background: color-mix(in srgb, var(--color-surface) 92%, var(--color-paper));
            }

            .mobile-home-widget-picker__option b {
          '''
          replace_once(css, old, new)

          test = 'tests/mobileQuickTools.test.mjs'
          old = '''await test('MOBILE-QUICK-TOOLS-PRESERVE-REQUIRED-HOME-LAYOUT', () => {
          '''
          new = '''await test('MOBILE-QUICK-TOOLS-PICKER-SHOWS-REAL-APP-ICONS', () => {
            const interactions = read('ui/interactions/homeInteractions.js');
            const css = read('styles/mobile-home-editing.css');
            assert.ok(interactions.includes('function appPickerIconMarkup'));
            assert.ok(interactions.includes('.mobile-home-app__icon'));
            assert.ok(interactions.includes('mobile-home-widget-picker__option--app'));
            assert.ok(interactions.includes('mobile-home-widget-picker__option--widget'));
            assert.ok(css.includes('.mobile-home-widget-picker__app-icon svg'));
            assert.ok(css.includes('.mobile-home-widget-picker__option--app'));
          });

          await test('MOBILE-QUICK-TOOLS-PRESERVE-REQUIRED-HOME-LAYOUT', () => {
          '''
          replace_once(test, old, new)
          PY
          python3 /tmp/patch_picker.py
          git rm .github/workflows/mobile-picker-icon-preview-temp.yml
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Validate diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'function appPickerIconMarkup' ui/interactions/homeInteractions.js
          grep -q 'mobile-home-widget-picker__option--app' ui/interactions/homeInteractions.js
          grep -q 'mobile-home-widget-picker__app-icon svg' styles/mobile-home-editing.css
          test ! -e .github/workflows/mobile-picker-icon-preview-temp.yml
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/interactions/homeInteractions.js styles/mobile-home-editing.css tests/mobileQuickTools.test.mjs .github/workflows/mobile-picker-icon-preview-temp.yml
          git commit -m "Show app icons in mobile home add picker"
          git push
