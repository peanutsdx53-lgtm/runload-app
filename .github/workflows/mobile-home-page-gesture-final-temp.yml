name: Mobile home page gesture final temporary validation
on:
  push:
    branches:
      - fix/mobile-home-page-gesture-20260927
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch and remove temporary files
        run: |
          set -euo pipefail
          python3 tmp/mobile_home_page_gesture_patch.py
          git rm .github/workflows/mobile-home-page-gesture-temp.yml
          git rm .github/workflows/mobile-home-page-gesture-final-temp.yml
          git rm tmp/mobile_home_page_gesture_patch.py
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: All regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts and diff check
        run: |
          set -euo pipefail
          node tests/mobileHomePageGesture.test.mjs
          node tests/mobileHomeFixedUi.test.mjs
          node tests/mobileHomeGesturePriority.test.mjs
          grep -q 'touch-action: pan-y' styles/mobile-home-editing.css
          grep -q 'translateX(-50%) translateY(7px)' ui/mobileHomeReturnTransition.js
          grep -q 'if (editing) return;' ui/interactions/homeInteractions.js
          ! find .github/workflows -maxdepth 1 -type f -name '*gesture*temp*' | grep -q .
          git diff --check origin/main...HEAD
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Stabilize mobile home page gestures"
          git push origin HEAD
