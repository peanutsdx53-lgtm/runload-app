name: Mobile Walk Jog Regression

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "core/internal/mobileWalkJogSpeedModel.js"
      - "screens/screenRegistry.js"
      - "screens/mobileScreenRegistry.js"
      - "ui/platformBootstrap.js"
      - "ui/mobileRuntimeEntry.js"
      - "ui/mobileAppRuntime.js"
      - "ui/mobileOnboarding.js"
      - "ui/legalAcceptance.js"
      - "ui/mobileWalkJogMeasurementWiring.js"
      - "ui/mobileWalkJogGpsQuality.js"
      - "ui/mobileWalkJogGpsQualityUi.js"
      - "ui/mobileWalkJogGpsQualityHistoryGuard.js"
      - "ui/mobileWalkJogCopyGuard.js"
      - "ui/mobileWalkJogRecordStore.js"
      - "ui/mobileWalkJogSaveHistoryLink.js"
      - "ui/mobileWalkJogHistoryUi.js"
      - "ui/appVersionStatus.js"
      - "styles/mobile-walk-jog.css"
      - "styles/mobile-walk-jog-records.css"
      - "styles/mobile-walk-jog-history.css"
      - "tests/mobileOnboarding.test.mjs"
      - "tests/mobileWalkJogSpeedModel.test.mjs"
      - "tests/mobileWalkJogMeasurementWiring.test.mjs"
      - "tests/mobileWalkJogRecordStore.test.mjs"
      - "tests/mobileWalkJogCopyGuard.test.mjs"
      - "tests/mobileWalkJogHistoryUi.test.mjs"
      - "tests/mobileWalkJogEdgeCases.test.mjs"
      - "tests/mobileWalkJogGpsQuality.test.mjs"
      - "tests/mobileWalkJogBrowserFlow.test.mjs"
      - "tests/mobileWalkJogPwa.test.mjs"
      - "index.html"
      - "service-worker.js"
      - ".github/workflows/mobile-walk-jog-regression.yml"
  pull_request:
    paths:
      - "app.js"
      - "core/internal/mobileWalkJogSpeedModel.js"
      - "screens/screenRegistry.js"
      - "screens/mobileScreenRegistry.js"
      - "ui/platformBootstrap.js"
      - "ui/mobileRuntimeEntry.js"
      - "ui/mobileAppRuntime.js"
      - "ui/mobileOnboarding.js"
      - "ui/legalAcceptance.js"
      - "ui/mobileWalkJogMeasurementWiring.js"
      - "ui/mobileWalkJogGpsQuality.js"
      - "ui/mobileWalkJogGpsQualityUi.js"
      - "ui/mobileWalkJogGpsQualityHistoryGuard.js"
      - "ui/mobileWalkJogCopyGuard.js"
      - "ui/mobileWalkJogRecordStore.js"
      - "ui/mobileWalkJogSaveHistoryLink.js"
      - "ui/mobileWalkJogHistoryUi.js"
      - "ui/appVersionStatus.js"
      - "styles/mobile-walk-jog.css"
      - "styles/mobile-walk-jog-records.css"
      - "styles/mobile-walk-jog-history.css"
      - "tests/mobileOnboarding.test.mjs"
      - "tests/mobileWalkJogSpeedModel.test.mjs"
      - "tests/mobileWalkJogMeasurementWiring.test.mjs"
      - "tests/mobileWalkJogRecordStore.test.mjs"
      - "tests/mobileWalkJogCopyGuard.test.mjs"
      - "tests/mobileWalkJogHistoryUi.test.mjs"
      - "tests/mobileWalkJogEdgeCases.test.mjs"
      - "tests/mobileWalkJogGpsQuality.test.mjs"
      - "tests/mobileWalkJogBrowserFlow.test.mjs"
      - "tests/mobileWalkJogPwa.test.mjs"
      - "index.html"
      - "service-worker.js"
      - ".github/workflows/mobile-walk-jog-regression.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Walk/Jog model regression
        run: node tests/mobileWalkJogSpeedModel.test.mjs
      - name: Mobile measurement wiring regression
        run: node tests/mobileWalkJogMeasurementWiring.test.mjs
      - name: Mobile activity record-store regression
        run: node tests/mobileWalkJogRecordStore.test.mjs
      - name: Mobile activity edge-case audit
        run: node tests/mobileWalkJogEdgeCases.test.mjs
      - name: Mobile GPS quality gate regression
        run: node tests/mobileWalkJogGpsQuality.test.mjs
      - name: Mobile activity copy regression
        run: node tests/mobileWalkJogCopyGuard.test.mjs
      - name: Mobile activity history isolation regression
        run: node tests/mobileWalkJogHistoryUi.test.mjs
      - name: Mobile onboarding/runtime regression
        run: node tests/mobileOnboarding.test.mjs
      - name: Mobile activity browser flow audit
        run: node tests/mobileWalkJogBrowserFlow.test.mjs
      - name: Mobile activity PWA regression
        run: node tests/mobileWalkJogPwa.test.mjs
      - name: App version/cache consistency
        run: node tests/appVersionStatus.test.mjs
