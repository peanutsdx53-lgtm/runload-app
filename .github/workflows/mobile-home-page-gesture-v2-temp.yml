name: Mobile home page gesture v2 temporary validation

on:
  push:
    branches:
      - fix/mobile-home-page-gesture-20260927
    paths:
      - .github/workflows/mobile-home-page-gesture-v2-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply page gesture patch
        run: |
          set -euo pipefail
          python3 tools/tmp_patch_mobile_home_page_gesture_v4.py
          git rm tools/tmp_patch_mobile_home_page_gesture_v4.py .github/workflows/mobile-home-page-gesture-v2-temp.yml
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          node tests/mobileHomePageGestureV2.test.mjs
          node tests/mobileHomeFixedUi.test.mjs
          git diff --check origin/main...HEAD
          test ! -e tools/tmp_patch_mobile_home_page_gesture_v4.py
          test ! -e .github/workflows/mobile-home-page-gesture-v2-temp.yml
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine mobile home page gestures"
          git push origin HEAD:fix/mobile-home-page-gesture-20260927
