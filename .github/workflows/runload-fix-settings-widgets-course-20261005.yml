name: Apply RunLoad Settings Widgets Course Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runload-fix-settings-widgets-course-20261005.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          root = Path('.')

          p = root / 'screens/settingsScreen.js'
          s = p.read_text()
          helper = 'function checked(current, value) {\n  return current === value ? " checked" : "";\n}\n\n'
          anchor = 'function displayOptionLabel(option) {\n'
          if helper not in s:
              if anchor not in s: raise SystemExit('settings helper anchor missing')
              p.write_text(s.replace(anchor, helper + anchor, 1))

          p = root / 'ui/interactions/mobileHomeLayoutState.js'
          s = p.read_text()
          old = 'export function prepareWidgets(widgetsContainer, services) {\n  const existingAnchors = [...widgetsContainer.children].filter((node) => node.matches?.(".mobile-home-widget"));\n  existingAnchors.forEach((anchor, index) => {\n    const id = widgetIdFromAnchor(anchor, index);\n    if (id) makeWidgetShell(anchor, id);\n  });\n'
          new = 'export function prepareWidgets(widgetsContainer, services) {\n  const existingAnchors = [...widgetsContainer.children].filter((node) => node.matches?.(".mobile-home-widget"));\n  const dynamicSlots = ["plan", "changes"];\n  let dynamicIndex = 0;\n  existingAnchors.forEach((anchor, index) => {\n    const isDynamic = Boolean(anchor.dataset.dynamicWidget);\n    const id = isDynamic ? (dynamicSlots[dynamicIndex++] || "") : widgetIdFromAnchor(anchor, index);\n    if (id) makeWidgetShell(anchor, id);\n  });\n'
          if 'const dynamicSlots = ["plan", "changes"];' not in s:
              if old not in s: raise SystemExit('mobile Home widget anchor missing')
              p.write_text(s.replace(old, new, 1))

          p = root / 'ui/platformStyles.js'
          s = p.read_text()
          if s.index('"./styles/desktop-course.css"') < s.index('"./styles/desktop-unification.css"'):
              if s.count('    "./styles/desktop-course.css",\n') != 1: raise SystemExit('desktop course style count unexpected')
              if s.count('    "./styles/desktop-course-editor.css",\n') != 1: raise SystemExit('desktop course editor style count unexpected')
              s = s.replace('    "./styles/desktop-course.css",\n', '', 1)
              s = s.replace('    "./styles/desktop-course-editor.css",\n', '', 1)
              needle = '    "./styles/desktop-unification.css",\n    "./styles/desktop-interpretation-details.css",'
              replacement = '    "./styles/desktop-unification.css",\n    "./styles/desktop-course.css",\n    "./styles/desktop-course-editor.css",\n    "./styles/desktop-interpretation-details.css",'
              if needle not in s: raise SystemExit('desktop final style group anchor missing')
              p.write_text(s.replace(needle, replacement, 1))

          p = root / 'styles/desktop-course.css'
          s = p.read_text()
          css64 = ''
          if '/* Reference course-screen chrome.' not in s:
              p.write_text(s.rstrip() + base64.b64decode(css64).decode())

          for rel in ['service-worker.js', 'ui/appVersionStatus.js', 'screens/shared/aboutScreen.js']:
              p = root / rel
              t = p.read_text()
              if '2026.10.05.5' not in t:
                  if '2026.10.05.4' not in t: raise SystemExit(f'version anchor missing: {rel}')
                  p.write_text(t.replace('2026.10.05.4', '2026.10.05.5'))
          PY
      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check screens/settingsScreen.js
          node --check ui/interactions/mobileHomeLayoutState.js
          node --check ui/platformStyles.js
          node tests/settingsShareProfile.test.mjs
          node tests/mobileHomeDefaultLayout.test.mjs
          node --test tests/courseBaselineParity.test.mjs
          node tests/desktopCourse.test.mjs
          node tests/desktopCourseEditor.test.mjs
      - name: Verify all non-browser regressions
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for f in tests/*.test.mjs; do
            [[ "$f" == *mobileWalkJogBrowserFlow.test.mjs ]] || files+=("$f")
          done
          node --test "${files[@]}"
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runload-fix-settings-widgets-course-20261005.yml
          git add screens/settingsScreen.js ui/interactions/mobileHomeLayoutState.js ui/platformStyles.js styles/desktop-course.css service-worker.js ui/appVersionStatus.js screens/shared/aboutScreen.js
          git commit -m "Fix mobile settings widgets and restore PC course design"
          git push origin HEAD:main
