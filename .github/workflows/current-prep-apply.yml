name: Current prep patch

on:
  push:
    branches:
      - audit/current-prep-cleanup-20260929
    paths:
      - .current-prep/trigger

permissions:
  contents: write

jobs:
  apply-current-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/current-prep-cleanup-20260929
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .current-prep/part-00.patch \
              .current-prep/part-01.patch \
              .current-prep/part-02.patch \
              .current-prep/part-03.patch \
              .current-prep/part-04.patch > /tmp/current-prep.patch
          git apply --check /tmp/current-prep.patch
          git apply /tmp/current-prep.patch
          rm -rf .current-prep
          rm -f .github/workflows/current-prep-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize current-only pre-release source"
          git push origin HEAD:audit/current-prep-cleanup-20260929
