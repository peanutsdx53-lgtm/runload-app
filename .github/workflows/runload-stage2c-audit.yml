name: RunLoad Stage 2C trace dependency audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2c-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fd40f4ad32dfd8694e1280e467d259a8377036ef"

      - name: Map obsolete trace dependencies
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'primaryRegionalInputTrace|buildRetainedInputTrace|currentAppContextTraceNames|RETAINED_INPUTS' \
            'PRIMARY_INPUT_CATALOG|PRIMARY_INPUT_BY_ID|FORMAL_INPUT|buildAppRetainedInputTrace|buildFormalInputSnapshot' \
            'rpeProvenance|reportedRpeValue|normalizeRpeProvenance|RPE_PROVENANCE' \
            'RL-IN-090|RL-IN-091|RL-IN-092|RL-IN-117|RL-IN-118|RL-IN-119|RL-IN-120|RL-IN-122|RL-IN-123'; do
            echo "=== PATTERN: $pattern ==="
            grep -R -n -E "$pattern" app.js core screens ui tests service-worker.js \
              --exclude-dir=.git || true
          done
