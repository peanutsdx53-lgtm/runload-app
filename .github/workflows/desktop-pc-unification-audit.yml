name: Desktop PC Unification Audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "service-worker.js"
      - "styles/desktop*.css"
      - "ui/desktop*.js"
      - "ui/appVersionStatus.js"
      - "screens/aboutScreen.js"
      - "screens/historyScreen.js"
      - "screens/consultationScreen.js"
      - "screens/privacyScreen.js"
      - "screens/termsScreen.js"
      - "tests/desktopUnificationV59.test.mjs"
      - ".github/workflows/desktop-pc-unification-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static wiring regression
        run: node tests/desktopUnificationV59.test.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/runload-pc-audit-server.log 2>&1 &
          echo $! > /tmp/runload-pc-audit-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/runload-pc-audit-server.log
          exit 1
      - name: Browser regression for reported PC defects
        shell: bash
        run: |
          set -euo pipefail
          cat > .desktop-pc-unification-audit.cjs <<'NODE'
          const { chromium } = require('playwright');

          const BASE = 'http://127.0.0.1:4173';
          const SETTINGS_KEY = 'runner-load-app-new-v1-settings-v1';
          const configured = {
            appearanceMode: 'light',
            colorTheme: 'standard',
            textSize: 'standard',
            resultDisplayMode: 'standard',
            selectedRegionalView: 'WITHIN_RUN_REGIONAL_EMPHASIS',
            regionalResultInitialView: 'all',
            regionalResultLastView: 'all',
            showRegionalPreviousComparison: true,
            measurementSoundEnabled: true,
            measurementVibrationEnabled: true,
            termsAcceptedVersion: 'terms-20260930-v1',
            termsAcceptedAt: '2026-10-04T00:00:00.000Z',
            guideVersionSeen: 'guide-context-help-20260923-v2',
          };

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function openRoute(page, route) {
            await page.goto(`${BASE}/index.html#/${route}`, { waitUntil: 'domcontentloaded' });
            await page.locator('#main-content').waitFor({ state: 'visible' });
            await page.waitForTimeout(250);
          }

          async function assertDerivedFits(page, route) {
            await openRoute(page, route);
            const state = await page.locator('.secondary-derived-screen').evaluate((node) => {
              const rect = node.getBoundingClientRect();
              return {
                left: rect.left,
                right: rect.right,
                width: rect.width,
                viewport: window.innerWidth,
                scrollWidth: node.scrollWidth,
                clientWidth: node.clientWidth,
              };
            });
            assert(state.left >= -1, `${route}: left side is clipped: ${JSON.stringify(state)}`);
            assert(state.right <= state.viewport + 1, `${route}: right side is clipped: ${JSON.stringify(state)}`);
            assert(state.scrollWidth <= state.clientWidth + 1, `${route}: horizontal overflow remains: ${JSON.stringify(state)}`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
              await context.addInitScript(({ SETTINGS_KEY, configured }) => {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(configured));
              }, { SETTINGS_KEY, configured });
              const page = await context.newPage();

              await openRoute(page, 'home');
              await page.locator('.pc-home-heading').waitFor({ state: 'visible' });
              const homeHeader = (await page.locator('#desktop-header-root .app-header__screen-title').textContent() || '').trim();
              assert(homeHeader === 'ホーム', `home: global header title mismatch: ${homeHeader}`);
              assert(await page.locator('.pc-home-heading h1:visible').count() === 0, 'home: duplicate visible Home h1 remains');

              await openRoute(page, 'history');
              const historyHeader = (await page.locator('#desktop-header-root .app-header__screen-title').textContent() || '').trim();
              assert(historyHeader === '履歴', `history: global header title mismatch: ${historyHeader}`);
              assert(await page.locator('.screen--history > .page-head > div:visible').count() === 0, 'history: duplicate visible History heading remains');
              const back = page.locator('#desktop-header-root .pc-global-back');
              await back.waitFor({ state: 'visible' });
              const backStyle = await back.evaluate((node) => {
                const rect = node.getBoundingClientRect();
                const style = getComputedStyle(node);
                return {
                  height: rect.height,
                  borderWidth: parseFloat(style.borderTopWidth || '0'),
                  borderRadius: parseFloat(style.borderRadius || '0'),
                  background: style.backgroundColor,
                };
              });
              assert(backStyle.height >= 40, `back button is too small: ${JSON.stringify(backStyle)}`);
              assert(backStyle.borderWidth >= 1, `back button border missing: ${JSON.stringify(backStyle)}`);
              assert(backStyle.borderRadius >= 10, `back button radius inconsistent: ${JSON.stringify(backStyle)}`);
              assert(backStyle.background !== 'rgba(0, 0, 0, 0)', `back button background missing: ${JSON.stringify(backStyle)}`);

              await assertDerivedFits(page, 'consultation');
              const startButton = page.locator('.screen--consultation .consultation-empty-state .button--primary');
              await startButton.waitFor({ state: 'visible' });
              const buttonColors = await startButton.evaluate((node) => {
                const probe = document.createElement('span');
                probe.style.color = 'var(--color-on-accent)';
                document.body.append(probe);
                const expected = getComputedStyle(probe).color;
                probe.remove();
                return { actual: getComputedStyle(node).color, expected };
              });
              assert(buttonColors.actual === buttonColors.expected, `consultation primary text color mismatch: ${JSON.stringify(buttonColors)}`);

              for (const route of ['about', 'privacy', 'terms']) {
                await assertDerivedFits(page, route);
              }

              await openRoute(page, 'record-input');
              const overlay = page.locator('[data-record-rof-overlay]');
              assert(await overlay.evaluate((node) => node.hidden), 'record: fatigue overlay opens automatically on entry');
              const openFatigue = page.locator('[data-action="open-record-rof"]');
              await openFatigue.click();
              await page.locator('[data-record-rof-slider]').fill('4');
              await page.locator('[data-action="record-rof-value"]').click();
              await page.waitForTimeout(600);
              assert(await page.locator('[data-record-rof-overlay]').evaluate((node) => node.hidden), 'record: pre-run fatigue modal reopened automatically');
              const afterButton = page.locator('[data-action="open-record-rof"]');
              assert((await afterButton.textContent() || '').trim() === '走った後を記録', 'record: post-run action was not reached exactly once');
              await page.waitForTimeout(700);
              assert(await page.locator('[data-record-rof-overlay]').evaluate((node) => node.hidden), 'record: pre-to-post fatigue flow loops without user action');

              await afterButton.click();
              await page.locator('[data-record-rof-slider]').fill('6');
              await page.locator('[data-action="record-rof-value"]').click();
              await page.waitForTimeout(600);
              assert(await page.locator('[data-record-rof-overlay]').evaluate((node) => node.hidden), 'record: post-run fatigue modal reopened automatically');
              const completedButton = page.locator('[data-action="open-record-rof"]');
              assert((await completedButton.textContent() || '').trim() === '記録済み', 'record: fatigue lifecycle did not complete');
              assert(await completedButton.isDisabled(), 'record: completed fatigue action must be disabled');

              console.log('Desktop PC unification browser audit: PASS');
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node .desktop-pc-unification-audit.cjs
