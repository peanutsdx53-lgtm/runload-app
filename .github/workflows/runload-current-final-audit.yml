name: RunLoad Current final app audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-current-final-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "68c8e0b8bc33c6549a8d5955a9c72fe5c27b9be4"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          test "${#files[@]}" -eq 161
          echo "JS/MJS syntax OK: ${#files[@]} files"

      - name: Verify current-only zero-point contract
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/legacyCompatibility.js
          test ! -e core/internal/primaryInputCatalog.js
          test ! -e core/internal/modelV27.js
          test ! -e core/internal/v27ApplicationModel.js
          test ! -e core/internal/v27ApplicationServices.js
          if grep -R -n -i -E 'v27|v2\.7|modelResultsV27|model-results-v2\.7|v27Application|Current 93-input trace|93-input|93項目|formalInputCatalog|FORMAL_INPUT_CATALOG|RL-IN-090|RL-IN-091|RL-IN-092' app.js core screens ui service-worker.js --exclude-dir=.git; then
            echo 'retired runtime residue found' >&2
            exit 1
          fi
          grep -q 'PRE-RELEASE-BUILD-HAS-NO-STORED-DATA-COMPATIBILITY-SHIM' tests/currentOnlyRecordSchema.test.mjs

      - name: Verify 12-region persisted-route contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rows.length!==12' core/internal/primaryModelResults.js
          grep -q 'item.body_map_payload.regions.length!==12' core/internal/primaryModelResults.js
          grep -q 'route_trace_version:PRIMARY_REGIONAL_V2_ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'PERSISTED_ROUTE_TRACE_REQUIRED' core/interpretationCore.js
          grep -q 'resolutionBasis: "PERSISTED_CALCULATION_TRACE"' core/interpretationCore.js
          grep -q 'MISSING-PERSISTED-ROUTE-TRACE-IS-NOT-RECONSTRUCTED' tests/interpretationOutputContract.test.mjs

      - name: Verify smartphone measurement corrections
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'COURSE-ANALYSIS-USES-MEASUREMENT-DISTANCE-INSTEAD-OF-READDING-SMALL-GPS-MOVES' tests/mobileMeasurementAutoRecord.test.mjs
          grep -q 'IMPLAUSIBLE-GRADE-SEGMENTS-DO-NOT-COUNT-AS-ELEVATION-COVERAGE-OR-FLAT' tests/mobileMeasurementAutoRecord.test.mjs
          grep -q 'ENERGY-ESTIMATE-IS-STORED-ONLY-AFTER-CONTINUOUS-RUN-CONFIRMATION' tests/mobileMeasurementAutoRecord.test.mjs
          grep -q 'measuredSegmentDistanceMeters' ui/runMeasurementAutoRecord.js
          grep -q 'gradeEvaluatedM' ui/runMeasurementAutoRecord.js
          grep -q 'keepContinuousRunEnergy' ui/runMeasurementState.js
          grep -q 'runningFormat === "CONTINUOUS_RUN"' ui/runMeasurementState.js
          grep -q 'commitPendingRunMeasurement(result.record.id, { runningFormat: result.record.runningFormat })' ui/interactions/recordInputInteractions.js
          grep -q '連続して走った場合として仮推定しています。走り＋歩きの記録には保存しません。' ui/interactions/runMeasurementInteractions.js

      - name: Exercise clean start through backup restore
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createApplicationServices, createMemoryStorage, PRIMARY_REGIONAL_V2_MODEL_VERSION } from './core/appCore.js';
          import { renderResultScreen } from './screens/resultScreen.js';
          import { renderHistoryScreen } from './screens/historyScreen.js';
          import { renderInterpretationRoomScreen } from './screens/interpretationRoomScreen.js';

          const storage=createMemoryStorage();
          const services=createApplicationServices({storage});
          assert.equal(services.workflows.records.loadLatestExperience(),null);
          const save=services.workflows.records.saveRecordAndFeedback({
            date:'2026-09-29',activityType:'run',distanceKm:5,durationMinutes:30,steps:0,
            stepsProvenance:'UNKNOWN',runningFormat:'CONTINUOUS_RUN',personalContext:null,
            course:{name:'最終監査',gradeKnowledge:'KNOWN_FLAT',gradeInputMode:'SUMMARY',upPercent:0,downPercent:0,upGradePercent:0,downGradePercent:0,surfaceInputMode:'UNKNOWN',modelSurfaceClass:'UNKNOWN',modelSurfaceProfile:[]}
          },{});
          assert.equal(save.ok,true,JSON.stringify(save));
          assert.equal(save.primaryRegionalV2ResultRecord?.model_version,PRIMARY_REGIONAL_V2_MODEL_VERSION);
          assert.equal(save.primaryRegionalV2ResultRecord?.result?.regions?.length,12);
          for(const row of save.primaryRegionalV2ResultRecord.result.regions) assert.ok(row.routeTrace?.length>0);
          const id=save.record.id;
          const context={parameters:new URLSearchParams({recordId:id,regionId:'BA-DISP-014',origin:'result'})};
          assert.match(renderResultScreen({services,context}),/12部位/);
          assert.match(renderHistoryScreen({services,context:{parameters:new URLSearchParams()}}),/保存記録/);
          const interpretation=renderInterpretationRoomScreen({services,context});
          assert.match(interpretation,/基準100/);
          assert.doesNotMatch(interpretation,/Reference-100|P1_SOURCE_MODEL_EXTENSION|P2_CROSS_SOURCE_BRIDGE|P2 bridge/);
          const backup=services.storage.backup.exportBackupText();
          const restored=createApplicationServices({storage:createMemoryStorage()});
          const inspection=restored.storage.backup.inspectBackupText(backup);
          assert.equal(inspection.canRestore,true,JSON.stringify(inspection));
          assert.equal(restored.storage.backup.restoreInspectedBackup(inspection,{acceptReview:true}).ok,true);
          assert.equal(restored.workflows.records.loadAllExperiences().length,1);
          assert.equal(restored.workflows.records.loadLatestExperience()?.regionalV2Result?.regions?.length,12);
          console.log('clean start / calculation / presentation / backup restore OK');
          NODE

      - name: Verify AI independence and runtime module graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('app.js'),Path('index.html'),Path('service-worker.js')]+list(Path('core').rglob('*.js'))+list(Path('screens').rglob('*.js'))+list(Path('ui').rglob('*.js'))
          ai=re.compile(r'(?i)\b(openai|chatgpt|anthropic|claude|gemini|cohere|mistral|llama|llm)\b|large language model|generative ai')
          imports=re.compile(r'import\s+(?:[^;]*?\s+from\s+)?[\'\"]([^\'\"]+)[\'\"]\s*;',re.S)
          issues=[]
          for p in files:
              text=p.read_text(errors='ignore')
              if ai.search(text): issues.append(f'AI token: {p}')
              for spec in imports.findall(text):
                  if not spec.startswith('.'): issues.append(f'external module: {p}: {spec}')
                  else:
                      target=(p.parent/spec).resolve()
                      candidates=[target] if target.suffix else [target,Path(str(target)+'.js'),target/'index.js']
                      if not any(c.is_file() for c in candidates): issues.append(f'missing module: {p}: {spec}')
          if issues: raise SystemExit('\n'.join(issues))
          print('AI independence and module graph OK')
          PY

      - name: Verify PWA and release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION = "2026.09.29.8"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.8' service-worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          worker=Path('service-worker.js').read_text()
          block=re.search(r'const PRECACHE_URLS = \[(.*?)\];',worker,re.S)
          if not block: raise SystemExit('PRECACHE_URLS missing')
          urls=re.findall(r'[\'\"](\./[^\'\"]+)[\'\"]',block.group(1))
          if len(urls)!=150 or len(urls)!=len(set(urls)): raise SystemExit(f'precache count/duplicate mismatch: {len(urls)}')
          absent=[u for u in urls if not Path(u[2:]).is_file()]
          if absent: raise SystemExit(f'missing precache paths: {absent}')
          print('PWA precache OK: 150')
          PY

      - name: Verify no temporary helpers besides this audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .github/scripts
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f | sort)
          test "${#workflows[@]}" -eq 1
          test "${workflows[0]}" = '.github/workflows/runload-current-final-audit.yml'

      - name: Confirm audit is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
