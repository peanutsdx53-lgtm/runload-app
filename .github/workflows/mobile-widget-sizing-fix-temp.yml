name: Mobile widget sizing interaction fix temporary validation

on:
  push:
    branches:
      - feature/mobile-widget-sizing-20260926

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Separate widget size state from resize action
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/interactions/homeInteractions.js')
          s = p.read_text()
          replacements = [
            ('shell.querySelector("[data-home-widget-size]")', 'shell.querySelector("[data-home-widget-resize]")'),
            ('sizeButton.dataset.homeWidgetSize = id;', 'sizeButton.dataset.homeWidgetResize = id;'),
            ('event.target.closest("[data-home-widget-size]")', 'event.target.closest("[data-home-widget-resize]")'),
            ('cycleWidgetSize(size.dataset.homeWidgetSize);', 'cycleWidgetSize(size.dataset.homeWidgetResize);'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing target: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          set -euo pipefail
          node --check ui/interactions/homeInteractions.js
          for file in tests/*.test.mjs; do node "$file" >/dev/null; done
          grep -q 'data-home-widget-resize' ui/interactions/homeInteractions.js
          grep -q 'dataset.homeWidgetResize' ui/interactions/homeInteractions.js
          grep -q 'dataset.homeWidgetSize = normalized' ui/interactions/homeInteractions.js
          if grep -q 'event.target.closest("\[data-home-widget-size\]")' ui/interactions/homeInteractions.js; then exit 1; fi
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/interactions/homeInteractions.js
          git commit -m "Separate widget resize action from size state"
          git push
