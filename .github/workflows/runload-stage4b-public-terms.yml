name: RunLoad Stage 4B public terminology cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage4b-public-terms.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "983a054ddefc4d1c9f56eebd1c894764e5a94e46"

      - name: Capture calculation and storage core hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum core/internal/primaryModelEngine.js core/internal/primaryModelResults.js core/interpretationCore.js > /tmp/stage4b-core-before.sha256

      - name: Apply Stage 4B candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/runload-stage4b-patch.py

      - name: Verify calculation and storage core are untouched
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/stage4b-core-before.sha256

      - name: Verify exact candidate change set
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          service-worker.js
          tests/currentOnlyRecordSchema.test.mjs
          tests/interpretationPresentation.test.mjs
          tests/mobileHomeAtomicDropCoordinator.test.mjs
          tests/mobileHomeInitialLayout.test.mjs
          tests/mobileHomeIosScrollCapacity.test.mjs
          tests/runMeasurementNotifications.test.mjs
          ui/appVersionStatus.js
          ui/interpretationRoomPresentation.js
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          echo "JS syntax OK: ${#files[@]} files"

      - name: Verify public terminology boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ADVANCED-COPY-TRANSLATES-RESEARCH-INTERNALS-BEFORE-DISPLAY' tests/interpretationPresentation.test.mjs
          grep -q '応力の積み重なりを表す指標' ui/interpretationRoomPresentation.js
          grep -q 'ひずみの積み重なりを表す指標' ui/interpretationRoomPresentation.js
          grep -q 'publicSourceRoleText' ui/interpretationRoomPresentation.js
          grep -q '相対ピッチ応答' tests/interpretationPresentation.test.mjs
          grep -q 'APP_VERSION = "2026.09.29.6"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.6' service-worker.js

      - name: Commit verified Stage 4B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js tests/currentOnlyRecordSchema.test.mjs tests/interpretationPresentation.test.mjs tests/mobileHomeAtomicDropCoordinator.test.mjs tests/mobileHomeInitialLayout.test.mjs tests/mobileHomeIosScrollCapacity.test.mjs tests/runMeasurementNotifications.test.mjs ui/appVersionStatus.js ui/interpretationRoomPresentation.js
          git commit -m 'Stage 4B: translate advanced public terminology'
          git push origin HEAD:main
