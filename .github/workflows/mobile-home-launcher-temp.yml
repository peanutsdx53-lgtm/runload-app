name: Mobile home launcher temporary validation

on:
  push:
    branches:
      - fix/mobile-home-longpress-and-removable-apps-20260927
    paths:
      - .github/workflows/mobile-home-launcher-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mobile-home-longpress-and-removable-apps-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused home launcher patch
        run: python .github/scripts/mobile_home_launcher_patch.py
      - name: JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          grep -q 'class="mobile-home-app__launch"' screens/homeScreen.js
          grep -q -- '-webkit-touch-callout: none !important' styles/mobile-quick-tools.css
          grep -q 'function removeHomeApp(id)' ui/interactions/homeInteractions.js
          grep -q 'function addHomeApp(id)' ui/interactions/homeInteractions.js
          ! grep -q 'REQUIRED_ITEM_IDS.every' ui/interactions/homeInteractions.js
          ! grep -q 'OPTIONAL_APP_CATALOG' ui/interactions/homeInteractions.js
          git diff --check origin/main...HEAD || true
          git diff --check
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix mobile home long press and make all apps configurable'
          git push origin HEAD:fix/mobile-home-longpress-and-removable-apps-20260927