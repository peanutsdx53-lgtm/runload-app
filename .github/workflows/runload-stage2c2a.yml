name: RunLoad Stage 2C2a gated formal catalog retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2c2a.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eeb4f216fc34619bfa26ffbab08afe493f62bcf8"

      - name: Extract current surface presets and retire dead formal input system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_path = Path('core/internal/primaryInputCatalog.js')
          src = old_path.read_text()
          start = src.find('const SURFACE_PRESETS = Object.freeze({')
          end = src.find('\nconst ORACLE_EXPECTED = Object.freeze({', start)
          if start < 0 or end < 0:
              raise SystemExit('SURFACE_PRESETS extraction markers not found')
          surface_definition = src[start:end].rstrip()
          if not surface_definition.endswith('});'):
              raise SystemExit('SURFACE_PRESETS extraction did not end cleanly')

          new_path = Path('core/internal/surfacePresetCatalog.js')
          new_path.write_text(
              'import { internalModules } from "./modules.js";\n\n'
              '// Current surface preset data used by the record-to-primary-model adapter.\n'
              '{\n'
              'const moduleExports = Object.create(null);\n'
              + surface_definition + '\n'
              'moduleExports["SURFACE_PRESETS"] = SURFACE_PRESETS;\n'
              'internalModules.surfacePresetCatalog = moduleExports;\n'
              '}\n'
          )
          old_path.unlink()

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          def remove_between(path, start_marker, end_marker):
              p = Path(path)
              s = p.read_text()
              start_i = s.find(start_marker)
              end_i = s.find(end_marker, start_i + len(start_marker))
              if start_i < 0 or end_i < 0:
                  raise SystemExit(f"markers not found: {path}")
              p.write_text(s[:start_i] + end_marker + s[end_i + len(end_marker):])

          replace_once(
              'core/internal/primaryInputProcessing.js',
              'import "./primaryInputCatalog.js";',
              'import "./surfacePresetCatalog.js";',
          )
          replace_once(
              'core/internal/primaryInputProcessing.js',
              'const { SURFACE_PRESETS } = internalModules.formalInputCatalog;',
              'const { SURFACE_PRESETS } = internalModules.surfacePresetCatalog;',
          )
          remove_between(
              'core/internal/primaryInputProcessing.js',
              '// ===== core/model/currentPrimaryInput/formalInputValidation.js =====\n',
              '// ===== core/model/primaryRegionalV2/primaryRegionalV2AppAdapter.js =====\n',
          )

          # Result service consumes the primary engine directly, so make that dependency explicit.
          replace_once(
              'core/internal/primaryModelResults.js',
              'import "./primaryInputProcessing.js";\n',
              'import "./primaryModelEngine.js";\nimport "./primaryInputProcessing.js";\n',
          )

          replace_once(
              'service-worker.js',
              '  "./core/internal/primaryInputCatalog.js",\n',
              '  "./core/internal/surfacePresetCatalog.js",\n',
          )
          replace_once(
              'docs/CODEBASE_ARCHITECTURE.md',
              '- `internal/primaryInputCatalog.js`: formal primary-input catalog and metadata.\n',
              '- `internal/surfacePresetCatalog.js`: current surface preset data used by the primary-model input adapter.\n',
          )

          p = Path('tests/currentOnlyRecordSchema.test.mjs')
          s = p.read_text()
          declaration_anchor = "const primaryInputProcessing = fs.readFileSync('core/internal/primaryInputProcessing.js', 'utf8');\n"
          declaration = "const surfacePresetCatalog = fs.readFileSync('core/internal/surfacePresetCatalog.js', 'utf8');\n"
          if declaration_anchor not in s:
              raise SystemExit('test declaration anchor not found')
          s = s.replace(declaration_anchor, declaration_anchor + declaration, 1)
          insert_before = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          new_test = """

          test('DEAD-FORMAL-INPUT-SYSTEM-IS-RETIRED-WHILE-SURFACE-PRESETS-REMAIN', () => {
            assert.equal(fs.existsSync('core/internal/primaryInputCatalog.js'), false);
            assert.equal(fs.existsSync('core/internal/surfacePresetCatalog.js'), true);
            assert.ok(surfacePresetCatalog.includes('const SURFACE_PRESETS = Object.freeze({'));
            assert.ok(primaryInputProcessing.includes('surfacePresetCatalog.js'));
            assert.ok(primaryInputProcessing.includes('internalModules.surfacePresetCatalog'));
            assert.ok(!primaryInputProcessing.includes('formalInputValidation'));
            assert.ok(!primaryInputProcessing.includes('formalInputAdapter'));
            assert.ok(!primaryInputProcessing.includes('FORMAL_INPUT_CATALOG'));
            assert.ok(!primaryInputProcessing.includes('adaptPrototypeRecord'));
            assert.ok(!primaryInputProcessing.includes('validateFormalInputBundle'));
            assert.ok(!worker.includes('./core/internal/primaryInputCatalog.js'));
            assert.ok(worker.includes('./core/internal/surfacePresetCatalog.js'));
          });
          """.replace('          ', '')
          if insert_before not in s:
              raise SystemExit('test insertion anchor not found')
          p.write_text(s.replace(insert_before, new_test + insert_before, 1))
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 161
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify formal input subsystem is absent from runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/internal/primaryInputCatalog.js
          test -e core/internal/surfacePresetCatalog.js
          ! grep -R -n -E 'formalInputCatalog|FORMAL_INPUT_CATALOG|formalInputValidation|formalInputAdapter|adaptPrototypeRecord|validateFormalInputBundle' \
            core app.js screens ui service-worker.js \
            --exclude-dir=.git

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'core/internal/primaryInputCatalog.js' \
            'core/internal/primaryInputProcessing.js' \
            'core/internal/primaryModelResults.js' \
            'core/internal/surfacePresetCatalog.js' \
            'docs/CODEBASE_ARCHITECTURE.md' \
            'service-worker.js' \
            'tests/currentOnlyRecordSchema.test.mjs' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 2C2a
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 2C2a: retire dead formal input catalog'
          git push origin HEAD:main
