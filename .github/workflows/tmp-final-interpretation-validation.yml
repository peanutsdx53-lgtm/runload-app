name: Temporary final interpretation validation

on:
  push:
    branches:
      - fix/interpretation-selected-composition-20260924
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax and all test suites
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r file; do
            if ! node --check "$file"; then failures=$((failures + 1)); fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          for file in tests/*.test.mjs; do
            echo "==> $file"
            if ! node "$file"; then failures=$((failures + 1)); fi
          done
          echo "Validation failures: $failures"
          test "$failures" -eq 0