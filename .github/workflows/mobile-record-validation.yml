name: Mobile record validation

on:
  push:
    branches:
      - mobile/record-input-shell-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-record-validation.yml|index.html|service-worker.js|styles/mobile-record.css)$' || true)"
          test -z "$unexpected"
          ! echo "$changed" | grep -Eq '^styles/(desktop|desktop-foundation)\.css$'
          ! echo "$changed" | grep -Eq '^screens/recordInputScreen\.js$'
          ! echo "$changed" | grep -Eq '^ui/interactions/recordInputInteractions\.js$'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify mobile record stylesheet boundary
        run: |
          set -euo pipefail
          grep -q '@media (max-width: 54.99rem)' styles/mobile-record.css
          ! grep -q '@media (min-width:' styles/mobile-record.css
          grep -q 'primary-navigation__link:not(\[data-navigation-screen="home"\])' styles/mobile-record.css
          grep -q 'mobile-save-bar' styles/mobile-record.css
          grep -q './styles/mobile-record.css' index.html
          grep -q './styles/mobile-record.css' service-worker.js
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('styles/mobile-record.css', 'utf8');
          let depth = 0;
          for (const ch of css) {
            if (ch === '{') depth += 1;
            if (ch === '}') depth -= 1;
            if (depth < 0) throw new Error('CSS brace underflow');
          }
          if (depth !== 0) throw new Error(`CSS brace mismatch: ${depth}`);
          NODE
      - name: Verify PWA precache paths
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
