name: RunLoad Stage 2B3 post-switch audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2b3-postaudit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a9969a98805f8321bf8814202246e5d52baf78c9"

      - name: List all remaining V27 references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== filenames ==='
          find . -type f \( -iname '*v27*' -o -iname '*v2.7*' \) -not -path './.git/*' | sort
          echo '=== content refs ==='
          grep -R -n -E 'modelV27|v27ApplicationModel|v27ApplicationServices|legacyLoad|V27_|v2\.7|V2\.7' . \
            --exclude-dir=.git \
            --exclude='runload-stage2b3-postaudit.yml' || true
