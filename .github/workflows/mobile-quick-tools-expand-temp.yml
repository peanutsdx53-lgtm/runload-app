name: Mobile quick tools expansion temporary validation

on:
  push:
    branches:
      - feature/mobile-quick-tools-expand-20260927
    paths:
      - .github/workflows/mobile-quick-tools-expand-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact mobile quick-tool edits
        run: |
          set -euo pipefail
          cat > /tmp/expand_tools.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'screens/homeScreen.js'
          replace_once(path,
          '''function renderMobileLauncherItem({ href, label, icon, tone = "blue", dock = false, optional = false }) {
            const className = dock ? "mobile-home-dock__item" : "mobile-home-app";
            const iconClass = dock ? "mobile-home-dock__icon" : "mobile-home-app__icon";
            const labelClass = dock ? "mobile-home-dock__label" : "mobile-home-app__label";
            const content = `<span class="${iconClass} mobile-home-tone--${escapeHtml(tone)}">${mobileHomeIcon(icon)}</span><span class="${labelClass}">${escapeHtml(label)}</span>`;
          ''',
          '''function renderMobileLauncherItem({ href, label, icon, emoji = "", tone = "blue", dock = false, optional = false }) {
            const className = dock ? "mobile-home-dock__item" : "mobile-home-app";
            const iconClass = dock ? "mobile-home-dock__icon" : "mobile-home-app__icon";
            const labelClass = dock ? "mobile-home-dock__label" : "mobile-home-app__label";
            const iconMarkup = emoji ? `<span class="mobile-home-emoji" aria-hidden="true">${escapeHtml(emoji)}</span>` : mobileHomeIcon(icon);
            const content = `<span class="${iconClass} mobile-home-tone--${escapeHtml(tone)}">${iconMarkup}</span><span class="${labelClass}">${escapeHtml(label)}</span>`;
          ''')
          replace_once(path,
          '''  const optionalApps = [
              { href: "#/location-note", label: "地点メモ", icon: "location-note", tone: "cyan", optional: true },
              { href: "#/quick-note", label: "1分メモ", icon: "quick-note", tone: "violet", optional: true },
              { href: "#/gear-note", label: "装備メモ", icon: "gear-note", tone: "orange", optional: true },
            ];
          ''',
          '''  const optionalApps = [
              { href: "#/location-note", label: "地点メモ", emoji: "📍", tone: "cyan", optional: true },
              { href: "#/quick-note", label: "1分メモ", emoji: "📝", tone: "violet", optional: true },
              { href: "#/gear-note", label: "装備メモ", emoji: "🎒", tone: "orange", optional: true },
              { href: "#/departure-check", label: "出発チェック", emoji: "✅", tone: "green", optional: true },
              { href: "#/fuel-note", label: "補給メモ", emoji: "💧", tone: "cyan", optional: true },
            ];
          ''')

          path = 'ui/interactions/homeInteractions.js'
          replace_once(path,
          '''const OPTIONAL_APP_CATALOG = Object.freeze([
            Object.freeze({ id: "location-note", label: "地点メモ", description: "現在地と短いメモを保存" }),
            Object.freeze({ id: "quick-note", label: "1分メモ", description: "気づきを短く残す" }),
            Object.freeze({ id: "gear-note", label: "装備メモ", description: "その日の装備を保存" }),
          ]);
          ''',
          '''const OPTIONAL_APP_CATALOG = Object.freeze([
            Object.freeze({ id: "location-note", label: "地点メモ", description: "現在地と短いメモを保存" }),
            Object.freeze({ id: "quick-note", label: "1分メモ", description: "気づきを短く残す" }),
            Object.freeze({ id: "gear-note", label: "装備メモ", description: "その日の装備を保存" }),
            Object.freeze({ id: "departure-check", label: "出発チェック", description: "出発前の準備を確認" }),
            Object.freeze({ id: "fuel-note", label: "補給メモ", description: "水分や補給を時刻付きで記録" }),
          ]);
          ''')
          replace_once(path,
          '''  ["#/gear-note", "gear-note"],
            ["#/record-input", "record"],
          ''',
          '''  ["#/gear-note", "gear-note"],
            ["#/departure-check", "departure-check"],
            ["#/fuel-note", "fuel-note"],
            ["#/record-input", "record"],
          ''')

          path = 'ui/mobileQuickToolsStore.js'
          replace_once(path,
          '''  quick: "quickNotes",
            gear: "gearNotes",
          });
          ''',
          '''  quick: "quickNotes",
            gear: "gearNotes",
            departure: "departureChecks",
            fuel: "fuelNotes",
          });
          ''')
          replace_once(path,
          '''    quickNotes: [],
              gearNotes: [],
            };
          ''',
          '''    quickNotes: [],
              gearNotes: [],
              departureChecks: [],
              fuelNotes: [],
            };
          ''')
          replace_once(path,
          '''      quickNotes: normalizeCollection(parsed.quickNotes),
                gearNotes: normalizeCollection(parsed.gearNotes),
              };
          ''',
          '''      quickNotes: normalizeCollection(parsed.quickNotes),
                gearNotes: normalizeCollection(parsed.gearNotes),
                departureChecks: normalizeCollection(parsed.departureChecks),
                fuelNotes: normalizeCollection(parsed.fuelNotes),
              };
          ''')

          path = 'screens/mobileQuickToolsScreen.js'
          replace_once(path,
          '''function renderShell({ tool, eyebrow, title, description, form, historyTitle, history }) {
          ''',
          '''function renderDepartureHistory(entries) {
            if (!entries.length) return renderEmptyHistory("保存した出発チェック");
            return entries.slice(0, 5).map((entry) => {
              const checks = Array.isArray(entry.checks) ? entry.checks.filter(Boolean) : [];
              const summary = checks.length ? checks.join(" ・ ") : "確認項目なし";
              return `<article class="mobile-tool-history__item"><div><small>${escapeHtml(formatTimestamp(entry.createdAt))}</small><strong>出発チェック</strong><p>${escapeHtml(summary)}</p>${entry.note ? `<span>${escapeHtml(entry.note)}</span>` : ""}</div>${renderDeleteButton("departure", entry.id)}</article>`;
            }).join("");
          }

          function renderFuelHistory(entries) {
            if (!entries.length) return renderEmptyHistory("保存した補給メモ");
            return entries.slice(0, 5).map((entry) => {
              const title = entry.kind || "補給";
              const details = [entry.amount, entry.note].filter(Boolean).join(" ・ ");
              return `<article class="mobile-tool-history__item"><div><small>${escapeHtml(formatTimestamp(entry.createdAt))}</small><strong>${escapeHtml(title)}</strong><p>${escapeHtml(details || "内容メモなし")}</p></div>${renderDeleteButton("fuel", entry.id)}</article>`;
            }).join("");
          }

          function renderShell({ tool, eyebrow, title, description, form, historyTitle, history }) {
          ''')
          append = '''

          export function renderDepartureCheckScreen() {
            const state = loadMobileQuickTools();
            const form = `<form class="mobile-tool-card" data-mobile-tool-form="departure">
              <div class="mobile-tool-card__lead"><div><small>出発前</small><strong>必要な準備だけ短く確認</strong></div></div>
              <fieldset class="mobile-tool-choice mobile-tool-choice--checklist"><legend>確認項目</legend><label><input type="checkbox" name="checks" value="水分"><span>水分</span></label><label><input type="checkbox" name="checks" value="鍵・連絡手段"><span>鍵・連絡手段</span></label><label><input type="checkbox" name="checks" value="ライト・反射材"><span>ライト・反射材</span></label><label><input type="checkbox" name="checks" value="必要な装備"><span>必要な装備</span></label></fieldset>
              <label class="mobile-tool-field"><span>メモ</span><textarea name="note" rows="3" maxlength="160" placeholder="例：折り返し地点で給水する"></textarea></label>
              <p class="mobile-tool-form-status" data-mobile-tool-form-status aria-live="polite"></p>
              <button type="submit" class="primary mobile-tool-save">確認内容を保存</button>
            </form>`;
            return renderShell({ tool: "departure", eyebrow: "SMARTPHONE TOOL", title: "出発チェック", description: "持ち物や準備を確認して、その時点の内容を残します。", form, historyTitle: "最近の出発チェック", history: renderDepartureHistory(state.departureChecks) });
          }

          export function renderFuelNoteScreen() {
            const state = loadMobileQuickTools();
            const form = `<form class="mobile-tool-card" data-mobile-tool-form="fuel">
              <div class="mobile-tool-card__lead"><div><small>補給</small><strong>水分・補給・休憩をその時刻で残す</strong></div></div>
              <fieldset class="mobile-tool-choice"><legend>種類</legend><label><input type="radio" name="kind" value="水分" checked><span>水分</span></label><label><input type="radio" name="kind" value="補給"><span>補給</span></label><label><input type="radio" name="kind" value="休憩"><span>休憩</span></label><label><input type="radio" name="kind" value="その他"><span>その他</span></label></fieldset>
              <label class="mobile-tool-field"><span>量・内容</span><input type="text" name="amount" maxlength="80" placeholder="例：水を数口"></label>
              <label class="mobile-tool-field"><span>メモ</span><textarea name="note" rows="3" maxlength="160" placeholder="例：折り返し地点で補給"></textarea></label>
              <p class="mobile-tool-form-status" data-mobile-tool-form-status aria-live="polite"></p>
              <button type="submit" class="primary mobile-tool-save">補給メモを保存</button>
            </form>`;
            return renderShell({ tool: "fuel", eyebrow: "SMARTPHONE TOOL", title: "補給メモ", description: "水分、補給、休憩を時刻付きで短く残します。", form, historyTitle: "最近の補給メモ", history: renderFuelHistory(state.fuelNotes) });
          }
          '''
          p = Path(path)
          p.write_text(p.read_text(encoding='utf-8').rstrip() + append + '\n', encoding='utf-8')

          path = 'ui/interactions/mobileQuickToolsInteractions.js'
          replace_once(path,
          '''export function bindMobileQuickTool(context = {}) {
          ''',
          '''function saveDeparture(form, root) {
            const data = new FormData(form);
            const checks = data.getAll("checks").map((value) => String(value || "").trim()).filter(Boolean);
            const note = String(data.get("note") || "").trim();
            if (!checks.length && !note) {
              setFormStatus(root, "確認項目を選ぶか、メモを入力してください。", "error");
              return false;
            }
            if (!addMobileQuickToolEntry("departure", { checks, note })) {
              setFormStatus(root, "保存できませんでした。端末の保存領域を確認してください。", "error");
              return false;
            }
            return true;
          }

          function saveFuel(form, root) {
            const values = formValues(form);
            const payload = { kind: String(values.kind || "水分").trim(), amount: String(values.amount || "").trim(), note: String(values.note || "").trim() };
            if (!payload.amount && !payload.note) {
              setFormStatus(root, "量・内容またはメモを入力してください。", "error");
              return false;
            }
            if (!addMobileQuickToolEntry("fuel", payload)) {
              setFormStatus(root, "保存できませんでした。端末の保存領域を確認してください。", "error");
              return false;
            }
            return true;
          }

          export function bindMobileQuickTool(context = {}) {
          ''')
          replace_once(path,
          '''        : tool === "gear"
                  ? saveGear(form, root)
                  : false;
          ''',
          '''        : tool === "gear"
                  ? saveGear(form, root)
                  : tool === "departure"
                    ? saveDeparture(form, root)
                    : tool === "fuel"
                      ? saveFuel(form, root)
                      : false;
          ''')

          path = 'app.js'
          replace_once(path,
          '''import { renderLocationNoteScreen, renderQuickNoteScreen, renderGearNoteScreen } from "./screens/mobileQuickToolsScreen.js";
          ''',
          '''import { renderLocationNoteScreen, renderQuickNoteScreen, renderGearNoteScreen, renderDepartureCheckScreen, renderFuelNoteScreen } from "./screens/mobileQuickToolsScreen.js";
          ''')
          replace_once(path,
          '''  "gear-note": renderGearNoteScreen,
          };
          ''',
          '''  "gear-note": renderGearNoteScreen,
            "departure-check": renderDepartureCheckScreen,
            "fuel-note": renderFuelNoteScreen,
          };
          ''')
          replace_once(path,
          '''["plan", "consultation", "support-guidance", "reading", "privacy", "settings", "location-note", "quick-note", "gear-note"]''',
          '''["plan", "consultation", "support-guidance", "reading", "privacy", "settings", "location-note", "quick-note", "gear-note", "departure-check", "fuel-note"]''')

          path = 'ui/screenInteractions.js'
          replace_once(path,
          '''  "gear-note": bindMobileQuickTool,
          });
          ''',
          '''  "gear-note": bindMobileQuickTool,
            "departure-check": bindMobileQuickTool,
            "fuel-note": bindMobileQuickTool,
          });
          ''')
          path = 'ui/screenArchitecture.js'
          replace_once(path,
          '''  if (screen === "gear-note") return { title: "装備メモ", backHref: "#/home", backLabel: "ホーム" };

            if (screen === "plan") {
          ''',
          '''  if (screen === "gear-note") return { title: "装備メモ", backHref: "#/home", backLabel: "ホーム" };
            if (screen === "departure-check") return { title: "出発チェック", backHref: "#/home", backLabel: "ホーム" };
            if (screen === "fuel-note") return { title: "補給メモ", backHref: "#/home", backLabel: "ホーム" };

            if (screen === "plan") {
          ''')

          path = 'styles/mobile-home.css'
          replace_once(path,
          '''  .mobile-home-app__icon svg,
            .mobile-home-dock__icon svg {
          ''',
          '''  .mobile-home-emoji {
              display: block;
              font-size: 30px;
              line-height: 1;
              font-family: system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            }

            .mobile-home-app__icon svg,
            .mobile-home-dock__icon svg {
          ''')
          path = 'styles/mobile-home-editing.css'
          replace_once(path,
          '''  .mobile-home-widget-picker__option--app > b {
              grid-column: 3;
              grid-row: 1;
            }

            .mobile-home-widget-picker__option--widget {
          ''',
          '''  .mobile-home-widget-picker__option--widget {
          ''')
          replace_once(path,
          '''  .mobile-home-widget-picker__option b {
              grid-column: 2;
              grid-row: 1 / 3;
              align-self: center;
              display: grid;
              place-items: center;
              width: 34px;
              height: 34px;
              border-radius: 50%;
              background: var(--color-accent-strong);
              color: var(--color-on-accent);
              font-size: 20px;
            }
          ''',
          '''  .mobile-home-widget-picker__option b {
              grid-column: 2;
              grid-row: 1 / 3;
              align-self: center;
              justify-self: end;
              display: grid;
              place-items: center;
              width: 34px;
              height: 34px;
              border-radius: 50%;
              background: var(--color-accent-strong);
              color: var(--color-on-accent);
              font-size: 20px;
            }

            .mobile-home-widget-picker__option.mobile-home-widget-picker__option--app > b {
              grid-column: 3;
              grid-row: 1;
              align-self: center;
              justify-self: end;
            }

            .mobile-home-widget-picker__app-icon .mobile-home-emoji {
              font-size: 25px;
            }
          ''')
          path = 'styles/mobile-quick-tools.css'
          replace_once(path,
          '''  .mobile-tool-choice legend {
              grid-column: 1 / -1;
              margin-bottom: 1px;
            }
          ''',
          '''  .mobile-tool-choice legend {
              grid-column: 1 / -1;
              margin-bottom: 1px;
            }

            .mobile-tool-choice--checklist {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          ''')

          path = 'tests/mobileQuickTools.test.mjs'
          replace_once(path,
          '''  assert.ok(home.includes('href: "#/gear-note"'));
          ''',
          '''  assert.ok(home.includes('href: "#/gear-note"'));
            assert.ok(home.includes('href: "#/departure-check"'));
            assert.ok(home.includes('href: "#/fuel-note"'));
            assert.ok(home.includes('emoji: "📍"'));
            assert.ok(home.includes('emoji: "📝"'));
            assert.ok(home.includes('emoji: "🎒"'));
            assert.ok(home.includes('emoji: "✅"'));
            assert.ok(home.includes('emoji: "💧"'));
          ''')
          replace_once(path,
          '''  for (const route of ['location-note', 'quick-note', 'gear-note']) {
          ''',
          '''  for (const route of ['location-note', 'quick-note', 'gear-note', 'departure-check', 'fuel-note']) {
          ''')
          replace_once(path,
          '''  assert.ok(screens.includes('export function renderGearNoteScreen'));
          ''',
          '''  assert.ok(screens.includes('export function renderGearNoteScreen'));
            assert.ok(screens.includes('export function renderDepartureCheckScreen'));
            assert.ok(screens.includes('export function renderFuelNoteScreen'));
          ''')
          replace_once(path,
          '''  assert.ok(css.includes('.mobile-home-widget-picker__option--app'));
          });
          ''',
          '''  assert.ok(css.includes('.mobile-home-widget-picker__option--app'));
            assert.ok(css.includes('.mobile-home-widget-picker__option.mobile-home-widget-picker__option--app > b'));
            assert.ok(read('styles/mobile-home.css').includes('.mobile-home-emoji'));
          });
          ''')
          PY
          python3 /tmp/expand_tools.py
          git rm .github/workflows/mobile-quick-tools-expand-temp.yml
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Validate diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'emoji: "✅"' screens/homeScreen.js
          grep -q 'emoji: "💧"' screens/homeScreen.js
          grep -q 'renderDepartureCheckScreen' screens/mobileQuickToolsScreen.js
          grep -q 'renderFuelNoteScreen' screens/mobileQuickToolsScreen.js
          grep -q 'mobile-home-widget-picker__option.mobile-home-widget-picker__option--app > b' styles/mobile-home-editing.css
          test ! -e .github/workflows/mobile-quick-tools-expand-temp.yml
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align home add controls and add two mobile tools"
          git push
