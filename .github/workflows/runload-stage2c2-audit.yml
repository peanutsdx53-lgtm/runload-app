name: RunLoad Stage 2C2 current catalog usage audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2c2-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "50bf9eea94e989f530b7ffd0f59dfdeeb7fbe532"

      - name: Map current uses of formal input catalog exports
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SURFACE_PRESETS definition ==='
          grep -n 'const SURFACE_PRESETS' core/internal/primaryInputCatalog.js || true
          echo '=== formalInputCatalog member reads outside catalog ==='
          grep -R -n -E 'internalModules\.formalInputCatalog|formalInputCatalog\[' core app.js screens ui tests \
            --exclude='primaryInputCatalog.js' --exclude-dir=.git || true
          echo '=== exported catalog symbols referenced outside catalog ==='
          for symbol in AUTHORITY_VERSION PARAMETER_SET_VERSION ADAPTER_VERSION REGIONS FORMAL_INPUT_CATALOG PARAMETERS PARAMETER_BOUNDS SOURCE_CURVES SURFACE_CURVES ARCH_SURFACE_CURVES PFA_CURVE GASTRO_GRADE_CURVE GLUTE_GRADE_CURVE GRADE_SPEED_PROFILE UNEVENNESS_UPPER_BOUND_CURVES SURFACE_PRESETS ORACLE_EXPECTED ORACLE_STATUS; do
            hits=$(grep -R -n -E "\\b${symbol}\\b" core app.js screens ui tests \
              --exclude='primaryInputCatalog.js' --exclude-dir=.git || true)
            if [ -n "$hits" ]; then
              echo "--- $symbol ---"
              printf '%s\n' "$hits"
            fi
          done
          echo '=== current module block markers in primaryInputProcessing ==='
          grep -n '^// =====' core/internal/primaryInputProcessing.js
