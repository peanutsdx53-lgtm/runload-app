name: RunLoad Stage 2B3a gated current dependency switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2b3a.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "48f26236e63016858c36e35a35b26b5bb3b769f4"

      - name: Switch current code away from legacy V27 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # Import-chain cleanup: make each current module declare its real current dependencies.
          replace_once('core/internal/primaryModelEngine.js', 'import "./modelV27.js";', 'import "./modelSupport.js";')
          replace_once('core/internal/primaryModelResults.js', 'import "./primaryInputProcessing.js";', 'import "./primaryInputProcessing.js";\nimport "./recordRepositories.js";')
          replace_once('core/internal/courseRepository.js', 'import "./v27ApplicationModel.js";', 'import "./recordRepositories.js";')
          replace_once('core/internal/recordWorkflow.js', 'import "./v27ApplicationServices.js";', 'import "./applicationDomain.js";')

          # Promote the grade limits actually used by the current 12-region engine to named current constants.
          replace_once(
              'core/internal/primaryModelEngine.js',
              "const VERIFIED_PROVENANCE=new Set(['VIDEO_VERIFIED','DEVICE_VERIFIED','INSTRUMENT_VERIFIED','LAB_VERIFIED']);",
              "const VERIFIED_PROVENANCE=new Set(['VIDEO_VERIFIED','DEVICE_VERIFIED','INSTRUMENT_VERIFIED','LAB_VERIFIED']);\nconst PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES=6;\nconst PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT=Math.tan(PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES*Math.PI/180)*100;\nconst PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT=15;",
          )
          replace_once(
              'core/internal/primaryModelEngine.js',
              "if(regionId==='R05'&&near(v,2.78,1e-6)&&Math.abs(gd)<=6+1e-12){",
              "if(regionId==='R05'&&near(v,2.78,1e-6)&&Math.abs(gd)<=PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES+1e-12){",
          )
          replace_once(
              'core/internal/primaryModelEngine.js',
              "} else if((regionId==='R06'||regionId==='R09')&&near(v,2.78,1e-6)&&Math.abs(gd)<=6+1e-12){",
              "} else if((regionId==='R06'||regionId==='R09')&&near(v,2.78,1e-6)&&Math.abs(gd)<=PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES+1e-12){",
          )
          replace_once(
              'core/internal/primaryModelEngine.js',
              "} else if(regionId==='R10'&&near(v,2.0,1e-6)&&gp>=0&&gp<=15+1e-12){",
              "} else if(regionId==='R10'&&near(v,2.0,1e-6)&&gp>=0&&gp<=PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT+1e-12){",
          )
          replace_once(
              'core/internal/primaryModelEngine.js',
              'moduleExports["R12_GRASS_ENVELOPE"] = R12_GRASS_ENVELOPE;',
              'moduleExports["R12_GRASS_ENVELOPE"] = R12_GRASS_ENVELOPE;\nmoduleExports["PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES"] = PRIMARY_REGIONAL_GRADE_DIRECT_MAX_ABS_DEGREES;\nmoduleExports["PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT"] = PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT;\nmoduleExports["PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT"] = PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT;',
          )

          # Public current API: expose current mapping/limits and remove legacy V27 exports.
          replace_once(
              'core/appCore.js',
              'export const BODY_AREA_BY_ID = internalModules.bodyAreaTaxonomy["BODY_AREA_BY_ID"];',
              'export const BODY_AREA_BY_ID = internalModules.bodyAreaTaxonomy["BODY_AREA_BY_ID"];\nexport const BODY_AREA_TO_PRIMARY_REGIONAL_V2 = internalModules.primaryRegionalInputAdapter["BODY_AREA_TO_PRIMARY_REGIONAL_V2"];',
          )
          replace_once(
              'core/appCore.js',
              'export const PRIMARY_REGIONAL_V2_REGION_DEFS = internalModules.primaryRegionalRegionDefinitions["PRIMARY_REGIONAL_V2_REGION_DEFS"];',
              'export const PRIMARY_REGIONAL_V2_REGION_DEFS = internalModules.primaryRegionalRegionDefinitions["PRIMARY_REGIONAL_V2_REGION_DEFS"];\nexport const PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT = internalModules.primaryRegionalEngine["PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT"];\nexport const PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT = internalModules.primaryRegionalEngine["PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT"];',
          )
          old_exports = '''export const V27_COMMON_REGIONAL_GRADE_INPUT_MAX_PERCENT = internalModules.legacyLoadModelConstants["V27_COMMON_REGIONAL_GRADE_INPUT_MAX_PERCENT"];
          export const V27_EMPHASIS_REGION_IDS = internalModules.legacyLoadModelConstants["V27_EMPHASIS_REGION_IDS"];
          export const V27_REGIONS = internalModules.legacyLoadModelConstants["V27_REGIONS"];
          export const V27_TOTAL_GRADE_DOMAIN_MAX_PERCENT = internalModules.legacyLoadModelConstants["V27_TOTAL_GRADE_DOMAIN_MAX_PERCENT"];
          '''.replace('          ', '')
          replace_once('core/appCore.js', old_exports, '')

          # Reading recommendations: use the current 12-region body-area mapping, not the old eight-region V27 map.
          replace_once(
              'screens/readingScreen.js',
              'import { V27_EMPHASIS_REGION_IDS, V27_REGIONS, BODY_AREA_BY_ID } from "../core/appCore.js";\n\nconst REGION_BY_ID = new Map(V27_REGIONS.map((region) => [region.id, region]));',
              'import { BODY_AREA_BY_ID, BODY_AREA_TO_PRIMARY_REGIONAL_V2, PRIMARY_REGIONAL_V2_REGION_DEFS } from "../core/appCore.js";\n\nconst REGION_BY_ID = new Map(PRIMARY_REGIONAL_V2_REGION_DEFS.map((region) => [region.displayId, region]));\nconst SLOPE_DIRECT_REGION_IDS = new Set(PRIMARY_REGIONAL_V2_REGION_DEFS\n  .filter((region) => ["R05", "R06", "R09", "R10"].includes(region.id))\n  .map((region) => region.displayId));',
          )
          replace_once(
              'screens/readingScreen.js',
              '  const observation = bodyAreaObservations(experience?.feedback || {})\n    .find((item) => BODY_AREA_BY_ID[item.areaId]?.modelRegionId);\n  return BODY_AREA_BY_ID[observation?.areaId]?.modelRegionId || "";',
              '  const observation = bodyAreaObservations(experience?.feedback || {})\n    .find((item) => BODY_AREA_TO_PRIMARY_REGIONAL_V2[item?.areaId]);\n  return BODY_AREA_TO_PRIMARY_REGIONAL_V2[observation?.areaId] || "";',
          )
          replace_once(
              'screens/readingScreen.js',
              '  if (selectedRegionId && V27_EMPHASIS_REGION_IDS.includes(selectedRegionId)) {\n    return recommendation("slope-endpoints", `${REGION_BY_ID.get(selectedRegionId)?.label || selectedRegionId}の数字がどう動くかを、坂との関係から確認できます。`);\n  }',
              '  if (selectedRegionId && SLOPE_DIRECT_REGION_IDS.has(selectedRegionId)) {\n    return recommendation("slope-endpoints", `${REGION_BY_ID.get(selectedRegionId)?.name || selectedRegionId}の数字がどう動くかを、坂との関係から確認できます。`);\n  }',
          )

          # Grade confirmation: read the limits from the current primary engine.
          replace_once(
              'ui/interactions/gradeDomainConfirmation.js',
              'import {\n  V27_COMMON_REGIONAL_GRADE_INPUT_MAX_PERCENT,\n  V27_TOTAL_GRADE_DOMAIN_MAX_PERCENT,\n} from "../../core/appCore.js";',
              'import {\n  PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT,\n  PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT,\n} from "../../core/appCore.js";',
          )
          replace_once(
              'ui/interactions/gradeDomainConfirmation.js',
              '  if (maximum > V27_TOTAL_GRADE_DOMAIN_MAX_PERCENT) {\n    return `代表的な坂の傾きが${V27_TOTAL_GRADE_DOMAIN_MAX_PERCENT}%を超えています。',
              '  if (maximum > PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT) {\n    return `代表的な坂の傾きが${PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT}%を超えています。',
          )
          replace_once(
              'ui/interactions/gradeDomainConfirmation.js',
              '  if (maximum > V27_COMMON_REGIONAL_GRADE_INPUT_MAX_PERCENT + 1e-9) {',
              '  if (maximum > PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT + 1e-9) {',
          )

          # Regression guard for the current-only dependency chain.
          p = Path('tests/currentOnlyRecordSchema.test.mjs')
          s = p.read_text()
          anchor = "const planPreview = fs.readFileSync('core/internal/planPreview.js', 'utf8');\n"
          additions = """const appCore = fs.readFileSync('core/appCore.js', 'utf8');
          const primaryModelEngine = fs.readFileSync('core/internal/primaryModelEngine.js', 'utf8');
          const courseRepository = fs.readFileSync('core/internal/courseRepository.js', 'utf8');
          const recordWorkflow = fs.readFileSync('core/internal/recordWorkflow.js', 'utf8');
          const readingScreen = fs.readFileSync('screens/readingScreen.js', 'utf8');
          const gradeDomainConfirmation = fs.readFileSync('ui/interactions/gradeDomainConfirmation.js', 'utf8');
          """.replace('          ', '')
          if anchor not in s:
              raise SystemExit('test declaration anchor not found')
          s = s.replace(anchor, anchor + additions, 1)
          insert_before = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          new_test = """
          
          test('CURRENT-MODULE-CHAIN-NO-LONGER-DEPENDS-ON-V27', () => {
            assert.ok(!primaryModelEngine.includes('modelV27.js'));
            assert.ok(primaryResults.includes('recordRepositories.js'));
            assert.ok(!courseRepository.includes('v27ApplicationModel.js'));
            assert.ok(!recordWorkflow.includes('v27ApplicationServices.js'));
            assert.ok(!appCore.includes('legacyLoadModelConstants'));
            assert.ok(!appCore.includes('export const V27_'));
            assert.ok(!readingScreen.includes('V27_'));
            assert.ok(!gradeDomainConfirmation.includes('V27_'));
            assert.ok(appCore.includes('BODY_AREA_TO_PRIMARY_REGIONAL_V2'));
            assert.ok(primaryModelEngine.includes('PRIMARY_REGIONAL_GRADE_COMMON_DIRECT_MAX_ABS_PERCENT'));
            assert.ok(primaryModelEngine.includes('PRIMARY_REGIONAL_GRADE_UPHILL_DIRECT_MAX_PERCENT'));
          });
          """.replace('          ', '')
          if insert_before not in s:
              raise SystemExit('test insertion anchor not found')
          p.write_text(s.replace(insert_before, new_test + insert_before, 1))
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 164
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'core/appCore.js' \
            'core/internal/courseRepository.js' \
            'core/internal/primaryModelEngine.js' \
            'core/internal/primaryModelResults.js' \
            'core/internal/recordWorkflow.js' \
            'screens/readingScreen.js' \
            'tests/currentOnlyRecordSchema.test.mjs' \
            'ui/interactions/gradeDomainConfirmation.js' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 2B3a
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 2B3a: switch current modules off V27 dependencies'
          git push origin HEAD:main
