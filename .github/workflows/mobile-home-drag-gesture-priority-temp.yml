name: Mobile home drag gesture priority validation

on:
  push:
    branches:
      - fix/mobile-home-drag-gesture-priority-20260927
    paths:
      - .github/workflows/mobile-home-drag-gesture-priority-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .github/scripts/patch_mobile_home_drag_priority.py
      - name: Remove temporary files
        run: git rm .github/scripts/patch_mobile_home_drag_priority.py .github/workflows/mobile-home-drag-gesture-priority-temp.yml
      - name: JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'const TAP_SLOP_PX = 8;' ui/interactions/homeInteractions.js
          grep -q 'const VERTICAL_SCROLL_CANCEL_PX = 18;' ui/interactions/homeInteractions.js
          grep -q 'touch-action: pan-y;' styles/mobile-home-editing.css
          grep -q 'overflow-x: hidden;' styles/mobile-home-editing.css
          grep -q 'scroll-snap-type: none;' styles/mobile-home-editing.css
          grep -q 'let pressMoved = false;' ui/interactions/homeInteractions.js
          grep -q 'clientX: lastX' ui/interactions/homeInteractions.js
          test ! -e .github/scripts/patch_mobile_home_drag_priority.py
          test ! -e .github/workflows/mobile-home-drag-gesture-priority-temp.yml
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prioritize mobile home drag gestures"
          git push origin HEAD:fix/mobile-home-drag-gesture-priority-20260927
