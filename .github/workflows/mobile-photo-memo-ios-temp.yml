name: Mobile photo memo iOS storage display temporary validation

on:
  push:
    branches:
      - fix/mobile-photo-memo-ios-display-20260927
    paths:
      - .github/workflows/mobile-photo-memo-ios-temp.yml
      - .github/scripts/mobile_photo_memo_ios_patch.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python3 .github/scripts/mobile_photo_memo_ios_patch.py
      - name: JavaScript syntax
        run: find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Contract and diff
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          grep -q 'const imageBytes = await blob.arrayBuffer()' ui/mobilePhotoMemoStore.js
          grep -q 'reader.readAsDataURL(blob)' ui/interactions/mobilePhotoMemoInteractions.js
          grep -q 'entry?.imageBytes instanceof ArrayBuffer' ui/interactions/mobilePhotoMemoInteractions.js
          test ! -e .github/workflows/mobile-photo-memo-ios-temp.yml
          test ! -e .github/scripts/mobile_photo_memo_ios_patch.py
      - name: Commit validated fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden photo memo storage for iOS display"
          git push origin HEAD:fix/mobile-photo-memo-ios-display-20260927
