name: RunLoad Stage 3 gated smartphone fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage3-smartphone-fixes.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "047585df69a847acd6fed308741497a63464a94e"

      - name: Apply Stage 3 candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:160]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) Native mobile paging: a browser-owned cancel/scroll must never fall through to app launch.
          path = Path('ui/interactions/homeInteractions.js')
          s = path.read_text()
          s = s.replace(
          '''  normalizePlacement,\n  packTokens,\n  usedRowCount,\n''',
          '''  normalizePlacement,\n  placementIsFree,\n  usedRowCount,\n''', 1)
          old = '''function buildPositionLayoutFromDom(root) {\n  const widgetSizes = currentWidgetSizes(root);\n  return {\n    version: 1,\n    pages: pageElements(root).map((page) => {\n      const tokens = [...page.querySelectorAll("[data-home-item-id], [data-home-widget-id]")].map(gridTokenForElement).filter(Boolean);\n      return packTokens(tokens, { widgetSizes, occupiedTokens: visibleTokensForPage(page) });\n    }),\n  };\n}\n'''
          new = '''function buildPositionLayoutFromDom(root) {\n  const widgetSizes = currentWidgetSizes(root);\n  return {\n    version: 1,\n    pages: pageElements(root).map((page) => {\n      const occupiedTokens = visibleTokensForPage(page);\n      const placements = [];\n      const pending = [];\n      [...page.querySelectorAll("[data-home-item-id], [data-home-widget-id]")].forEach((element) => {\n        const token = gridTokenForElement(element);\n        if (!token) return;\n        const explicitRow = Number(element.dataset.homeRow);\n        const explicitCol = Number(element.dataset.homeCol);\n        const hasExplicitPlacement = Number.isInteger(explicitRow) && explicitRow > 0 && Number.isInteger(explicitCol) && explicitCol > 0;\n        if (!hasExplicitPlacement) {\n          pending.push(token);\n          return;\n        }\n        const footprint = footprintForToken(token, widgetSizes);\n        const explicit = normalizePlacement({ row: explicitRow, col: explicitCol }, footprint);\n        const exact = explicit.row === explicitRow && explicit.col === explicitCol;\n        const free = exact && placementIsFree(placements, token, explicit, { widgetSizes, occupiedTokens });\n        if (free) placements.push({ token, ...explicit });\n        else pending.push(token);\n      });\n      pending.forEach((token) => {\n        const free = findNearestFreePlacement(placements, token, { row: 1, col: 1 }, { widgetSizes, occupiedTokens });\n        if (free) placements.push({ token, ...free });\n      });\n      return placements;\n    }),\n  };\n}\n'''
          if old not in s:
              raise SystemExit('buildPositionLayoutFromDom block not found')
          s = s.replace(old, new, 1)
          old = '''  function handlePointerCancel(event) {\n    if (event.pointerId !== pointerId) return;\n    cancelPressTimer();\n    if (dragging) {\n      finishDrag({ clientX: lastX, clientY: lastY });\n    } else {\n      clearPressState();\n      try { pressTarget?.releasePointerCapture(pointerId); } catch {}\n    }\n    pointerId = null;\n    pressTarget = null;\n    pressKind = "";\n    pressMoved = false;\n    dragArmed = false;\n  }\n'''
          new = '''  function handlePointerCancel(event) {\n    if (event.pointerId !== pointerId) return;\n    const cancelledNavigationGesture = Boolean(pressTarget) && !editing;\n    cancelPressTimer();\n    if (dragging) {\n      finishDrag({ clientX: lastX, clientY: lastY });\n    } else {\n      clearPressState();\n      try { pressTarget?.releasePointerCapture(pointerId); } catch {}\n    }\n    if (cancelledNavigationGesture) suppressClickUntil = Date.now() + 700;\n    pointerId = null;\n    pressTarget = null;\n    pressKind = "";\n    pressMoved = false;\n    dragArmed = false;\n  }\n'''
          if old not in s:
              raise SystemExit('handlePointerCancel block not found')
          s = s.replace(old, new, 1)
          old = '''      if (!viewport.clientWidth || dragging || dragArmed || pageSwipePointerId != null || pageAnimationFrame) return;\n      const index = Math.round(viewport.scrollLeft / viewport.clientWidth);\n'''
          new = '''      if (!viewport.clientWidth || dragging || dragArmed || pageSwipePointerId != null || pageAnimationFrame) return;\n      const expectedLeft = activePage * viewport.clientWidth;\n      if (!editing && Math.abs(viewport.scrollLeft - expectedLeft) > 4) suppressClickUntil = Date.now() + 700;\n      const index = Math.round(viewport.scrollLeft / viewport.clientWidth);\n'''
          if old not in s:
              raise SystemExit('handlePageScroll anchor not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # 2) Same-type icon swaps are atomic across both placement and ordered layout storage.
          path = Path('ui/mobileHomeDropCoordinator.js')
          s = path.read_text()
          s = s.replace(
          'const POSITION_STORAGE_KEY = "running-record-mobile-home-positions-v1";\n',
          'const POSITION_STORAGE_KEY = "running-record-mobile-home-positions-v1";\nconst LAYOUT_STORAGE_KEY = "running-record-mobile-home-layout-v1";\n', 1)
          old = '''function persistHomePositions(root) {\n  const pages = [...root.querySelectorAll(".mobile-home-page")].map((page) => [\n    ...page.querySelectorAll("[data-home-item-id], [data-home-widget-id]"),\n  ].flatMap((element) => {\n    const token = gridTokenForElement(element);\n    if (!token) return [];\n    return [{ token, ...placementOf(element) }];\n  }));\n  try {\n    globalThis.localStorage?.setItem(POSITION_STORAGE_KEY, JSON.stringify({ version: 1, pages }));\n  } catch {\n    // Position persistence is optional; the current layout remains usable.\n  }\n}\n'''
          new = '''function activePageIndex(root, pageCount) {\n  const currentDot = root.querySelector('.mobile-home-page-dot[aria-current="page"]');\n  const explicit = Number(currentDot?.dataset?.homePageTarget);\n  if (Number.isInteger(explicit) && explicit >= 0) return Math.min(Math.max(0, pageCount - 1), explicit);\n  try {\n    const stored = JSON.parse(globalThis.localStorage?.getItem(LAYOUT_STORAGE_KEY) || "null");\n    const index = Number(stored?.activePage);\n    if (Number.isInteger(index) && index >= 0) return Math.min(Math.max(0, pageCount - 1), index);\n  } catch {\n    // Fall back to the first page when stored state is unavailable.\n  }\n  return 0;\n}\n\nfunction persistHomePositions(root) {\n  const pageElements = [...root.querySelectorAll(".mobile-home-page")];\n  const positionPages = pageElements.map((page) => [\n    ...page.querySelectorAll("[data-home-item-id], [data-home-widget-id]"),\n  ].flatMap((element) => {\n    const token = gridTokenForElement(element);\n    if (!token) return [];\n    return [{ token, ...placementOf(element) }];\n  }));\n  const layoutPages = pageElements.map((page) => [\n    ...page.querySelectorAll("[data-home-item-id], [data-home-widget-id]"),\n  ].map(gridTokenForElement).filter(Boolean));\n  const dock = [...root.querySelectorAll(".mobile-home-dock [data-home-item-id]")]\n    .map((item) => item.dataset.homeItemId)\n    .filter(Boolean);\n  try {\n    globalThis.localStorage?.setItem(POSITION_STORAGE_KEY, JSON.stringify({ version: 1, pages: positionPages }));\n    globalThis.localStorage?.setItem(LAYOUT_STORAGE_KEY, JSON.stringify({\n      version: 3,\n      pages: layoutPages.length ? layoutPages : [[]],\n      dock,\n      activePage: activePageIndex(root, pageElements.length),\n    }));\n  } catch {\n    // Persistence is optional; the current layout remains usable.\n  }\n}\n'''
          if old not in s:
              raise SystemExit('persistHomePositions block not found')
          path.write_text(s.replace(old, new, 1))

          # 3) Regression guards for the three reported smartphone problems.
          path = Path('tests/mobileHomeGesturePriority.test.mjs')
          s = path.read_text()
          anchor = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          test = '''\n\nawait test('HOME-NATIVE-PAGING-CANCEL-OR-SCROLL-CANNOT-LAUNCH-AN-APP', () => {\n  assert.ok(interactions.includes('const cancelledNavigationGesture = Boolean(pressTarget) && !editing;'));\n  assert.ok(interactions.includes('if (cancelledNavigationGesture) suppressClickUntil = Date.now() + 700;'));\n  assert.ok(interactions.includes('const expectedLeft = activePage * viewport.clientWidth;'));\n  assert.ok(interactions.includes('Math.abs(viewport.scrollLeft - expectedLeft) > 4'));\n});\n'''
          if anchor not in s:
              raise SystemExit('mobile gesture test anchor not found')
          path.write_text(s.replace(anchor, test + anchor, 1))

          path = Path('tests/mobileHomeAtomicDropCoordinator.test.mjs')
          s = path.read_text()
          anchor = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          test = '''\n\ntest('ATOMIC-SWAP-PERSISTS-ORDER-AND-PLACEMENT-TOGETHER', () => {\n  assert.ok(coordinator.includes('const LAYOUT_STORAGE_KEY = "running-record-mobile-home-layout-v1";'));\n  assert.ok(coordinator.includes('const layoutPages = pageElements.map'));\n  assert.ok(coordinator.includes('globalThis.localStorage?.setItem(POSITION_STORAGE_KEY'));\n  assert.ok(coordinator.includes('globalThis.localStorage?.setItem(LAYOUT_STORAGE_KEY'));\n  assert.ok(coordinator.includes('activePage: activePageIndex(root, pageElements.length)'));\n});\n'''
          if anchor not in s:
              raise SystemExit('atomic coordinator test anchor not found')
          path.write_text(s.replace(anchor, test + anchor, 1))

          path = Path('tests/mobileHomeInitialLayout.test.mjs')
          s = path.read_text()
          anchor = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          test = '''\n\ntest('POSITION-FALLBACK-PRESERVES-EXPLICIT-SLOTS-BEFORE-FILLING-MISSING-ONES', () => {\n  const start = home.indexOf('function buildPositionLayoutFromDom');\n  const end = home.indexOf('function readPositionLayout', start);\n  const block = home.slice(start, end);\n  assert.ok(block.includes('const explicitRow = Number(element.dataset.homeRow);'));\n  assert.ok(block.includes('const explicitCol = Number(element.dataset.homeCol);'));\n  assert.ok(block.includes('placementIsFree(placements, token, explicit'));\n  assert.ok(block.includes('pending.forEach((token) =>'));\n  assert.equal(block.includes('packTokens('), false);\n});\n'''
          if anchor not in s:
              raise SystemExit('initial layout test anchor not found')
          path.write_text(s.replace(anchor, test + anchor, 1))

          path = Path('tests/interpretationPresentation.test.mjs')
          s = path.read_text()
          anchor = "\nawait test('SUPPORT-STATE-TAKES-PRECEDENCE'"
          test = '''\nawait test('OVERVIEW-WITH-NO-ATTENTION-STILL-HAS-A-CONSISTENT-ANSWER',()=>{\n  const out=baseOutput();\n  out.overview.attention={\n    counts:{total:12,available:12,unavailable:0,previousComparable:0,previousChanged:0,repeated:0,above:0,near:12,below:0,conditionDifferences:0},\n    groups:[],\n    noCrossRegionRanking:true,\n  };\n  out.conditions={...out.conditions,differences:[]};\n  out.subjectiveContext={state:'NONE',pre:{available:false},post:{available:false},difference:{eligible:false},recentReferences:{},boundaryTokens:[]};\n  const html=renderInterpretationRoom({output:out});\n  assert.match(html,/今回の記録を、次回比較の基準点として使えます/);\n  assert.match(html,/interpretation-room--dashboard/);\n  assert.doesNotMatch(html,/対象の保存記録がありません/);\n});\n\n'''
          if anchor not in s:
              raise SystemExit('interpretation presentation test anchor not found')
          path.write_text(s.replace(anchor, '\n' + test + "await test('SUPPORT-STATE-TAKES-PRECEDENCE'", 1))

          # 4) Bump PWA version so mobile clients cannot keep the pre-fix cached modules.
          old_version = '2026.09.29.3'
          new_version = '2026.09.29.4'
          expected_test_version_files = {\n              'tests/mobileHomeAtomicDropCoordinator.test.mjs',\n              'tests/mobileHomeInitialLayout.test.mjs',\n              'tests/mobileHomeIosScrollCapacity.test.mjs',\n          }
          actual_test_version_files = {str(p) for p in Path('tests').glob('*.mjs') if old_version in p.read_text()}
          if actual_test_version_files != expected_test_version_files:
              raise SystemExit(f'unexpected version-test files: {sorted(actual_test_version_files)}')
          for file in [Path('ui/appVersionStatus.js'), Path('service-worker.js'), *[Path(p) for p in sorted(actual_test_version_files)]]:
              text = file.read_text()
              if old_version not in text:
                  raise SystemExit(f'old version missing from {file}')
              file.write_text(text.replace(old_version, new_version))
          PY

      - name: Verify exact candidate change set
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          service-worker.js
          tests/interpretationPresentation.test.mjs
          tests/mobileHomeAtomicDropCoordinator.test.mjs
          tests/mobileHomeGesturePriority.test.mjs
          tests/mobileHomeInitialLayout.test.mjs
          tests/mobileHomeIosScrollCapacity.test.mjs
          ui/appVersionStatus.js
          ui/interactions/homeInteractions.js
          ui/mobileHomeDropCoordinator.js
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for file in "${files[@]}"; do
            node --check "$file" >/dev/null
          done
          echo "JS syntax OK: ${#files[@]} files"

      - name: Verify Stage 3 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cancelledNavigationGesture' ui/interactions/homeInteractions.js
          grep -q 'placementIsFree(placements, token, explicit' ui/interactions/homeInteractions.js
          ! grep -A40 'function buildPositionLayoutFromDom' ui/interactions/homeInteractions.js | grep -q 'packTokens('
          grep -q 'LAYOUT_STORAGE_KEY' ui/mobileHomeDropCoordinator.js
          grep -q 'setItem(LAYOUT_STORAGE_KEY' ui/mobileHomeDropCoordinator.js
          grep -q 'APP_VERSION = "2026.09.29.4"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.4' service-worker.js

      - name: Commit verified Stage 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-worker.js tests/interpretationPresentation.test.mjs tests/mobileHomeAtomicDropCoordinator.test.mjs tests/mobileHomeGesturePriority.test.mjs tests/mobileHomeInitialLayout.test.mjs tests/mobileHomeIosScrollCapacity.test.mjs ui/appVersionStatus.js ui/interactions/homeInteractions.js ui/mobileHomeDropCoordinator.js
          git commit -m 'Stage 3: harden smartphone swipe and home placement'
          git push origin HEAD:main
