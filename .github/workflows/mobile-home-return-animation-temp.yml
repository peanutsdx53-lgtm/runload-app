name: Mobile home return animation temporary validation

on:
  push:
    branches:
      - feature/mobile-home-return-animation-20260927
    paths:
      - .github/workflows/mobile-home-return-animation-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: python3 .github/scripts/patch_mobile_home_return.py
      - name: Remove temporary files
        run: git rm .github/scripts/patch_mobile_home_return.py .github/workflows/mobile-home-return-animation-temp.yml
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Focused contracts
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'rememberMobileHomeLaunch' ui/interactions/homeInteractions.js
          grep -q 'bindMobileHomeReturnTransitions' ui/shellInteractions.js
          grep -q 'notifyMobileScreenRendered(screenName)' app.js
          grep -q './ui/mobileHomeReturnTransition.js' service-worker.js
          grep -q 'mobile-home-ios-return-old' styles/mobile-home.css
          grep -q 'mobile-home-return-fallback-close' styles/mobile-home.css
          test ! -e .github/scripts/patch_mobile_home_return.py
          test ! -e .github/workflows/mobile-home-return-animation-temp.yml
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reverse animation when returning home"
          git push origin HEAD:feature/mobile-home-return-animation-20260927
