name: Mobile navigation validation

on:
  push:
    branches:
      - mobile/navigation-home-return-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-navigation-validation.yml|screens/runMeasurementScreen.js|tests/deviceEntry.test.mjs|ui/interactions/runMeasurementInteractions.js)$' || true)"
          test -z "$unexpected"
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify GPS home return
        run: |
          set -euo pipefail
          grep -q 'href="#/home" class="run-measurement__back"' screens/runMeasurementScreen.js
          ! grep -q 'href="#/start" class="run-measurement__back"' screens/runMeasurementScreen.js
          grep -q 'navigateToScreen("home")' ui/interactions/runMeasurementInteractions.js
          ! grep -q 'navigateToScreen("start")' ui/interactions/runMeasurementInteractions.js
      - name: Verify PWA precache paths
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
