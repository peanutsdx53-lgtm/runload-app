name: RunLoad Stage 6 final comprehensive audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage6-final-comprehensive-audit.yml'

permissions:
  contents: read

jobs:
  final-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Stage 5 state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact Stage 5 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "11c0fe51a7beab5514e8f3a2dd3fd48b600a2608"

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check complete runtime JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find app.js core screens ui -type f -name '*.js' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          echo "Runtime JS syntax OK: ${#files[@]} files"

      - name: Exercise clean-start record calculation interpretation history and backup roundtrip
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            createApplicationServices,
            createMemoryStorage,
            PRIMARY_REGIONAL_V2_MODEL_VERSION,
          } from './core/appCore.js';
          import { renderHomeScreen } from './screens/homeScreen.js';
          import { renderResultScreen } from './screens/resultScreen.js';
          import { renderHistoryScreen } from './screens/historyScreen.js';
          import { renderInterpretationRoomScreen } from './screens/interpretationRoomScreen.js';

          const createRun = (date, distanceKm, durationMinutes, courseName) => ({
            date,
            activityType: 'run',
            distanceKm,
            durationMinutes,
            steps: Math.round(durationMinutes * 170),
            stepsProvenance: 'UNKNOWN',
            runningFormat: 'CONTINUOUS_RUN',
            course: {
              name: courseName,
              gradeKnowledge: 'KNOWN_FLAT',
              gradeInputMode: 'SUMMARY',
              upPercent: 0,
              downPercent: 0,
              upGradePercent: 0,
              downGradePercent: 0,
              surfaceInputMode: 'UNKNOWN',
              modelSurfaceClass: 'UNKNOWN',
              modelSurfaceProfile: [],
            },
            personalContext: null,
          });

          const storage = createMemoryStorage();
          const services = createApplicationServices({ storage });
          const emptyContext = { parameters: new URLSearchParams() };

          assert.equal(services.workflows.records.loadLatestExperience(), null);
          assert.match(renderHomeScreen({ services }), /data-home-state="first"/);
          assert.match(renderHistoryScreen({ services, context: emptyContext }), /保存した記録はまだありません/);
          assert.match(renderResultScreen({ services, context: emptyContext }), /保存した記録がまだありません/);
          assert.match(renderInterpretationRoomScreen({ services, context: emptyContext }), /対象の保存記録がありません/);

          const first = services.workflows.records.saveRecordAndFeedback(createRun('2026-09-28', 5, 30, '監査A'), {});
          assert.equal(first.ok, true, JSON.stringify(first));
          const second = services.workflows.records.saveRecordAndFeedback(createRun('2026-09-29', 6, 34, '監査B'), {});
          assert.equal(second.ok, true, JSON.stringify(second));

          const experiences = services.workflows.records.loadAllExperiences();
          assert.equal(experiences.length, 2);
          for (const experience of experiences) {
            const rr = experience.regionalV2ResultRecord;
            assert.equal(rr?.model_version, PRIMARY_REGIONAL_V2_MODEL_VERSION);
            assert.equal(rr?.result?.regions?.length, 12);
            assert.equal(rr?.body_map_payload?.regions?.length, 12);
            assert.ok(rr?.route_trace_version);
            for (const row of rr.result.regions) {
              assert.ok(Array.isArray(row.routeTrace));
              assert.ok(row.routeTrace.length > 0);
            }
          }

          const selectedId = second.record.id;
          const resultContext = { parameters: new URLSearchParams({ recordId: selectedId }) };
          const resultHtml = renderResultScreen({ services, context: resultContext });
          assert.match(resultHtml, /12部位/);
          assert.match(resultHtml, /基準100/);
          assert.match(resultHtml, /#\/interpretation-room\?recordId=/);

          const historyHtml = renderHistoryScreen({ services, context: emptyContext });
          assert.match(historyHtml, /保存記録/);
          assert.match(historyHtml, /監査B/);

          const interpretationContext = {
            parameters: new URLSearchParams({
              recordId: selectedId,
              origin: 'result',
              regionId: 'BA-DISP-014',
            }),
          };
          const interpretationHtml = renderInterpretationRoomScreen({ services, context: interpretationContext });
          assert.match(interpretationHtml, /基準100/);
          assert.match(interpretationHtml, /数値計算に使用|この部位の数値に使われた情報/);
          assert.doesNotMatch(interpretationHtml, /Reference-100|P1_SOURCE_MODEL_EXTENSION|P2_CROSS_SOURCE_BRIDGE|P2 bridge/);

          const backupText = services.storage.backup.exportBackupText();
          const restoredStorage = createMemoryStorage();
          const restored = createApplicationServices({ storage: restoredStorage });
          const inspection = restored.storage.backup.inspectBackupText(backupText);
          assert.equal(inspection.canRestore, true, JSON.stringify(inspection));
          const restoreResult = restored.storage.backup.restoreInspectedBackup(inspection, { acceptReview: true });
          assert.equal(restoreResult.ok, true, JSON.stringify(restoreResult));
          const restoredExperiences = restored.workflows.records.loadAllExperiences();
          assert.equal(restoredExperiences.length, 2);
          assert.equal(restoredExperiences.at(-1)?.regionalV2ResultRecord?.result?.regions?.length, 12);
          assert.ok(restoredExperiences.at(-1)?.regionalV2ResultRecord?.route_trace_version);

          console.log('clean start -> two records -> calculation -> result/history/interpretation -> backup/restore OK');
          NODE

      - name: Audit current-only storage calculation and module chain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/legacyCompatibility.js
          active_paths=(app.js core screens ui service-worker.js)
          if grep -R -n -i -E 'v27|v2\.7|modelResultsV27|model-results-v2\.7|createModelResultV27Repository|v27Application|modelV27\.js|Current 93-input trace|93-input|93項目|formalInputCatalog|FORMAL_INPUT_CATALOG|RL-IN-090|RL-IN-091|RL-IN-092' "${active_paths[@]}" --exclude-dir=.git; then
            echo 'Retired runtime residue found' >&2
            exit 1
          fi
          test ! -e core/internal/primaryInputCatalog.js
          test ! -e core/internal/modelV27.js
          test ! -e core/internal/v27ApplicationModel.js
          test ! -e core/internal/v27ApplicationServices.js
          grep -q 'PRE-RELEASE-BUILD-HAS-NO-STORED-DATA-COMPATIBILITY-SHIM' tests/currentOnlyRecordSchema.test.mjs
          grep -q 'NORMALIZER-NO-LONGER-READS-PRE-RELEASE-RECORD-ALIASES' tests/currentOnlyRecordSchema.test.mjs
          grep -q 'CURRENT-RUNTIME-NO-LONGER-STORES-OR-EXPOSES-V27-RESULTS' tests/currentOnlyRecordSchema.test.mjs

      - name: Audit 12-region and persisted-route calculation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PRIMARY_REGIONAL_V2_REGION_DEFS' core/internal/primaryModelResults.js
          grep -q 'rows.length!==12' core/internal/primaryModelResults.js
          grep -q 'item.body_map_payload.regions.length!==12' core/internal/primaryModelResults.js
          grep -q 'route_trace_version:PRIMARY_REGIONAL_V2_ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'appliedConditions' core/internal/primaryModelEngine.js
          grep -q 'notAppliedConditions' core/internal/primaryModelEngine.js
          grep -q 'PERSISTED_ROUTE_TRACE_REQUIRED' core/interpretationCore.js
          grep -q 'resolutionBasis: "PERSISTED_CALCULATION_TRACE"' core/interpretationCore.js
          grep -q 'activeRoute: "PERSISTED_ROUTE_TRACE"' core/interpretationCore.js
          ! grep -q 'SPEED_ONLY_PRIMARY_REGIONS' core/interpretationCore.js
          ! grep -q 'CONDITIONAL_PRIMARY_REGIONS' core/interpretationCore.js
          grep -q 'MISSING-PERSISTED-ROUTE-TRACE-IS-NOT-RECONSTRUCTED' tests/interpretationOutputContract.test.mjs
          grep -q 'PERSISTED-ROUTE-TRACE-IS-THE-INTERPRETATION-AUTHORITY' tests/interpretationArchitecture.test.mjs

      - name: Audit public wording and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'publicConstructText(evidence.construct)' ui/interpretationRoomPresentation.js
          grep -q 'publicSourceRoleText(source.role)' ui/interpretationRoomPresentation.js
          ! grep -q 'escapeHtml(evidence.construct)' ui/interpretationRoomPresentation.js
          ! grep -q 'escapeHtml(source.role)' ui/interpretationRoomPresentation.js
          ! grep -q 'Reference-100' screens/resultScreen.js
          ! grep -R -n -E 'P1_SOURCE_MODEL_EXTENSION|P2_CROSS_SOURCE_BRIDGE|P2 bridge' screens ui --exclude-dir=.git
          grep -q 'ADVANCED-COPY-TRANSLATES-RESEARCH-INTERNALS-BEFORE-DISPLAY' tests/interpretationPresentation.test.mjs
          grep -q 'NO_DIAGNOSIS' core/interpretationBase.js
          grep -q 'NO_CAUSAL_INFERENCE' core/interpretationBase.js

      - name: Audit AI independence CSP and remote executable boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          runtime=[Path('app.js'),Path('index.html'),Path('service-worker.js')]
          runtime += list(Path('core').rglob('*.js'))
          runtime += list(Path('screens').rglob('*.js'))
          runtime += list(Path('ui').rglob('*.js'))
          ai=re.compile(r'(?i)\b(openai|chatgpt|anthropic|claude|gemini|cohere|mistral|llama|llm)\b|large language model|generative ai')
          remote_exec=re.compile(r'(?i)(?:fetch|WebSocket|EventSource)\s*\(\s*[\'\"]https?://|XMLHttpRequest\s*\(')
          issues=[]
          for p in runtime:
              text=p.read_text(errors='ignore')
              if ai.search(text): issues.append(f'AI runtime token: {p}')
              if remote_exec.search(text): issues.append(f'remote executable/network literal: {p}')
          index=Path('index.html').read_text()
          required_csp=["default-src 'self'", "script-src 'self'", "object-src 'none'", "worker-src 'self'", "connect-src 'self'"]
          for token in required_csp:
              if token not in index: issues.append(f'CSP token missing: {token}')
          if re.search(r'<script[^>]+src=[\'\"]https?://',index,re.I): issues.append('remote script tag')
          if re.search(r'<link[^>]+rel=[\'\"]stylesheet[\'\"][^>]+href=[\'\"]https?://',index,re.I): issues.append('remote stylesheet')
          if issues: raise SystemExit('\n'.join(issues))
          print('AI independence / CSP / remote executable boundary OK')
          PY

      - name: Audit runtime module graph and PWA completeness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json

          runtime=[Path('app.js')]+list(Path('core').rglob('*.js'))+list(Path('screens').rglob('*.js'))+list(Path('ui').rglob('*.js'))
          import_re=re.compile(r'import\s+(?:[^;]*?\s+from\s+)?[\'\"]([^\'\"]+)[\'\"]\s*;',re.S)
          export_re=re.compile(r'export\s+[^;]*?\s+from\s+[\'\"]([^\'\"]+)[\'\"]\s*;',re.S)
          dynamic_re=re.compile(r'import\(\s*[\'\"]([^\'\"]+)[\'\"]\s*\)')
          missing=[]; external=[]
          for p in runtime:
              text=p.read_text(errors='ignore')
              for spec in import_re.findall(text)+export_re.findall(text)+dynamic_re.findall(text):
                  if not spec.startswith('.'):
                      external.append(f'{p}: {spec}')
                      continue
                  target=(p.parent/spec).resolve()
                  candidates=[target] if target.suffix else [target,Path(str(target)+'.js'),target/'index.js']
                  if not any(c.is_file() for c in candidates): missing.append(f'{p}: {spec}')
          if external: raise SystemExit('External/bare module imports:\n'+'\n'.join(external))
          if missing: raise SystemExit('Missing module targets:\n'+'\n'.join(missing))

          worker=Path('service-worker.js').read_text()
          block=re.search(r'const PRECACHE_URLS = \[(.*?)\];',worker,re.S)
          if not block: raise SystemExit('PRECACHE_URLS missing')
          urls=re.findall(r'[\'\"](\./[^\'\"]+)[\'\"]',block.group(1))
          if len(urls)!=len(set(urls)): raise SystemExit('duplicate PWA precache entries')
          cached=set(urls)
          absent=[u for u in urls if not Path(u[2:]).is_file()]
          if absent: raise SystemExit('precache points to missing files: '+repr(absent))
          required={'./app.js','./index.html','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png'}
          required.update('./'+p.as_posix() for p in Path('core').rglob('*.js'))
          required.update('./'+p.as_posix() for p in Path('screens').rglob('*.js'))
          required.update('./'+p.as_posix() for p in Path('ui').rglob('*.js'))
          index=Path('index.html').read_text()
          required.update(re.findall(r'(\./[^\'\"?#]+)',index))
          required={u for u in required if Path(u[2:]).is_file()}
          not_cached=sorted(required-cached)
          if not_cached: raise SystemExit('runtime files missing from PWA precache:\n'+'\n'.join(not_cached))

          manifest=json.loads(Path('manifest.webmanifest').read_text())
          if not manifest.get('name') or not manifest.get('start_url'): raise SystemExit('manifest identity/start_url missing')
          for icon in manifest.get('icons',[]):
              src=str(icon.get('src',''))
              if src.startswith('./') and not Path(src[2:]).is_file(): raise SystemExit(f'manifest icon missing: {src}')

          version=re.search(r'APP_VERSION = "([^"]+)"',Path('ui/appVersionStatus.js').read_text()).group(1)
          if f'running-record-app-runtime-{version}' not in worker: raise SystemExit('version/cache mismatch')
          print(f'Module graph + PWA OK: {len(runtime)} JS files, {len(cached)} precache entries')
          PY

      - name: Audit backup restore and storage format boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'runner-load-app-new-backup-v1' core/internal/backupService.js
          grep -q 'USER_DATA_STORAGE_KEYS' core/internal/backupService.js
          grep -q 'inspectBackupSnapshot' core/internal/backupService.js
          ! grep -q -i 'v27' core/internal/backupService.js
          ! grep -q -i 'v27' core/internal/restoreInspection.js
          grep -q 'CURRENT_APP_REMOVABLE_STORAGE_KEYS' core/internal/applicationServices.js
          grep -q 'runner-load-app-new-v1' core/internal/platformInfrastructure.js

      - name: Audit release identity and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION = "2026.09.29.6"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.6' service-worker.js
          test ! -d .github/scripts
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f | sort)
          test "${#workflow_files[@]}" -eq 1
          test "${workflow_files[0]}" = '.github/workflows/runload-stage6-final-comprehensive-audit.yml'

      - name: Confirm final audit is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
