# trigger-existing-workflow
name: Apply RunLoad Record UX Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runload-recordux-fix-20261006.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')

          p = root / 'ui/subjectivePresentation.js'
          s = p.read_text()
          anchor = '''const DETAILED_SUBJECTIVE_STATUSES = Object.freeze([\n  "discomfort_reported",\n  "strong_reported",\n]);\n\n'''
          insert = '''const DETAILED_SUBJECTIVE_STATUSES = Object.freeze([\n  "discomfort_reported",\n  "strong_reported",\n]);\n\nexport const BODY_OBSERVATION_INTENSITY_OPTIONS = Object.freeze([\n  Object.freeze({ value: 1, label: "ごく軽い" }),\n  Object.freeze({ value: 2, label: "軽い" }),\n  Object.freeze({ value: 3, label: "中程度" }),\n  Object.freeze({ value: 4, label: "強い" }),\n  Object.freeze({ value: 5, label: "とても強い" }),\n]);\n\nexport function bodyObservationIntensityLabel(value) {\n  const target = Number(value);\n  return BODY_OBSERVATION_INTENSITY_OPTIONS.find((item) => item.value === target)?.label || "";\n}\n\nexport function bodyObservationIntensityDisplay(value) {\n  const target = Number(value);\n  const label = bodyObservationIntensityLabel(target);\n  return label ? `${label}（${target} / 5）` : "";\n}\n\n'''
          if 'BODY_OBSERVATION_INTENSITY_OPTIONS' not in s:
              if anchor not in s: raise SystemExit('subjective presentation anchor missing')
              p.write_text(s.replace(anchor, insert, 1))

          p = root / 'ui/interactions/recordInputInteractions.js'
          s = p.read_text()
          s = s.replace('import { subjectiveSummaryFromFields } from "../subjectivePresentation.js";', 'import { BODY_OBSERVATION_INTENSITY_OPTIONS, subjectiveSummaryFromFields } from "../subjectivePresentation.js";')
          s = s.replace('function renderRecordSelectedBodyList(form) {', 'function renderRecordSelectedBodyList(form, platformEnhancement = {}) {', 1)
          old = '''return `<div class="record-selected-body-row selected-body-row" data-record-selected-row="${item.areaId}"><div class="selected-body-row-head"><strong>${item.label}</strong><button type="button" data-action="remove-record-body" aria-label="${item.label}を削除">×</button></div><div class="selected-body-controls"><label><span>程度</span><select data-record-selected-level>${[1,2,3,4,5].map((value) => `<option value="${value}"${score === value ? " selected" : ""}>${value}</option>`).join("")}</select></label><label><span>左右</span><select data-record-selected-side>${Object.values(BODY_AREA_LATERALITY).map((value) => `<option value="${value}"${side === value ? " selected" : ""}>${BODY_AREA_LATERALITY_LABELS[value]}</option>`).join("")}</select></label></div></div>`;'''
          new = '''return `<div class="record-selected-body-row selected-body-row" data-record-selected-row="${item.areaId}"><div class="selected-body-row-head"><strong>${item.label}</strong><button type="button" data-action="remove-record-body" aria-label="${item.label}を削除">×</button></div><div class="selected-body-controls"><label><span>程度（自分が感じた強さ）</span><select data-record-selected-level aria-label="${item.label}の程度">${BODY_OBSERVATION_INTENSITY_OPTIONS.map(({ value, label }) => `<option value="${value}"${score === value ? " selected" : ""}>${value} / 5　${label}</option>`).join("")}</select><small class="body-intensity-scale-note">1 ごく軽い → 5 とても強い</small></label><label><span>左右</span><select data-record-selected-side>${Object.values(BODY_AREA_LATERALITY).map((value) => `<option value="${value}"${side === value ? " selected" : ""}>${BODY_AREA_LATERALITY_LABELS[value]}</option>`).join("")}</select></label></div></div>`;'''
          if '程度（自分が感じた強さ）' not in s:
              if old not in s: raise SystemExit('body intensity template anchor missing')
              s = s.replace(old, new, 1)
          s = s.replace('function refreshRecordBodyUi(form) {', 'function refreshRecordBodyUi(form, platformEnhancement = {}) {', 1)
          s = s.replace('  renderRecordSelectedBodyList(form);', '  renderRecordSelectedBodyList(form, platformEnhancement);', 1)
          s = s.replace('function normalizeEmbeddedBodyStatus(form) {', 'function normalizeEmbeddedBodyStatus(form, platformEnhancement = {}) {', 1)
          norm_old = '''function normalizeEmbeddedBodyStatus(form, platformEnhancement = {}) {\n  const status = recordBodyStatus(form);\n  if (!["discomfort_reported", "strong_reported"].includes(status)) clearRecordBodyAreas(form);\n  if (status !== "strong_reported") clearRecordConsultationFacts(form);\n  refreshRecordBodyUi(form);\n}'''
          norm_new = norm_old.replace('refreshRecordBodyUi(form);', 'refreshRecordBodyUi(form, platformEnhancement);')
          s = s.replace(norm_old, norm_new, 1)
          s = s.replace('function bindEmbeddedRecordSubflows(form, services) {', 'function bindEmbeddedRecordSubflows(form, services, platformEnhancement = {}) {', 1)
          start = s.index('function bindEmbeddedRecordSubflows')
          pre, tail = s[:start], s[start:]
          tail = tail.replace('refreshRecordBodyUi(form);', 'refreshRecordBodyUi(form, platformEnhancement);')
          tail = tail.replace('normalizeEmbeddedBodyStatus(form);', 'normalizeEmbeddedBodyStatus(form, platformEnhancement);')
          s = pre + tail
          s = s.replace('  bindEmbeddedRecordSubflows(form, services);', '  bindEmbeddedRecordSubflows(form, services, platformEnhancement);', 1)
          start = s.index('function renderRecordSelectedBodyList')
          end = s.index('function refreshRecordBodyUi', start)
          block = s[start:end].replace('refreshRecordBodyUi(form);', 'refreshRecordBodyUi(form, platformEnhancement);')
          s = s[:start] + block + s[end:]
          p.write_text(s)

          p = root / 'ui/interpretationRoomPresentation.js'
          s = p.read_text()
          if 'bodyObservationIntensityDisplay' not in s:
              s = s.replace('import { formatLocalDate } from "./recordPresentation.js";\n', 'import { formatLocalDate } from "./recordPresentation.js";\nimport { bodyObservationIntensityDisplay } from "./subjectivePresentation.js";\n', 1)
          s = s.replace('<p>${escapeHtml(meta.timing)}${meta.intensity != null ? `・強さ ${escapeHtml(String(meta.intensity))} / 5` : ""}</p>', '<p>${escapeHtml(meta.timing)}${meta.intensity != null ? `・程度 ${escapeHtml(bodyObservationIntensityDisplay(meta.intensity))}` : ""}</p>', 1)
          s = s.replace('${escapeHtml(sensationLabel(observation.sensationType))}${Number.isFinite(Number(observation.intensity)) ? ` ${escapeHtml(String(Number(observation.intensity)))} / 5` : ""}', '${escapeHtml(sensationLabel(observation.sensationType))}${Number.isFinite(Number(observation.intensity)) ? `・${escapeHtml(bodyObservationIntensityDisplay(observation.intensity))}` : ""}', 1)
          p.write_text(s)

          p = root / 'styles/mobile-screen-layouts.css'
          s = p.read_text()
          if '.body-intensity-scale-note{' not in s:
              anchor = '''.screen-layout--record .selected-body-controls select:focus{\n  border-color:var(--accent);\n  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);\n}\n'''
              addition = anchor + '''\n.screen-layout--record .body-intensity-scale-note{\n  color:var(--muted);\n  font-size:var(--type-label);\n  line-height:1.35;\n}\n.screen-layout--record .sub-flow-save{\n  border:1px solid var(--accent);\n  background:var(--surface);\n  color:var(--accent2);\n  box-shadow:none;\n}\n.screen-layout--record .sub-flow-save:active{\n  background:var(--accent-soft);\n}\n'''
              if anchor not in s: raise SystemExit('mobile record css anchor missing')
              p.write_text(s.replace(anchor, addition, 1))

          p = root / 'tests/recordInputBaselineParity.test.mjs'
          s = p.read_text()
          if 'BODY_OBSERVATION_INTENSITY_OPTIONS' not in s:
              s = s.replace('import assert from "node:assert/strict";\n', 'import assert from "node:assert/strict";\nimport fs from "node:fs";\n', 1)
              s = s.replace('import { renderRecordInputScreen as renderMobileRecordInput } from "../screens/mobile/recordInputScreen.js";\n', 'import { renderRecordInputScreen as renderMobileRecordInput } from "../screens/mobile/recordInputScreen.js";\nimport { BODY_OBSERVATION_INTENSITY_OPTIONS, bodyObservationIntensityDisplay } from "../ui/subjectivePresentation.js";\n', 1)
              assertions = '''\n\nconst recordInteractionSource = fs.readFileSync(new URL("../ui/interactions/recordInputInteractions.js", import.meta.url), "utf8");\nconst mobileRecordCss = fs.readFileSync(new URL("../styles/mobile-screen-layouts.css", import.meta.url), "utf8");\nconst interpretationSource = fs.readFileSync(new URL("../ui/interpretationRoomPresentation.js", import.meta.url), "utf8");\n\nassert.match(recordInteractionSource, /function bindEmbeddedRecordSubflows\\(form, services, platformEnhancement = \\{\\}\\)/, "embedded subflow binder must receive platform enhancement");\nassert.match(recordInteractionSource, /bindEmbeddedRecordSubflows\\(form, services, platformEnhancement\\)/, "record binder must pass platform enhancement to embedded subflows");\nassert.doesNotMatch(recordInteractionSource, /\\[1,2,3,4,5\\]\\.map\\(\\(value\\)/, "body intensity options must not be bare numbers");\nassert.deepEqual(BODY_OBSERVATION_INTENSITY_OPTIONS.map((item) => item.label), ["ごく軽い", "軽い", "中程度", "強い", "とても強い"]);\nassert.equal(bodyObservationIntensityDisplay(2), "軽い（2 / 5）");\nassert.match(recordInteractionSource, /程度（自分が感じた強さ）/);\nassert.match(recordInteractionSource, /1 ごく軽い → 5 とても強い/);\nassert.match(interpretationSource, /bodyObservationIntensityDisplay\\(meta\\.intensity\\)/, "interpretation view must explain the same body intensity scale");\nassert.match(mobileRecordCss, /\\.screen-layout--record \\.sub-flow-save\\{[\\s\\S]*?background:var\\(--surface\\);[\\s\\S]*?color:var\\(--accent2\\)/, "mobile subflow return action must be visually secondary to final save");\n'''
              s = s.replace('\nconsole.log("recordInputBaselineParity.test.mjs: PASS");\n', assertions + '\nconsole.log("recordInputBaselineParity.test.mjs: PASS");\n')
              p.write_text(s)

          p = root / 'tests/interpretationSafetyState.test.mjs'
          s = p.read_text().replace('assert.match(bind,/normalizeEmbeddedBodyStatus\\(form\\);/);', 'assert.match(bind,/normalizeEmbeddedBodyStatus\\(form, platformEnhancement\\);/);')
          p.write_text(s)

          for rel in ['service-worker.js', 'ui/appVersionStatus.js', 'screens/shared/aboutScreen.js']:
              p = root / rel
              t = p.read_text()
              if '2026.10.06.1' not in t:
                  if '2026.10.05.5' not in t: raise SystemExit(f'version anchor missing: {rel}')
                  p.write_text(t.replace('2026.10.05.5', '2026.10.06.1'))
          PY
      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/interactions/recordInputInteractions.js
          node --check ui/subjectivePresentation.js
          node --check ui/interpretationRoomPresentation.js
          node tests/recordInputBaselineParity.test.mjs
          node tests/interpretationSafetyState.test.mjs
      - name: Verify all non-browser regressions
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for f in tests/*.test.mjs; do
            [[ "$f" == *mobileWalkJogBrowserFlow.test.mjs ]] || files+=("$f")
          done
          node --test "${files[@]}"
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runload-recordux-fix-20261006.yml
          git add ui/subjectivePresentation.js ui/interactions/recordInputInteractions.js ui/interpretationRoomPresentation.js styles/mobile-screen-layouts.css tests/recordInputBaselineParity.test.mjs tests/interpretationSafetyState.test.mjs service-worker.js ui/appVersionStatus.js screens/shared/aboutScreen.js
          git commit -m "Fix mobile body subflow and clarify intensity scale"
          git push origin HEAD:main
