name: Materialize mobile parity candidate

on:
  push:
    branches:
      - ui-parity/mobile-candidate
    paths:
      - ".github/mobile-parity-payload/**"
      - ".github/workflows/materialize-mobile-parity.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-parity/mobile-candidate
          fetch-depth: 0
      - name: Rebuild and verify runtime payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/mobile-parity-payload/part-*.b64 > /tmp/runload-mobile-parity.tar.xz.b64
          base64 --decode /tmp/runload-mobile-parity.tar.xz.b64 > /tmp/runload-mobile-parity.tar.xz
          echo "9d5059dcd5fb3511e91e6319b7c244b98d48f60cc5f773767d1dfa733d76c903  /tmp/runload-mobile-parity.tar.xz" | sha256sum -c -
          count="$(tar -tJf /tmp/runload-mobile-parity.tar.xz | grep -vc '/$')"
          test "$count" -eq 75
          tar -xJf /tmp/runload-mobile-parity.tar.xz -C .
      - name: Prepare parity checkpoint metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            find core icons screens styles ui -type f -print
            printf '%s\n' .nojekyll app.js index.html manifest.webmanifest service-worker.js
          } | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > RUNTIME_SHA256SUMS.txt
          test "$(wc -l < RUNTIME_SHA256SUMS.txt)" -eq 75

          cat > MOBILE_PARITY_STATUS.md <<'EOF'
          # RunLoad Mobile Prototype Parity Candidate

          Date: 2026-09-19
          Status: SMARTPHONE PROTOTYPE PARITY REVIEW CANDIDATE

          The smartphone UI is now based on the frozen 15-screen prototype DOM/layout authority rather than a CSS-only approximation.

          ## Verification before publication
          - Full integrated regression: 284 / 284 PASS
          - JS/MJS syntax: 80 / 80 PASS
          - Dedicated mobile prototype parity suite: 22 / 22 PASS
          - PWA precache: 70 entries / 0 missing
          - Accepted Formal V1.5R2 recheck: 136 / 136 PASS
          - core/runloadCore.js unchanged from the previously audited V1.1 runtime
          - core/secondPillarRofJ.js unchanged from the accepted/audited runtime
          - Runtime payload SHA-256: 9d5059dcd5fb3511e91e6319b7c244b98d48f60cc5f773767d1dfa733d76c903

          ## Current priority
          Smartphone visual/interaction parity is the approval target.
          PC layout receives a separate parity pass after smartphone approval.

          ## Current-only features
          Color/theme customization is retained as an intended product feature.
          Tutorial work is intentionally separated from prototype parity.
          Other current-app-only functions remain subject to later review and are not allowed to distort the frozen mobile layout during this phase.
          EOF

          git rm -rf .github/mobile-parity-payload .github/workflows/materialize-mobile-parity.yml >/dev/null 2>&1 || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI parity: materialize smartphone prototype candidate"
          git push origin HEAD:ui-parity/mobile-candidate
