name: RunLoad Stage 4A final cross-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage4a-final-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c47678b7d1190a34bdab7fd4a8eb8a42539d17ca"

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for file in "${files[@]}"; do node --check "$file" >/dev/null; done
          echo "JS syntax OK: ${#files[@]} files"

      - name: Audit persisted calculation-route authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'routeTrace' core/internal/primaryModelEngine.js
          grep -q 'appliedConditions' core/internal/primaryModelEngine.js
          grep -q 'notAppliedConditions' core/internal/primaryModelEngine.js
          grep -q 'PRIMARY_REGIONAL_V2_ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'route_trace_version:PRIMARY_REGIONAL_V2_ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'ROUTE_TRACE_VERSION' core/internal/primaryModelResults.js
          grep -q 'ROUTE_TRACE:' core/internal/primaryModelResults.js
          grep -q 'PERSISTED_ROUTE_TRACE_REQUIRED' core/interpretationCore.js
          grep -q 'resolutionBasis: "PERSISTED_CALCULATION_TRACE"' core/interpretationCore.js
          grep -q 'activeRoute: "PERSISTED_ROUTE_TRACE"' core/interpretationCore.js
          grep -q 'unsupportedInputs' core/interpretationCore.js
          ! grep -q -E 'PERSISTED_INPUTS_WITHOUT_SEGMENT_ROUTE_TRACE|PERSISTED_RESULT_DOES_NOT_RETAIN_FINAL_CONDITIONAL_ROUTE_TRACE|VERSION_LOCKED_REGION_ROUTE' core/interpretationCore.js
          ! grep -q 'SPEED_ONLY_PRIMARY_REGIONS' core/interpretationCore.js
          ! grep -q 'CONDITIONAL_PRIMARY_REGIONS' core/interpretationCore.js

      - name: Audit persisted-trace regression contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MISSING-PERSISTED-ROUTE-TRACE-IS-NOT-RECONSTRUCTED' tests/interpretationOutputContract.test.mjs
          grep -q 'R05-CADENCE-USES-PERSISTED-APPLIED-TRACE' tests/interpretationOutputContract.test.mjs
          grep -q 'R06-GRADE-USES-PERSISTED-APPLIED-TRACE' tests/interpretationOutputContract.test.mjs
          grep -q 'SEGMENTED-ROUTE-USES-PERSISTED-PER-SEGMENT-TRACE' tests/interpretationOutputContract.test.mjs
          grep -q 'PERSISTED-ROUTE-TRACE-IS-THE-INTERPRETATION-AUTHORITY' tests/interpretationArchitecture.test.mjs

      - name: Audit presentation boundary and version
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'Reference-100' screens/resultScreen.js
          ! grep -q -E 'P2 bridge|R01/R08|R10-R12' core/internal/primaryModelResults.js
          grep -q '確認できる資料範囲外・数値には未使用' ui/interpretationRoomPresentation.js
          grep -q '関連情報として記録（数値には未使用）' ui/interpretationRoomPresentation.js
          grep -q 'APP_VERSION = "2026.09.29.5"' ui/appVersionStatus.js
          grep -q 'running-record-app-runtime-2026.09.29.5' service-worker.js

      - name: Recheck retired Stage 2 paths
        shell: bash
        run: |
          set -euo pipefail
          active_paths=(app.js core screens ui docs service-worker.js)
          if grep -R -n -i -E 'v27|v2\.7|modelResultsV27|model-results-v2\.7|createModelResultV27Repository|v27Application|modelV27\.js|Current 93-input trace|93-input|93項目|formalInputCatalog|FORMAL_INPUT_CATALOG|RL-IN-090|RL-IN-091|RL-IN-092' "${active_paths[@]}" --exclude-dir=.git; then
            echo 'Retired Stage 2 residue found' >&2
            exit 1
          fi
          test ! -e core/internal/primaryInputCatalog.js
          test ! -e core/internal/modelV27.js
          test ! -e core/internal/v27ApplicationModel.js
          test ! -e core/internal/v27ApplicationServices.js

      - name: Confirm audit is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
