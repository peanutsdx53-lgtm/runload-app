name: Mobile home editing validation

on:
  push:
    branches:
      - mobile/home-editing-foundation-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-home-editing-validation.yml|index.html|service-worker.js|styles/mobile-home-editing.css|ui/interactions/homeInteractions.js|ui/screenInteractions.js)$' || true)"
          test -z "$unexpected"
          ! echo "$changed" | grep -Eq '^styles/(desktop|desktop-foundation)\.css$|^screens/|^core/'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify editing contract
        run: |
          set -euo pipefail
          grep -q 'LONG_PRESS_MS = 450' ui/interactions/homeInteractions.js
          grep -q 'pointerdown' ui/interactions/homeInteractions.js
          grep -q 'setPointerCapture' ui/interactions/homeInteractions.js
          grep -q 'running-record-mobile-home-layout-v1' ui/interactions/homeInteractions.js
          grep -q 'dock.length !== DEFAULT_LAYOUT.dock.length' ui/interactions/homeInteractions.js
          grep -q 'swapItems(source, target)' ui/interactions/homeInteractions.js
          grep -q 'home: bindHome' ui/screenInteractions.js
          grep -q 'is-home-editing' styles/mobile-home-editing.css
          grep -q 'mobile-home-drag-ghost' styles/mobile-home-editing.css
          grep -q './styles/mobile-home-editing.css' index.html
          grep -q './styles/mobile-home-editing.css' service-worker.js
          grep -q './ui/interactions/homeInteractions.js' service-worker.js
      - name: Verify stylesheet structure
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('styles/mobile-home-editing.css', 'utf8');
          let depth = 0;
          for (const ch of css) {
            if (ch === '{') depth += 1;
            if (ch === '}') depth -= 1;
            if (depth < 0) throw new Error('CSS brace underflow');
          }
          if (depth !== 0) throw new Error(`CSS brace mismatch: ${depth}`);
          NODE
      - name: Verify PWA precache paths
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
