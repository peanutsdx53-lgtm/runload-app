name: RunLoad Stage 1A2 gated verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage1a2.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify staged ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "acbaf00794f17358a858814bdc48a253a2555302"
          test "$(git rev-parse HEAD^^)" = "84b58803195ac95b875280e91977d6c450295f86"

      - name: Apply reviewed Stage 1A2 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check -p4 .github/runload-stage1a2.patch
          git apply -p4 .github/runload-stage1a2.patch

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 164
          for file in "${jsfiles[@]}"; do
            node --check "$file" >/dev/null
          done

      - name: Verify exact staged change set
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runload-stage1a2.patch
          git add -A
          printf '%s\n' \
            '.github/runload-stage1a2.patch' \
            'README.md' \
            'core/internal/evidenceData.js' \
            'core/internal/readingCatalog.js' \
            'screens/readingScreen.js' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 1A2: remove obsolete RPE reading paths'
          git push origin HEAD:main
