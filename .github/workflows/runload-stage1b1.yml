name: RunLoad Stage 1B1 gated cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage1b1.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify exact ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b3362b86ad3ef5fefad855680cbb186ad81163d3"
          test "$(git rev-parse HEAD^^)" = "a1068ebb523c4ce7a95fb47ec25af2a10d7272bb"

      - name: Remove obsolete hidden current-record fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}")
              p.write_text(s.replace(old,new,1))

          replace_once('screens/recordInputScreen.js', '<div class="inner-body environment-fields"><input type="hidden" name="weather" value="${escapeHtml(context.weather || "")}"><input type="hidden" name="windSummary" value="${escapeHtml(context.windSummary || "")}"><label class="field">', '<div class="inner-body environment-fields"><label class="field">')
          replace_once('screens/recordInputScreen.js', '</div><input type="hidden" name="reflectionKeyPoint" value="${escapeHtml(record.reflectionContext?.reflectionKeyPoint || "")}"><input type="hidden" name="memo" value=""><div hidden aria-hidden="true"><input type="hidden" name="sleepSummary" value=""><input type="hidden" name="nutritionHydrationSummary" value=""><input type="hidden" name="lifestyleNote" value=""><input type="hidden" name="consultationTarget" value=""><input type="hidden" name="consultationQuestion" value=""></div></div></details>', '</div><input type="hidden" name="memo" value=""></div></details>')

          replace_once('ui/interactions/recordInputInteractions.js', '    unexpectedSymptom: consultationFactsActive ? booleanValue(formData, "unexpectedSymptom") : false,\n    symptomContext: {\n      timing: String(formData.get("symptomTiming") || ""),\n      startedWhen: String(formData.get("symptomStartedWhen") || ""),\n      note: String(formData.get("symptomNote") || ""),\n    },\n', '')
          replace_once('ui/interactions/recordInputInteractions.js', '      weather: String(formData.get("weather") || ""),\n      temperatureC: optionalNumberValue(formData, "temperatureC"),\n      windSummary: String(formData.get("windSummary") || ""),\n', '      temperatureC: optionalNumberValue(formData, "temperatureC"),\n')
          replace_once('ui/interactions/recordInputInteractions.js', '    recoveryContext: {\n      sleepSummary: String(formData.get("sleepSummary") || ""),\n      nutritionHydrationSummary: String(formData.get("nutritionHydrationSummary") || ""),\n      lifestyleNote: String(formData.get("lifestyleNote") || ""),\n    },\n', '')
          replace_once('ui/interactions/recordInputInteractions.js', '      reflectionKeyPoint: String(formData.get("reflectionKeyPoint") || ""),\n', '')
          replace_once('ui/interactions/recordInputInteractions.js', '    consultationContext: {\n      consultationTarget: String(formData.get("consultationTarget") || ""),\n      consultationQuestion: String(formData.get("consultationQuestion") || ""),\n      consultationDataSelection: formData.getAll("consultationDataSelection").map(String),\n    },\n', '')
          replace_once('ui/interactions/recordInputInteractions.js', '  const hasSafetyInformation = Object.values(feedback.safetyFlags || {}).some(Boolean) || Boolean(feedback.unexpectedSymptom);', '  const hasSafetyInformation = Object.values(feedback.safetyFlags || {}).some(Boolean);')

          replace_once('ui/recordEmbeddedSubflows.js', '${renderSafetyFlags(fields)}<input type="hidden" name="unexpectedSymptom" value=""><input type="hidden" name="symptomTiming" value=""><input type="hidden" name="symptomStartedWhen" value=""><input type="hidden" name="symptomNote" value=""><label class="field">', '${renderSafetyFlags(fields)}<label class="field">')
          replace_once('ui/subjectivePresentation.js', '    unexpectedSymptom: feedback.unexpectedSymptom ? "1" : "__unchecked__",\n    symptomTiming: feedback.symptomContext?.timing || "",\n    symptomStartedWhen: feedback.symptomContext?.startedWhen || "",\n    symptomNote: feedback.symptomContext?.note || "",\n', '')

          replace_once('core/internal/applicationDomain.js', '  if (Boolean(feedback.unexpectedSymptom ?? feedback.symptomContext?.hasUnexpectedSymptom)) {\n    reviewReasons.push("unexpected_symptom_reported");\n  }\n', '')
          replace_once('core/internal/applicationDomain.js', '  if (hasSafetyFlag || Boolean(feedback.unexpectedSymptom ?? feedback.symptomContext?.hasUnexpectedSymptom)) {\n', '  if (hasSafetyFlag) {\n')
          replace_once('core/internal/applicationDomain.js', '  const unexpectedSymptom = Boolean(\n    input.unexpectedSymptom ?? input.symptomContext?.hasUnexpectedSymptom,\n  );\n', '')
          replace_once('core/internal/applicationDomain.js', '    unexpectedSymptom,\n', '')
          replace_once('core/internal/applicationDomain.js', '    unexpectedSymptom,\n', '')
          replace_once('core/internal/applicationDomain.js', '    symptomContext: Object.freeze({\n      timing: normalizeSingleLineText(input.symptomContext?.timing, 40),\n      startedWhen: normalizeSingleLineText(input.symptomContext?.startedWhen, 40),\n      triggers: Object.freeze(\n        Array.from(new Set(Array.isArray(input.symptomContext?.triggers)\n          ? input.symptomContext.triggers.map((value) => normalizeSingleLineText(value, 40)).filter(Boolean)\n          : [])).slice(0, 6),\n      ),\n      note: normalizePlainText(input.symptomContext?.note, 320),\n    }),\n', '')

          replace_once('core/internal/inputSupport.js', '    environmentContext: normalizeContextObject(input.environmentContext, { weather: "line", temperatureC: "number", windSummary: "line", environmentNote: 500 }),\n    recoveryContext: normalizeContextObject(input.recoveryContext, { sleepSummary: "line", nutritionHydrationSummary: "line", lifestyleNote: 500 }),\n    reflectionContext: normalizeContextObject(input.reflectionContext, { postRunReflection: 500, perceivedDifference: 500, reflectionKeyPoint: 500, nextCheckPoint: 500 }),\n    consultationContext: normalizeContextObject(input.consultationContext, { consultationTarget: "line", consultationQuestion: 500, consultationDataSelection: "tags" }),\n', '    environmentContext: normalizeContextObject(input.environmentContext, { temperatureC: "number", environmentNote: 500 }),\n    reflectionContext: normalizeContextObject(input.reflectionContext, { postRunReflection: 500, perceivedDifference: 500, nextCheckPoint: 500 }),\n')

          replace_once('core/internal/deterministicConsultation.js', '      reflection.reflectionKeyPoint ? `今回の主な気づき：${reflection.reflectionKeyPoint}` : "",\n', '')
          replace_once('core/internal/deterministicConsultation.js', '  const consultationContext = experience.record.consultationContext || {};\n  const dataSelection = normalizeDataSelection(consultationContext.consultationDataSelection, normalizedPurpose);\n  const audience = String(consultationContext.consultationTarget || "").trim();\n  const question = String(\n    consultationContext.consultationQuestion\n    || experience.feedback?.consultationNote\n', '  const dataSelection = normalizeDataSelection([], normalizedPurpose);\n  const audience = "";\n  const question = String(\n    experience.feedback?.consultationNote\n')

          replace_once('screens/readingScreen.js', '  const recovery = record.recoveryContext || {};\n', '')
          replace_once('screens/readingScreen.js', '  const hasNutritionHydrationContext = Boolean(\n    String(recovery.nutritionHydrationSummary || "").trim(),\n  );\n  const hasSleepContext = Boolean(String(recovery.sleepSummary || "").trim());\n  const hasRecordedContext = hasTemperature || [\n    environment.weather,\n    environment.windSummary,\n    environment.environmentNote,\n    recovery.nutritionHydrationSummary,\n    recovery.lifestyleNote,\n  ].some((value) => String(value || "").trim());\n', '  const hasRecordedContext = hasTemperature || Boolean(String(environment.environmentNote || "").trim());\n')
          replace_once('screens/readingScreen.js', '  if (hasNutritionHydrationContext) {\n    return recommendation("hydration-not-more-is-better", "水分のメモがある記録なので、量だけで見ない振り返り方を確認できます。");\n  }\n  if (hasSleepContext) {\n    return recommendation("sleep-not-hours-only", "睡眠のメモがある記録なので、時間以外も含めた見返し方を確認できます。");\n  }\n', '')
          replace_once('screens/readingScreen.js', '    return recommendation("context-not-single-cause", "天候や生活のメモを、ひとつの原因に決めずに見返すための記事です。");', '    return recommendation("context-not-single-cause", "環境メモを、ひとつの原因に決めずに見返すための記事です。");')

          replace_once('tests/interpretationSafetyState.test.mjs', '  assert.equal(feedback.unexpectedSymptom,false);', "  assert.equal(Object.prototype.hasOwnProperty.call(feedback,'unexpectedSymptom'),false);")
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do node "$test_file"; done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 164
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'core/internal/applicationDomain.js' \
            'core/internal/deterministicConsultation.js' \
            'core/internal/inputSupport.js' \
            'screens/readingScreen.js' \
            'screens/recordInputScreen.js' \
            'tests/interpretationSafetyState.test.mjs' \
            'ui/interactions/recordInputInteractions.js' \
            'ui/recordEmbeddedSubflows.js' \
            'ui/subjectivePresentation.js' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 1B1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 1B1: remove obsolete hidden record fields'
          git push origin HEAD:main
