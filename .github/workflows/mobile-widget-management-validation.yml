name: Mobile widget management validation

on:
  push:
    branches:
      - mobile/widget-management-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-widget-management-validation.yml|styles/base.css|styles/mobile-home-editing.css|ui/interactions/homeInteractions.js)$' || true)"
          test -z "$unexpected"
          ! echo "$changed" | grep -Eq '^styles/(desktop|desktop-foundation)\.css$|^screens/|^core/'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check ui/interactions/homeInteractions.js
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify widget editing contract
        run: |
          set -euo pipefail
          grep -q 'running-record-mobile-home-widgets-v1' ui/interactions/homeInteractions.js
          grep -q 'checkpoint' ui/interactions/homeInteractions.js
          grep -q 'data-home-widget-add' ui/interactions/homeInteractions.js
          grep -q 'data-home-widget-remove' ui/interactions/homeInteractions.js
          grep -q 'writeWidgetLayout' ui/interactions/homeInteractions.js
          grep -q 'finishWidgetDrag' ui/interactions/homeInteractions.js
          grep -q 'mobile-home-widget-picker' styles/mobile-home-editing.css
          grep -q 'mobile-home-widget-remove' styles/mobile-home-editing.css
          grep -q 'mobile-widget-jiggle' styles/mobile-home-editing.css
          ! grep -q 'アイコンをドラッグして移動できます。Dockとの入れ替えもできます。' ui/interactions/homeInteractions.js
      - name: Verify programmatic focus presentation
        run: |
          set -euo pipefail
          grep -q '#main-content h1\[tabindex="-1"\]:focus { outline: none; }' styles/base.css
          grep -q 'heading.focus()' ui/appShell.js
      - name: Verify stylesheet structure
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['styles/base.css','styles/mobile-home-editing.css']) {
            const css = fs.readFileSync(file, 'utf8');
            let depth = 0;
            for (const ch of css) {
              if (ch === '{') depth += 1;
              if (ch === '}') depth -= 1;
              if (depth < 0) throw new Error(`${file}: CSS brace underflow`);
            }
            if (depth !== 0) throw new Error(`${file}: CSS brace mismatch ${depth}`);
          }
          NODE
      - name: Verify PWA coverage
        run: |
          set -euo pipefail
          grep -q './styles/mobile-home-editing.css' service-worker.js
          grep -q './styles/base.css' service-worker.js
          grep -q './ui/interactions/homeInteractions.js' service-worker.js
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
