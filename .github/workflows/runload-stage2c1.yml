name: RunLoad Stage 2C1 gated dead-trace cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runload-stage2c1.yml'

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "edded35e249dd4afaa99a1eefa8405edf37d600d"

      - name: Remove dead fixed trace and retired RPE plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found: {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          def remove_between(path, start_marker, end_marker):
              p = Path(path)
              s = p.read_text()
              start = s.find(start_marker)
              end = s.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"markers not found: {path}: {start_marker!r} / {end_marker!r}")
              p.write_text(s[:start] + end_marker + s[end + len(end_marker):])

          # Retired fixed retained-input trace is no longer part of result creation or persistence.
          remove_between(
              'core/internal/primaryModelEngine.js',
              '// ===== core/model/primaryRegionalV2/primaryRegionalV2InputTrace.js =====\n',
              '// ===== core/model/primaryRegionalV2/primaryRegionalV2InputAdapter.js =====\n',
          )

          # Retired formal-trace bridge and app-retained trace are no longer consumed by current result creation.
          remove_between(
              'core/internal/primaryInputProcessing.js',
              '// ===== core/model/primaryRegionalV2/primaryRegionalV2TraceAdapter.js =====\n',
              '// ===== core/model/primaryRegionalV2/primaryRegionalV2AppAdapter.js =====\n',
          )
          replace_once(
              'core/internal/primaryInputProcessing.js',
              'const { RETAINED_INPUTS } = internalModules.primaryRegionalInputTrace;\nconst { buildPrimaryRegionalV2FormalInputTrace } = internalModules.primaryRegionalTraceAdapter;\n\n',
              '',
          )
          p = Path('core/internal/primaryInputProcessing.js')
          s = p.read_text()
          start = s.find('function rawRepairValue(name,record={},feedback={}){')
          end = s.find('function adaptCurrentRecordToPrimaryRegionalV2', start)
          if start < 0 or end < 0:
              raise SystemExit('app retained trace function block not found')
          p.write_text(s[:start] + s[end:])
          replace_once(
              'core/internal/primaryInputProcessing.js',
              'moduleExports["buildAppRetainedInputTrace"] = buildAppRetainedInputTrace;\n',
              '',
          )

          # The standalone RPE provenance helper is no longer referenced by current code.
          remove_between(
              'core/internal/inputSupport.js',
              '// ===== core/safety/rpeProvenance.js =====\n',
              '// ===== core/safety/inputValidation.js =====\n',
          )
          replace_once(
              'core/internal/inputSupport.js',
              '    validateProvidedNumber(errors, input, "perceivedExertion", 0, 10, "きつさは0〜10で入力してください。");\n',
              '',
          )

          # These options have no current consumer and existed only for the retired RPE normalization path.
          replace_once('core/internal/recordWorkflow.js', '      assumeExplicitRpe: true,\n', '')
          replace_once('core/internal/recordRepositories.js', '      assumeExplicitRpe: true,\n', '')

          replace_once(
              'docs/CODEBASE_ARCHITECTURE.md',
              '- `internal/inputSupport.js`: input safety, personal context, RPE provenance, and record validation.\n',
              '- `internal/inputSupport.js`: input safety, personal context, and record validation.\n',
          )

          # Regression guard: retired trace/RPE infrastructure must not return.
          p = Path('tests/currentOnlyRecordSchema.test.mjs')
          s = p.read_text()
          declaration_anchor = "const gradeDomainConfirmation = fs.readFileSync('ui/interactions/gradeDomainConfirmation.js', 'utf8');\n"
          declarations = """const primaryInputProcessing = fs.readFileSync('core/internal/primaryInputProcessing.js', 'utf8');
          const recordRepositories = fs.readFileSync('core/internal/recordRepositories.js', 'utf8');
          """.replace('          ', '')
          if declaration_anchor not in s:
              raise SystemExit('test declaration anchor not found')
          s = s.replace(declaration_anchor, declaration_anchor + declarations, 1)
          insert_before = "\nconst failed = results.filter((item) => item.status !== 'PASS');"
          new_test = """
          
          test('RETIRED-FIXED-TRACE-AND-RPE-PLUMBING-ARE-ABSENT', () => {
            assert.ok(!primaryModelEngine.includes('primaryRegionalInputTrace'));
            assert.ok(!primaryModelEngine.includes('RETAINED_INPUTS'));
            assert.ok(!primaryModelEngine.includes('Current 93-input trace'));
            assert.ok(!primaryInputProcessing.includes('buildAppRetainedInputTrace'));
            assert.ok(!primaryInputProcessing.includes('primaryRegionalTraceAdapter'));
            assert.ok(!primaryInputProcessing.includes('rawRepairValue'));
            assert.ok(!inputSupport.includes('RPE_PROVENANCE'));
            assert.ok(!inputSupport.includes('normalizeRpeProvenance'));
            assert.ok(!inputSupport.includes('reportedRpeValue'));
            assert.ok(!inputSupport.includes('validateProvidedNumber(errors, input, "perceivedExertion"'));
            assert.ok(!recordWorkflow.includes('assumeExplicitRpe'));
            assert.ok(!recordRepositories.includes('assumeExplicitRpe'));
          });
          """.replace('          ', '')
          if insert_before not in s:
              raise SystemExit('test insertion anchor not found')
          p.write_text(s.replace(insert_before, new_test + insert_before, 1))
          PY

      - name: Run all Node tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.mjs' | sort)
          test "${#tests[@]}" -eq 44
          for test_file in "${tests[@]}"; do
            echo "[TEST] $test_file"
            node "$test_file"
          done

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jsfiles < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          test "${#jsfiles[@]}" -eq 161
          for file in "${jsfiles[@]}"; do node --check "$file" >/dev/null; done

      - name: Verify retired residue is absent from current runtime
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'primaryRegionalInputTrace|buildAppRetainedInputTrace|RPE_PROVENANCE|normalizeRpeProvenance|reportedRpeValue|assumeExplicitRpe' \
            core app.js screens ui service-worker.js \
            --exclude-dir=.git

      - name: Verify exact change set
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          printf '%s\n' \
            'core/internal/inputSupport.js' \
            'core/internal/primaryInputProcessing.js' \
            'core/internal/primaryModelEngine.js' \
            'core/internal/recordRepositories.js' \
            'core/internal/recordWorkflow.js' \
            'docs/CODEBASE_ARCHITECTURE.md' \
            'tests/currentOnlyRecordSchema.test.mjs' | sort > /tmp/expected.txt
          git diff --cached --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified Stage 2C1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage 2C1: remove dead fixed trace and RPE plumbing'
          git push origin HEAD:main
