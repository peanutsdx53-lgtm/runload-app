name: Temporary codebase cleanup validation

on:
  push:
    branches:
      - refactor/codebase-cleanup-20260925
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and tests
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          while IFS= read -r file; do
            if ! node --check "$file"; then failures=$((failures + 1)); fi
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
          for file in tests/*.test.mjs; do
            echo "==> $file"
            if ! node "$file"; then failures=$((failures + 1)); fi
          done
          test ! -e RUNTIME_SHA256SUMS.txt
          test ! -e ui/hierarchicalExplanation.js
          ! grep -R -n -E 'RunLoad Journal|Runload Journal' --include='*.js' --include='*.html' --include='*.css' .
          echo "Validation failures: $failures"
          test "$failures" -eq 0
      - name: Generate cleanup audit report
        shell: bash
        run: |
          {
            echo "=== BRAND TERMS ==="
            grep -R -n -E 'RunLoad|Runload|runload' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== JOURNAL TERMS ==="
            grep -R -n -E 'Journal|journal' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== DEVELOPMENT TERMS ==="
            grep -R -n -E 'prototype|candidate|audit|handoff|temporary|tmp' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== HASH TERMS ==="
            grep -R -n -E 'SHA-256|SHA256|sha256' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
            echo
            echo "=== GENERATION TOKENS ==="
            grep -R -n -E '(--v[0-9]+|[-_]v[0-9]+|\bV[0-9]+\b)' app.js service-worker.js index.html manifest.webmanifest core screens ui styles docs README.md tests 2>/dev/null || true
          } > cleanup-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codebase-cleanup-audit
          path: cleanup-audit.txt
