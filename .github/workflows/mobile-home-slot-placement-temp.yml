name: Mobile home slot placement temporary validation

on:
  push:
    branches:
      - fix/mobile-home-slot-placement-20260926

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply slot-based smartphone home placement
        run: python .github/scripts/mobile-home-slot-placement-temp.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check ui/interactions/homeInteractions.js
          node --check ui/interactions/homeGridModel.js
          node tests/mobileHomeGridModel.test.mjs
          for test in tests/*.test.mjs; do node "$test" >/dev/null; done
          grep -q 'PAGE_EDGE_PX = 16' ui/interactions/homeInteractions.js
          grep -q 'PAGE_EDGE_DELAY_MS = 850' ui/interactions/homeInteractions.js
          grep -q 'POSITION_STORAGE_KEY' ui/interactions/homeInteractions.js
          grep -q 'mobile-home-drop-preview' styles/mobile-home-editing.css
          grep -q 'grid-auto-rows: 132px' styles/mobile-home-editing.css
          grep -q './ui/interactions/homeGridModel.js' service-worker.js
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "peanutsdx53-lgtm"
          git config user.email "peanuts.dx53@gmail.com"
          git add ui/interactions/homeInteractions.js ui/interactions/homeGridModel.js styles/mobile-home-editing.css service-worker.js tests/mobileHomeGridModel.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve smartphone home slot placement"
          git push
