  .mobile-home-widget-drag-ghost.mobile-home-widget-shell--size-medium,
  .mobile-home-widget-drag-ghost.mobile-home-widget-shell--size-large {
    width: min(calc(100vw - 40px), 420px);
  }
}
'''
          css.write_text(c)

