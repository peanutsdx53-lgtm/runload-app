  }

  .mobile-home-os.is-home-editing .mobile-home-grid-slot {
    border-color: color-mix(in srgb, var(--color-line) 45%, transparent);
    background: color-mix(in srgb, var(--color-surface) 22%, transparent);
  }

  .mobile-home-drop-preview {
