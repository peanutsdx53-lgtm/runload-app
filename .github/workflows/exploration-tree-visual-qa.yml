name: Exploration Tree Visual QA
on:
  pull_request:
    paths:
      - 'ui/explorationTreePresentation.js'
      - 'ui/explorationTreeData.js'
      - 'ui/interactions/explorationTreeInteractions.js'
      - 'styles/exploration-tree.css'
      - 'tests/explorationTreeVisualCapture.cjs'
      - '.github/workflows/exploration-tree-visual-qa.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real tree at desktop and mobile sizes
        run: node tests/explorationTreeVisualCapture.cjs
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-tree-visual-qa
          path: artifacts/exploration-visual-qa/
          if-no-files-found: warn
