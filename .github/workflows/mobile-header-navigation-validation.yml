name: Mobile header navigation validation

on:
  push:
    branches:
      - mobile/header-home-unification-20260926

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scoped changes
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(.github/workflows/mobile-header-navigation-validation.yml|index.html|service-worker.js|styles/mobile-navigation-unification.css|ui/appShell.js)$' || true)"
          test -z "$unexpected"
          ! echo "$changed" | grep -Eq '^styles/(desktop|desktop-foundation)\.css$'
          ! echo "$changed" | grep -Eq '^screens/|^core/'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | sort)
      - name: Run regression tests
        run: |
          set -euo pipefail
          for file in tests/*.test.mjs; do
            echo "Running $file"
            node "$file" >/dev/null
          done
      - name: Verify header Home policy
        run: |
          set -euo pipefail
          grep -q '\["record-input", "result", "history"\].includes(currentScreen)' ui/appShell.js
          grep -q 'backHref: "#/home", backLabel: "Home"' ui/appShell.js
          grep -q 'screen-layout--record' styles/mobile-navigation-unification.css
          grep -q 'screen-layout--result' styles/mobile-navigation-unification.css
          grep -q 'screen-layout--history' styles/mobile-navigation-unification.css
          grep -q 'screen-layout:not(.screen-layout--home)) > .primary-navigation' styles/mobile-navigation-unification.css
          grep -q 'display: none !important' styles/mobile-navigation-unification.css
          grep -q 'mobile-save-bar' styles/mobile-navigation-unification.css
          grep -q './styles/mobile-navigation-unification.css' index.html
          grep -q './styles/mobile-navigation-unification.css' service-worker.js
      - name: Verify smartphone stylesheet boundary
        run: |
          set -euo pipefail
          grep -q '@media (max-width: 54.99rem)' styles/mobile-navigation-unification.css
          ! grep -q '@media (min-width:' styles/mobile-navigation-unification.css
          node - <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('styles/mobile-navigation-unification.css', 'utf8');
          let depth = 0;
          for (const ch of css) {
            if (ch === '{') depth += 1;
            if (ch === '}') depth -= 1;
            if (depth < 0) throw new Error('CSS brace underflow');
          }
          if (depth !== 0) throw new Error(`CSS brace mismatch: ${depth}`);
          NODE
      - name: Verify PWA precache paths
        run: |
          set -euo pipefail
          node tests/interpretationRoomPwaIntegration.test.mjs >/dev/null
