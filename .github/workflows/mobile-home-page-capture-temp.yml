name: Mobile home page capture temporary validation

on:
  push:
    branches:
      - fix/mobile-home-page-gesture-20260927
    paths:
      - .github/workflows/mobile-home-page-capture-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refine capture timing
        run: |
          set -euo pipefail
          python3 tools/tmp_refine_page_capture.py
          git rm tools/tmp_refine_page_capture.py .github/workflows/mobile-home-page-capture-temp.yml
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Regression tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
      - name: Diff check
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          test ! -e tools/tmp_refine_page_capture.py
          test ! -e .github/workflows/mobile-home-page-capture-temp.yml
      - name: Commit validated refinement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine mobile page swipe capture timing"
          git push origin HEAD:fix/mobile-home-page-gesture-20260927
