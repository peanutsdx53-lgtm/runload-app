<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="走行記録を自己理解と自己判断の材料に整理するアプリ">
  <title>走行記録</title>
  <meta name="theme-color" content="#273a34">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="走行記録">
  <style>
    .app-boot{display:none}
    @media (max-width:54.99rem){
      html,body{min-height:100%;background:#eaf3f8}
      .app-boot{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#eaf3f8;color:#1e2b35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
      .app-boot__inner{display:grid;justify-items:center;gap:10px}
      .app-boot__mark{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#f8fcff,#d7e8f1);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px rgba(29,57,75,.15);font-size:24px;font-weight:900;color:#24546f}
      .app-boot strong{font-size:18px;letter-spacing:-.02em}
      .app-boot small{color:#667987;font-size:11px;font-weight:700}
      .app-boot__dots{display:flex;gap:5px;margin-top:2px}
      .app-boot__dots i{width:5px;height:5px;border-radius:50%;background:#46758e;animation:app-boot-dot .9s ease-in-out infinite alternate}
      .app-boot__dots i:nth-child(2){animation-delay:.15s}.app-boot__dots i:nth-child(3){animation-delay:.3s}
      @keyframes app-boot-dot{from{opacity:.3;transform:translateY(1px)}to{opacity:1;transform:translateY(-2px)}}
      @media (prefers-reduced-motion:reduce){.app-boot__dots i{animation:none;opacity:.65}}
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles/tokens.css">

  <link rel="stylesheet" href="./styles/interpretation-room.css">

  <link rel="stylesheet" href="./styles/run-measurement.css">
  <link rel="stylesheet" href="./styles/mobile-home.css">
  <link rel="stylesheet" href="./styles/mobile-home-editing.css">
  <link rel="stylesheet" href="./styles/mobile-record.css">
  <link rel="stylesheet" href="./styles/mobile-app-screens.css">
