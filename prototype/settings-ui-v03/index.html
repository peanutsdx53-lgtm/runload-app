<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<title>RunLoad Settings Prototype V0.3</title>
<style>
:root{--bg:#e3ebf1;--surface:#fbfdff;--surface2:#f4f8fa;--ink:#1e2630;--muted:#5d6d79;--line:#afc4d2;--accent:#2f6385;--accent2:#214964;--soft:#e1eef6;--shadow:0 14px 36px rgba(25,43,60,.08)}
*{box-sizing:border-box}html{background:#dce4ea}body{margin:0;background:#dce4ea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic UI","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}a,button{font:inherit;-webkit-tap-highlight-color:transparent}a{text-decoration:none;color:inherit}.app{width:min(100%,1180px);min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:86px}.topbar{height:60px;padding:11px clamp(15px,3vw,28px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}.topbar a{justify-self:start;color:var(--accent2);font-size:10px;font-weight:850}.topbar strong{font-size:12px}.badge{justify-self:end;font-size:8px;font-weight:900;color:var(--accent2);padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
main{width:min(100%,760px);margin:auto;padding:24px 14px 42px}.eyebrow{margin:0;color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.16em}.head h1{margin:4px 0 0;font-size:30px;letter-spacing:-.04em}.head p:last-child{margin:7px 0 0;color:var(--muted);font-size:9px;line-height:1.55}.group{margin-top:22px}.group-title{margin:0 2px 8px;font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.1em}.card{border:1px solid var(--line);border-radius:19px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}.row{width:100%;min-height:68px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left}.row:last-child{border-bottom:0}.row small,.row strong,.row span{display:block}.row small{font-size:7px;color:var(--muted)}.row strong{margin-top:2px;font-size:11px}.row span{margin-top:3px;color:var(--muted);font-size:8px}.value{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--accent2)!important;font-size:8px!important;font-weight:900}.theme-preview{margin-top:9px;padding:13px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--soft),var(--surface));display:grid;grid-template-columns:44px 1fr;gap:11px;align-items:center}.theme-preview i{width:44px;height:44px;border-radius:14px;background:var(--accent);box-shadow:inset 0 0 0 9px var(--soft)}.theme-preview small,.theme-preview strong,.theme-preview span{display:block}.theme-preview small{font-size:7px;color:var(--muted)}.theme-preview strong{font-size:11px;margin-top:2px}.theme-preview span{font-size:8px;color:var(--muted);margin-top:3px}
.note{margin:8px 2px 0;color:var(--muted);font-size:7.5px;line-height:1.5}
.bottom{position:fixed;left:50%;bottom:0;z-index:30;transform:translateX(-50%);width:min(100%,1180px);height:76px;padding:7px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(18px)}.bottom a{color:var(--muted);border-radius:12px;display:grid;place-items:center;align-content:center}.bottom a span{font-size:17px}.bottom a small{font-size:8px;margin-top:2px}.bottom a.active{color:var(--accent2);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:86px;z-index:100;transform:translate(-50%,14px);max-width:calc(100% - 28px);padding:9px 12px;border-radius:999px;background:#1f333b;color:white;font-size:9px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:880px){body{background:linear-gradient(90deg,#d5dfe4,#e6ecef 22%,#e6ecef 78%,#d5dfe4)}.app{width:min(calc(100% - 32px),1180px);margin:16px auto;border:1px solid var(--line);border-radius:28px;overflow:clip;box-shadow:0 28px 70px rgba(31,51,66,.12);padding-bottom:0}.bottom{position:static;transform:none;width:100%;height:74px}main{padding:32px 28px 52px}}
</style></head>
<body><div class="app">
<header class="topbar"><a href="../more-ui-v03/">‹ その他</a><strong>設定</strong><span class="badge">PROTOTYPE</span></header>
<main><section class="head"><p class="eyebrow">SETTINGS</p><h1>設定</h1><p>表示とデータ管理をまとめます。</p></section>

<section class="group"><p class="group-title">DISPLAY</p><div class="card">
<div class="row"><div><small>THEME</small><strong>表示テーマ</strong><span>現在の標準表示</span></div><span class="value">標準</span></div>
</div>
<div class="theme-preview"><i></i><div><small>CURRENT</small><strong>標準テーマ</strong><span>青系・現在のプロトタイプ基準</span></div></div>
<p class="note">他テーマは未採用です。全画面の最終デザイン調整時に必要性を判断します。</p>
</section>

<section class="group"><p class="group-title">DATA</p><div class="card">
<button class="row" type="button" data-pending="バックアップ／復元の実動作は正式統合時に接続します。"><div><small>BACKUP</small><strong>バックアップと復元</strong><span>保存データを管理</span></div><span class="value">›</span></button>
<a class="row" href="../privacy-ui-v01/"><div><small>PRIVACY</small><strong>データの扱い</strong><span>端末内保存・外部との境界</span></div><span class="value">›</span></a>
</div></section>

<section class="group"><p class="group-title">APP</p><div class="card">
<button class="row" type="button" data-pending="アプリ情報は正式統合時に整理します。"><div><small>ABOUT</small><strong>このアプリについて</strong><span>バージョン・説明</span></div><span class="value">›</span></button>
</div></section>
</main>
<nav class="bottom"><a href="../home-ui-v12/"><span>⌂</span><small>Home</small></a><a href="../record-ui-v14/"><span>＋</span><small>記録</small></a><a href="../result-ui-v20/"><span>◉</span><small>結果</small></a><a href="../history-ui-v13/"><span>▤</span><small>履歴</small></a><a class="active" href="../more-ui-v03/"><span>•••</span><small>その他</small></a></nav>
</div><div id="toast" class="toast" role="status"></div>
<script>const t=document.querySelector('#toast');let timer;document.addEventListener('click',e=>{const b=e.target.closest('[data-pending]');if(!b)return;t.textContent=b.dataset.pending;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1600)});</script>
</body></html>
